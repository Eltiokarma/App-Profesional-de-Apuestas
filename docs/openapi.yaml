openapi: 3.0.3
info:
  title: SAD API
  version: 0.1.0
  description: >
    Contrato entre el backend SAD (FastAPI + PostgreSQL, monolito modular con el
    paquete motor_sad) y los clientes (web SAD, UI PyQt). Espeja el pipeline
    sad → levels → constants → discreto documentado en MOTOR_SAD_EXTRACCION.md.
    El frontend web consume estos endpoints vía src/api/ cuando
    VITE_DATA_SOURCE=http.
servers:
  - url: http://localhost:8000/api/v1
    description: desarrollo local
  - url: https://api.CAMBIAR-DOMINIO.com/api/v1
    description: producción
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Estado del servicio, la DB y el último ciclo del pipeline
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /fixtures:
    get:
      summary: Lista de fixtures (filtrable por fecha, estado, liga, temporada, equipo y rival H2H)
      parameters:
        - { name: fecha, in: query, schema: { type: string, format: date } }
        - { name: desde, in: query, schema: { type: string, format: date, description: 'solo fixtures con fecha >= desde' } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoFixture' } }
        - { name: orden, in: query, schema: { type: string, enum: [asc, desc], default: desc, description: 'orden por fecha' } }
        - { name: ligaId, in: query, schema: { type: integer } }
        - { name: temporada, in: query, schema: { type: integer, description: 'solo fixtures de esta temporada de la liga' } }
        - { name: equipoId, in: query, schema: { type: integer, description: 'solo partidos de este equipo' } }
        - { name: rivalId, in: query, schema: { type: integer, description: 'con equipoId: solo enfrentamientos directos entre ambos (H2H); requiere equipoId' } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500, description: 'tope 500: un día con amistosos globales supera los 200 partidos' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Fixture' } }
  /fixtures/{id}:
    get:
      summary: Un fixture por id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fixture' }
        '404': { description: No existe }
  /fixtures/{id}/live:
    get:
      summary: Estado en vivo real del fixture (marcador, minuto, cuotas en juego)
      description: >
        Alimentado por la ingesta en vivo (SAD_LIVE_SEGUNDOS). `cuotas` es la
        última captura de odds en juego y `serie` el movimiento acumulado del
        partido (solo selecciones no suspendidas). Ambas vacías si la liga no
        tiene cobertura de odds live o la ingesta en vivo está apagada; el
        marcador/minuto salen de la tabla fixtures, refrescada por el mismo ciclo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureLive' }
        '404': { description: No existe }
  /fixtures/{id}/vip:
    post:
      summary: Marca/desmarca el partido como VIP ("este sí o sí, aunque cueste")
      description: >
        La marca vive en .vip_fixtures.json de la raíz de datos (no en las .db)
        y la lee el ciclo en vivo. Con plan sano, el VIP entra al rescate por
        fixture aunque su liga sea menor; con el plan y el respaldo agotados,
        el modo emergencia (SAD_EMERGENCIA_KEY, la clave que puede facturar
        excedente) le mantiene marcador y cuotas dentro de SAD_EMERGENCIA_TOPE.
        Caduca sola a las 8 h.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [fixtureId, vip]
                properties:
                  fixtureId: { type: integer }
                  vip: { type: boolean }
        '404': { description: No existe }
  /ligas/{ligaId}/refrescar:
    post:
      summary: Refresco forzado del marcador de una liga (el botón ⟳ de Partidos)
      description: >
        Escribe el pedido en .refresco_ligas.json (la raíz de datos, no las .db)
        y el próximo ciclo en vivo actualiza estado/marcador/minuto de todos los
        partidos en ventana de esa liga por /fixtures?ids= — presupuesto normal
        si queda, clave de emergencia si el plan está muerto. Solo marcador; las
        cuotas siguen sus reglas (VIP para pagarlas). Se consume al atenderse y
        caduca a los 15 min.
      parameters:
        - { name: ligaId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ligaId, pedido, fixtures]
                properties:
                  ligaId: { type: integer }
                  pedido: { type: boolean }
                  fixtures: { type: integer, description: 'partidos sin resultado que el ciclo va a refrescar (0 = nada que refrescar; -1 = no se pudo calcular)' }
        '404': { description: Liga sin fixtures en la base }
  /niveles/{equipoId}:
    get:
      summary: Historia de niveles del equipo (desc por fecha)
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: antesDe, in: query, schema: { type: integer }, description: 'id de fixture: solo lo ESTRICTAMENTE anterior a ese partido (vista «al día del partido», docs/REVENTON.md §9). 404 si no existe' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Nivel' } }
  /constantes/{equipoId}:
    get:
      summary: Historia de constantes K del equipo (desc por fecha)
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: antesDe, in: query, schema: { type: integer }, description: 'id de fixture: solo lo ESTRICTAMENTE anterior a ese partido (vista «al día del partido», docs/REVENTON.md §9). 404 si no existe' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Constantes' } }
  /constantes-cuota/{equipoId}:
    get:
      summary: 'k_cuota (§3.8): rachas de suma de cuota prepartido 1X2 y doble oportunidad, solo 2026 (asc por fecha)'
      description: Vacío si aún no se construyó constants_cuota (correr backend/backfill_cuota).
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConstanteCuota' } }
  /predicciones/{fixtureId}:
    get:
      summary: Ley de la Regresión al Nivel (gap) para un fixture
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prediccion' }
  /analisis-prepartido/{fixtureId}:
    get:
      summary: Reporte integral pre-partido (niveles + K + gap + resumen)
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalisisPrepartido' }
  /equipos:
    get:
      summary: Búsqueda inteligente de equipos (sin tildes, ranking por prefijo)
      parameters:
        - { name: buscar, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 60 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 25 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Equipo' } }
  /equipos/{equipoId}/stats:
    get:
      summary: Stats calculadas de los fixtures terminados (historia de la base) y la temporada en curso en `temporada`
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipoStats' }
        '404': { description: No existe }
  /equipos/{equipoId}/plantilla:
    get:
      summary: Plantilla con indicadores de jugadores (docs/JUGADORES.md)
      description: >
        Indicadores calculados en lectura de las tablas de jugadores de sad.db
        (ingesta backend.ingesta.jugadores): por-90 con encogimiento bayesiano
        hacia la media de la posición, grado de confianza por minutos (A/B/C),
        dependencia ofensiva HHI, bajas, recién llegados y DT. Sin ingesta de
        jugadores para el equipo, `jugadores: []` — nada se inventa.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plantilla' }
        '404': { description: No existe }
  /equipos/{equipoId}/calendario:
    get:
      summary: Calendario SAD — próximos partidos con el mapa de rivales (bloque G del EFE)
      description: >
        Las etiquetas contextuales del rival (RECIÉN ASCENDIDO, EN CRISIS,
        LOCAL FUERTE, VISITA DÉBIL, EQUIPO SORPRESA, BLOQUE BAJO, CLÁSICO)
        calculadas de sad.db con el criterio numérico del protocolo, cada una
        con el dato que la sostiene. 0 requests y 0 tokens: es el mismo bloque
        que antes deducía el modelo. `[]` si no hay fixtures programados.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: n, in: query, schema: { type: integer, default: 4, minimum: 1, maximum: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PartidoCalendario' } }
        '404': { description: No existe el equipo }
  /equipos/{equipoId}/burbujas:
    get:
      summary: Reventón de la burbuja — cuándo la K del equipo suele volver a cero (guía calculada, no probabilidad)
      description: >
        Por familia (total · local · visita): las burbujas cerradas de la K de
        resultado con la K pico, los partidos que duró y el rival que la reventó;
        media, mediana y moda de esas tres cosas por signo; la burbuja abierta
        hoy comparada con ellas (percentiles) y el próximo rival frente al nivel
        con el que suele reventar; qué constantes mandan según el nivel del
        equipo (alto o bajo → globales, medio → la de la condición); estabilidad
        (DT, ventana, bajas) como CONFIANZA de la guía, con lo que no está en la
        base declarado en `sinDato`. Riesgo por puntos, cada punto con su motivo.
        0 requests y 0 tokens (docs/REVENTON.md). Las K de goles quedan fuera a
        propósito por ahora.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: antesDe, in: query, schema: { type: integer }, description: 'id de fixture: la historia se corta ESTRICTAMENTE antes de ese partido y ese partido hace de próximo (rival, condición, nivel del rival a esa fecha); la plantilla de hoy no se usa (estabilidad sin dato). La misma construcción anti-hindsight del backtest. 404 si no existe, 400 si el equipo no lo juega' }
        - { name: proximo, in: query, schema: { type: integer }, description: 'id de fixture: ESE partido hace de próximo, con la historia entera. Sin él el próximo sale del calendario del equipo, que puede elegir un fixture viejo sin marcar. Cowork lo pasa siempre. 404 si no existe, 400 si el equipo no lo juega; se ignora si viene antesDe' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BurbujasEquipo' }
        '404': { description: No existe el equipo }
  /analisis/burbujas/backtest:
    get:
      summary: Backtest hacia atrás del reventón de burbuja sobre las .db del servidor (token maestro)
      description: >
        Recorre la historia de cada equipo y, en cada partido con burbuja abierta,
        rehace la guía solo con las filas anteriores (el rival real como próximo,
        sin fuga) y la compara con lo que pasó dentro de `horizonte` partidos de la
        condición. Devuelve la tasa de reventón por nivel de riesgo y por puntos
        (con AUC), el lift de cada señal, la separación por familia y por «manda»,
        la regla del nivel, el desglose por liga y `franjaAlta` (con qué umbral de
        percentil avisar «cerca del extremo»: frecuencia y tasa por candidato, y el
        propuesto por ruido, docs/REVENTON.md §10.1). `padron=true` = solo las ligas
        importantes (padrón único de las cuotas en vivo). No abierto a Cowork:
        es calibración, no un dato del parte (docs/REVENTON.md §8).
      parameters:
        - { name: padron, in: query, schema: { type: boolean, default: true } }
        - { name: horizonte, in: query, schema: { type: integer, default: 1, minimum: 1, maximum: 5 } }
        - { name: muestra, in: query, schema: { type: integer, default: 0, minimum: 0, maximum: 2000 }, description: 'equipos al azar (0 = todos)' }
        - { name: liga, in: query, schema: { type: integer }, description: 'solo partidos de esta league_id (manda sobre padron)' }
        - { name: minFilas, in: query, schema: { type: integer, default: 12, minimum: 10, maximum: 200 } }
        - { name: calibrar, in: query, schema: { type: boolean, default: false }, description: 'añade `calibracion`: regresión logística sobre las señales (rival graduado por distancia), coeficientes, puntos propuestos, tasa por puntos y cortes propuestos. Ajuste en muestra.' }
        - { name: lecciones, in: query, schema: { type: boolean, default: false }, description: 'añade `lecciones`: cada lección de los estudios de reventones (extremo, inflada, racha de otra competición, contramano, parón, burbujas enfrentadas, escala, DT/once/arquero suplente, ARQUERO-NO-FAVORITO, Perú vs resto) contra TODAS las burbujas abiertas: tasa encendida/apagada, lift, lift sobre el riesgo (estratificado por nivel), Wilson y cobertura. Lo guarda para GET /analisis/cowork/reventones/backtest' }
      responses:
        '200':
          description: Resumen del backtest (tablas por nivel, puntos, señal, familia, liga; ligasEvaluadas y equipos; calibracion si se pidió)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /fixtures/{fixtureId}/ficha:
    get:
      summary: Ficha de partido — plantillas + congestión de ambos equipos
      description: >
        El puente con los skills (EFE/DTP/timeline): JSON determinista con la
        plantilla de indicadores de local y visitante más la congestión de
        calendario (días de descanso, partidos en 21 días) calculada de los
        fixtures ya capturados (0 requests).
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaPartido' }
        '404': { description: No existe }
  /ligas/{ligaId}:
    get:
      summary: Metadatos de una liga (nombre, país, logo, bandera)
      parameters:
        - { name: ligaId, in: path, required: true, schema: { type: integer } }
        - { name: temporada, in: query, schema: { type: integer, description: 'para calcular las fases de esa temporada; default: la última' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liga' }
        '404': { description: No existe }
  /ligas/{ligaId}/standings:
    get:
      summary: Tabla de posiciones calculada de los fixtures terminados
      description: >
        Sin `fase`, la tabla del año (todos los partidos de la temporada). Con
        `fase` (Apertura/Clausura/… según lo nombre la región, tal cual viene en
        `league_round`), solo los partidos de esa fase: cada torneo corto arranca
        de cero. Las fases disponibles vienen en `Liga.fases`.
      parameters:
        - { name: ligaId, in: path, required: true, schema: { type: integer } }
        - { name: temporada, in: query, schema: { type: integer, description: 'default: última temporada' } }
        - { name: fase, in: query, schema: { type: string, description: 'nombre de la fase (Apertura, Clausura, …); default: tabla del año' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StandingRow' } }
  /cuotas/{fixtureId}:
    get:
      summary: Cuotas del fixture por mercado y selección
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cuota' } }
  /cuotas/{fixtureId}/casas:
    get:
      summary: Cuotas por casa de apuestas (última foto) para comparar dónde paga más
      description: >
        Una fila por casa y selección, orden mercado → selección → cuota desc.
        `mejor: true` marca la cuota más alta de cada selección (varias si empatan):
        la diferencia de decimales entre casas es la ventaja al elegir dónde apostar.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CuotaCasa' } }
  /cuotas/{fixtureId}/historial/fuentes:
    get:
      summary: Casas de referencia con historial propio para el fixture
      description: Nombres de casas (SAD_CASAS_REFERENCIA) con snapshots individuales, además de la media.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /cuotas/{fixtureId}/historial:
    get:
      summary: Historial de cuotas prepartido (snapshots de cada corrida de ingesta, asc por captura)
      description: >
        Cada corrida de la ingesta guarda en odds_history la media entre casas por
        mercado/selección, y el crudo de las casas de referencia. Sin `casa` se
        sirve la media; con `casa` el movimiento de esa casa. Vacío si el fixture
        aún no tiene snapshots.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: casa, in: query, schema: { type: string, description: 'nombre de la casa de referencia (default: media)' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CuotaSnapshot' } }
  /analisis/despensa:
    post:
      summary: Carga manual de la despensa (investigación hecha en el Claude de escritorio)
      description: >
        docs/DESPENSA_DESKTOP.md — la investigación cara (plantel, DT, bajas,
        táctica) se hace GRATIS en el Claude de escritorio (suscripción plana),
        se exporta como JSON y se deposita aquí. El siguiente EFE por API la
        recibe como datos_cacheados y no busca en la web (~$0.10-0.20 en vez
        del análisis frío). El nombre del equipo debe coincidir con el de la
        app; tipos válidos: dt, plantel, tabla, resultados, fixture,
        xi_reciente, bajas. Escribe efe.db (misma excepción documentada de
        solo-lectura que /analisis/efe).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CargaDespensa' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaDespensaResultado' }
        '422': { description: Cuerpo inválido o equipos vacío }
  /analisis/efe:
    post:
      summary: Lanza el análisis EFE de un fixture (respuesta inmediata, trabajo en el servidor)
      description: >
        Capa EFE+DTP (docs/efe-dtp/PLAN_ADAPTADO.md). El análisis tarda 1-3 min:
        el POST responde al instante — 'listo' con el registro si ya existe (0
        créditos), o 'generando' tras lanzar el trabajo en un hilo del backend
        (sobrevive aunque el cliente cierre). El frontend sondea
        /analisis/efe/estado/{fixtureId}. Escribe SOLO en efe.db (excepción
        documentada a la regla de solo lectura). 404 si el fixture no existe;
        503 sin ANTHROPIC_API_KEY.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtureId]
              properties:
                fixtureId: { type: integer }
                forzar:
                  type: boolean
                  default: false
                  description: Regenerar — descarta el análisis guardado y emite uno nuevo (consume créditos)
                permitirFrio:
                  type: boolean
                  default: false
                  description: >
                    Candado de análisis frío — por defecto, si faltan más de
                    SAD_EFE_MAX_FALTANTES campos (default 6) el análisis se
                    bloquea ANTES de gastar y el error guía a cargar la
                    despensa gratis; true = acepto pagar el frío (~$0.6-1.2).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/efe/estado/{fixtureId}:
    get:
      summary: Sondeo del trabajo de análisis EFE
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: listo (con registro) / generando / error (con detalle) / nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/efe/preflight/{fixtureId}:
    get:
      summary: Qué va a costar el EFE ANTES de generarlo (costo cero)
      description: >
        Resuelve exactamente las mismas fuentes que usaría /analisis/efe —
        despensa, sad.db, capa de jugadores— pero SIN llamar a ningún modelo y
        SIN gastar cuota de API-Football, y devuelve el origen de cada dato por
        equipo. Los `falta` son los que disparan búsqueda web, que es lo caro:
        el presupuesto es 3 + 2 × faltantes (techo SAD_EFE_BUSQUEDAS), y el
        candado de análisis frío bloquea por encima de SAD_EFE_MAX_FALTANTES.
        `costo` viene de las corridas realmente medidas cuando las hay
        (`medido: true`); si no, de la fórmula, y se dice cuál es cuál.
        404 si el fixture no existe.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreflightEfe' }
        '404': { description: El fixture no existe }
  /analisis/timeline:
    post:
      summary: Lanza el timeline comparativo del fixture (modo futbol-timeline)
      description: >
        Cronología de los dos equipos del fixture (últimos 6 meses por defecto)
        emitida por el modelo como JSON del esquema TIMELINE y renderizada por
        <TimelineComparativo>. Mismo patrón asíncrono y de regeneración que
        /analisis/efe; hereda alertas y colores del EFE previo si existe. El
        registro devuelto lleva tipo 'timeline' y su resultado es el TIMELINE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtureId]
              properties:
                fixtureId: { type: integer }
                forzar:
                  type: boolean
                  default: false
                  description: Regenerar — descarta el timeline guardado y emite uno nuevo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/timeline/estado/{fixtureId}:
    get:
      summary: Sondeo del trabajo de timeline
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: listo (con registro) / generando / error (con detalle) / nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/dtp:
    post:
      summary: Lanza el DTP (Diagnóstico Táctico de Partido) desde un equipo foco
      description: >
        Cadena rodante del protocolo DTP (docs/efe-dtp/DTP_DISENO.md):
        CIERRE del partido anterior (M4 autopsia de goles + M5 contraste) +
        APERTURA del próximo (M1 lectura del XI, M2 duelos por carril, M3 plan
        por fases, M6 contexto). Es POR EQUIPO FOCO: un mismo fixture puede
        tener dos DTP, uno por equipo. NO busca en la web — se alimenta de la
        ficha de partido (`/fixtures/{id}/ficha.tactica`); si esa ficha falta,
        responde 409 diciendo qué hay que correr en vez de inventar.
        Mismo patrón asíncrono que /analisis/efe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtureId, equipoFoco]
              properties:
                fixtureId: { type: integer }
                equipoFoco: { type: integer, description: 'equipoId del equipo desde el que se analiza' }
                forzar: { type: boolean, default: false }
      responses:
        '200':
          description: listo (con registro) / generando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
        '404': { description: El fixture no existe o el equipo no lo juega }
        '409': { description: Sin ficha de partido para analizar (correr backend.ingesta.ficha_partido) }
        '503': { description: Falta ANTHROPIC_API_KEY }
  /analisis/dtp/estado/{fixtureId}:
    get:
      summary: Sondeo del trabajo de DTP
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: equipoFoco, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: listo (con registro) / generando / error (con detalle) / nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /equipos/{equipoId}/cadena:
    get:
      summary: La película del equipo (cadena DTP)
      description: >
        Pronóstico → qué pasó → veredicto → lección, del partido más reciente
        hacia atrás. `[]` si aún no se generó ningún DTP del equipo.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EslabonDtp' }
        '404': { description: No existe el equipo }
  /analisis/partido/{fixtureId}:
    get:
      summary: Análisis emitidos para un fixture (lectura pura, cero créditos)
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK ([] si no hay análisis)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AnalisisRegistro' } }
  /analisis/cowork/agenda:
    get:
      summary: Los partidos del día ordenados por prioridad (paso 1 del batch de Cowork)
      description: >
        Calculado de nuestra base con el criterio del protocolo (Liga 1 Perú, derbi de
        ciudad, copa internacional, liga grande con equipo arriba o en crisis, choque del
        top 6 europeo). Sin `fecha` ni `desdeAhora`: desde ahora y por 24 h, a la hora que
        se corra. La fase de grupos / fase liga internacional y las segundas divisiones
        quedan fuera por defecto (`grupos` / `segundas` las meten). Los descartados viajan
        con su motivo. Cero créditos.
      parameters:
        - { name: fecha, in: query, schema: { type: string, format: date }, description: 'un día concreto (UTC); sin él, desde ahora y por 24 h' }
        - { name: limite, in: query, description: 'cuántos partidos SIN parte entran (los que ya tienen parte no ocupan cupo y van siempre, en yaHechos); sin él, el cupo del día (16, o SAD_AGENDA_LIMITE)', schema: { type: integer, default: 16, minimum: 1, maximum: 30 } }
        - name: ligaId
          in: query
          schema: { type: integer }
          description: 'acota a una liga (mando manual para apuntar el batch sin tocar el padrón)'
        - name: liga
          in: query
          schema: { type: string, maxLength: 60 }
          description: 'acota por TEXTO: las ligas del padrón cuyo país o nombre contiene esto («España», «LaLiga», «Perú»); la respuesta lista `filtro.ligasQueCasan`'
        - name: grupos
          in: query
          schema: { type: boolean, default: false }
          description: 'incluir la fase de grupos / fase liga de los torneos internacionales (fuera por defecto; la fase decisiva entra siempre)'
        - name: segundas
          in: query
          schema: { type: boolean, default: false }
          description: 'incluir las segundas divisiones (fuera por defecto)'
        - name: desdeAhora
          in: query
          schema: { type: boolean, default: false }
          description: >
            ventana rodante desde este momento en vez del día natural. De noche el día UTC
            ya cambió respecto al local, y un filtro por fecha se comería justo los partidos
            de esta noche.
        - { name: horas, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 72 } }
        - name: incluirDescartados
          in: query
          schema: { type: boolean, default: false }
          description: 'los de prioridad 0 entran al final de la lista, con su motivo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaCowork' }
  /analisis/cowork/pendientes:
    get:
      summary: Partes que todavía esperan el once
      parameters:
        - { name: limite, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PartePendiente' }
  /analisis/cowork:
    post:
      summary: Deposita el parte de análisis de un partido (idempotente por fixtureId)
      description: >
        El camino barato: Cowork escribe el análisis con la suscripción y lo deposita.
        NO hay que mandar total, máximo alcanzable, porcentaje, clasificación, IP,
        reducción por zona, ramas A/B, F3, F4 ni los nombres/fecha del partido: todo eso
        lo calcula el backend y se ignora si llega. Ver docs/COWORK.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParteCoworkEntrada' }
      responses:
        '200':
          description: Recibo del depósito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReciboParte' }
        '422': { description: 'fixtureId ausente o desconocido, o equipos vacíos' }
  /analisis/cowork/{fixtureId}:
    get:
      summary: El parte con lo calculable ya calculado (lectura pura, cero créditos)
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParteCowork' }
        '404': { description: No hay parte para ese fixture }
    delete:
      summary: Descarta el parte (y su once) para volver a depositarlo limpio
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Borrado }
        '404': { description: No hay parte para ese fixture }
  /analisis/cowork/{fixtureId}/xi:
    post:
      summary: Llega el once y se cierra el bloque F — en local, gratis y al instante
      description: >
        Tres caminos: `desdeFicha` (lo que ya capturó API-Football), el once a mano en
        `a`/`b` (el pantallazo que el usuario le pasa a Cowork), o los dos mezclados.
        Recalcula IP, reducción por zona, F3 y F4 con las fórmulas del protocolo: ningún
        modelo interviene. Si el once no casa con la tabla del parte (menos de 7 nombres),
        el bloque NO se cierra y se devuelve el conflicto declarado. La procedencia es
        dato: un lado que ya viene de la ficha no se pisa a mano salvo `reemplazar: true`;
        lo conservado vuelve en `xiConservados` (lado → {fuente, capturadoEn, porque}).
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                a: { $ref: '#/components/schemas/XiLado' }
                b: { $ref: '#/components/schemas/XiLado' }
                desdeFicha: { type: boolean, default: false }
      responses:
        '200':
          description: El parte recalculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParteCowork' }
        '409': { description: 'No hay parte, o la ficha todavía no trae alineaciones' }
  /analisis/cowork/xi/auto:
    post:
      summary: Cierra el bloque F de todos los partes cuya alineación ya está ingestada
      description: >
        **El once no necesita al modelo.** Cerrar el bloque F es cruzar dos listas de
        nombres y aplicar los pesos de rol: aritmética que vive en `bloque_f.py`. Por eso
        seis partidos que arrancan juntos no son seis análisis contra el reloj, son seis
        cierres de milisegundos — la carrera de 30 minutos no existe.


        Idempotente: un lado que ya viene de la ficha no se vuelve a tocar. LA FICHA MANDA
        SOBRE LA CARGA MANUAL: un lado pegado a mano (el pantallazo existe porque la ficha
        no había llegado) se reemplaza cuando la ficha llega, y sale en `reemplazados` con
        su `fuenteAnterior`. Lo que no se pudo cerrar sale con el motivo. `sinFichaTodavia`
        son los que necesitan el pantallazo a mano, y `conConflicto` los que casan con
        menos de 7 nombres de la tabla F1 — ahí no se fuerza nada: un IP inventado es peor
        que un bloque abierto.
      parameters:
        - { name: limite, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisados: { type: integer }
                  cerrados: { type: array, items: { type: object, additionalProperties: true } }
                  reemplazados:
                    type: array
                    description: 'lados que estaban a mano y ahora vienen de la ficha: {fixtureId, lado, fuenteAnterior}'
                    items: { type: object, additionalProperties: true }
                  conConflicto: { type: array, items: { type: object, additionalProperties: true } }
                  nuncaVaALlegar:
                    type: array
                    description: >
                      Partidos YA TERMINADOS cuya liga no da alineaciones por API-Football.
                      No están esperando nada: reintentar no sirve, y el pantallazo a mano
                      es el procedimiento para esa liga, no la excepción.
                    items: { type: object, additionalProperties: true }
                  ligasSinOnce:
                    type: array
                    description: 'ligas que no dan onces: para verlo como patrón, no caso por caso'
                    items: { type: integer }
                  sinFichaTodavia: { type: array, items: { type: object, additionalProperties: true } }
                  nota: { type: string }
  /analisis/jev/ping:
    get:
      summary: ¿La clave de Jev sirve? Una pregunta trivial, con su modelo, latencia y costo
      description: >
        Hace UNA llamada mínima a Jev (docs/JEV.md) y devuelve qué modelo respondió, cuánto
        tardó y cuántos tokens costó. Sin clave no sale a la red y lo dice; con clave mala
        o límite excedido devuelve el error tal cual. Gasta milésimas de centavo: token
        MAESTRO, denegado para Cowork.
      tags: [analisis]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponible: { type: boolean, description: 'la clave está puesta' }
                  ok: { type: boolean, description: 'respondió y contestó bien a la pregunta trivial' }
                  modelo: { type: string, nullable: true, description: 'la versión exacta (jev-1.13.0)' }
                  via: { type: string, description: 'host que respondió' }
                  oficial: { type: boolean }
                  ms: { type: integer }
                  tokensEntrada: { type: integer }
                  respuesta: { type: object, additionalProperties: true }
                  error: { type: string, nullable: true }
  /analisis/cowork/revisor:
    get:
      summary: El reporte del día del revisor de coherencia (Jev)
      description: >
        Qué encontró el revisor (docs/JEV.md), qué hizo Cowork con eso y cuánto costó,
        para quien mira el pipeline al final del día y no parte por parte. Por fixture se
        lee la SECUENCIA de evaluaciones (cada depósito vuelve a evaluar) y de ahí sale la
        reacción: `limpio`, `corrigio`, `corrigioParte`, `sostuvo`, `sinReaccion` o
        `noEvaluado` (simulado sin clave, o error). `paraMirar` son los partes con
        hallazgos que Cowork no corrigió. Sin `dia`, las últimas `horas` hacia atrás.
      tags: [analisis]
      parameters:
        - { name: horas, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 336 } }
        - { name: dia, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: 'YYYY-MM-DD en UTC; acota a ese día en vez de a las últimas horas' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisorDiario' }
  /analisis/cowork/incidencias:
    get:
      summary: Lo que las corridas vieron roto, por estado
      description: >
        Cada corrida (partes, veredictos, reventones) deposita su «Roto o a mirar» acá y la
        rutina de mantenimiento (`corrida-sad`, modo `mantenimiento`) lo lee, lo verifica, lo
        arregla con tests o lo deriva. Por defecto las abiertas, las que bloquean y las más
        repetidas primero; `estado=todas` trae todo.
      parameters:
        - { name: estado, in: query, schema: { type: string, default: abierta, enum: [abierta, en_curso, resuelta, dato_api, por_diseno, usuario, descartada, aprobada, por_desplegar, todas] } }
        - { name: limite, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidencias: { type: array, items: { $ref: '#/components/schemas/Incidencia' } }
                  porEstado: { type: object, additionalProperties: { type: integer } }
                  nota: { type: string }
    post:
      summary: La corrida deposita sus incidencias
      description: >
        `{origen, corrida?, items: [{titulo, area, severidad?, detalle?, fixtureId?}]}`. Una
        abierta con el mismo título normalizado (y el mismo partido) no se duplica: suma
        `veces`. Si una ya resuelta vuelve a aparecer, entra NUEVA: el parche no alcanzó. Abierto
        al token acotado (solo escribe la tabla `incidencia`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origen, items]
              properties:
                origen: { type: string, enum: [partes, veredictos, reventones, mantenimiento, usuario, escaneo] }
                corrida: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [titulo]
                    properties:
                      titulo: { type: string }
                      area: { type: string, enum: [dt, once, ficha, tde, dtp, f1, timeline, reventon, burbujas, agenda, latido, cuotas, api, contrato, skill, aprendizaje, otro] }
                      severidad: { type: string, enum: [bloquea, error, aviso], default: error }
                      detalle: { type: string }
                      fixtureId: { type: integer, nullable: true }
      responses:
        '200':
          description: qué entró nuevo, qué se sumó y qué se rechazó
          content:
            application/json:
              schema:
                type: object
                properties:
                  nuevas: { type: array, items: { type: integer } }
                  repetidas: { type: array, items: { type: integer } }
                  rechazos: { type: array, items: { type: object, additionalProperties: true } }
        '422': { description: origen desconocido o sin items }
  /analisis/cowork/incidencias/causas:
    get:
      summary: Las familias de causa, para no investigar dos veces lo mismo
      description: >
        27/10/2026, pedido del usuario. Junta las incidencias que son la misma causa escrita con
        otras palabras (3+ palabras compartidas y 60 % de las del título más corto). Cada
        familia trae su `conocida` (la última cerrada, con la resolución), `recurrente` (un
        dato_api visto en 3+ partidos distintos sin que nadie haya decidido: se lleva al usuario
        con una regla de código propuesta) y `reaparece` (se reportó de nuevo después de un PR:
        el parche no alcanzó). Es una pista: no cierra nada.
      parameters:
        - { name: recurrentes, in: query, schema: { type: boolean, default: false, description: 'solo las recurrentes y las que reaparecen' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  causas:
                    type: array
                    items:
                      type: object
                      properties:
                        raiz: { type: integer }
                        titulo: { type: string }
                        area: { type: string }
                        ids: { type: array, items: { type: integer } }
                        incidencias: { type: integer }
                        veces: { type: integer }
                        fixtures: { type: integer }
                        fixturesDatoApi: { type: integer }
                        porEstado: { type: object, additionalProperties: { type: integer } }
                        abiertas: { type: array, items: { type: integer } }
                        ultimaVez: { type: string }
                        conocida: { $ref: '#/components/schemas/IncidenciaConocida' }
                        recurrente: { type: boolean }
                        reaparece: { type: boolean }
                  total: { type: integer }
                  regla: { type: string }
  /analisis/cowork/incidencias/{incId}/decision:
    post:
      summary: El usuario decide una incidencia que le tocaba (llave maestra, no Cowork)
      description: >
        Solo sobre una en `usuario`. `aprobar: true` la pasa a `aprobada`: el mantenimiento la
        implementa en su próxima pasada, antes que las abiertas. `aprobar: false` la deja
        `por_diseno` (cerrada) con la decisión y la propuesta que se rechazó.
      parameters:
        - { name: incId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprobar]
              properties:
                aprobar: { type: boolean }
                nota: { type: string }
      responses:
        '200':
          description: la incidencia decidida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incidencia' }
        '404': { description: no existe }
        '422': { description: no está en `usuario` }
  /analisis/cowork/incidencias/{incId}/estado:
    post:
      summary: Qué se hizo con una incidencia
      description: >
        `{estado, resolucion, pr?}`. Cerrar o derivar (resuelta, dato_api, por_diseno, usuario,
        descartada, por_desplegar) EXIGE `resolucion`: cerrar callado es esconderla.
        `por_desplegar` (27/10/2026): el PR está mergeado pero `/health.commit` todavía no
        lo contiene; NO cierra la incidencia, la pasada siguiente la confirma.
      parameters:
        - { name: incId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [abierta, en_curso, resuelta, dato_api, por_diseno, usuario, descartada, por_desplegar], description: '`aprobada` NO se pone por acá: es la decisión del usuario (POST …/decision)' }
                resolucion: { type: string }
                pr: { type: string }
      responses:
        '200':
          description: la incidencia actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incidencia' }
        '404': { description: no existe }
        '422': { description: estado desconocido o cierre sin resolución }
  /analisis/cowork/rehacer:
    get:
      summary: ¿Hay algún parte con DTP-REHACER a punto de arrancar? (la comprobación barata de la rutina)
      description: >
        22/10/2026: la rutina de rehacer dispara cada 30 minutos y casi siempre no hay nada. En UNA
        llamada: los partes sin veredicto cuyo partido (NS) arranca entre `desdeMin` y `hastaMin`
        minutos (`enVentana`) y, de esos, los que traen DTP-REHACER o DT-VS-BANCO (el once oficial
        sienta a otro entrenador que el del parte, incidencia 711) en sus alertas (`pendientes`).
        `pendientes` vacío = la corrida termina en una línea. Abierto al token acotado (GET de
        /analisis/cowork).
      parameters:
        - { name: desdeMin, in: query, schema: { type: integer, default: 5, minimum: 0, maximum: 240 }, description: 'piso en 15 desde el 24/10/2026 y en 5 desde el 31/10/2026 (rehacer cada 20 min, incidencia 636): el once llega ~25 min antes. Sin el parámetro, la ventana vigente del servidor' }
        - { name: hastaMin, in: query, schema: { type: integer, default: 80, minimum: 1, maximum: 240 } }
      responses:
        '200':
          description: La ventana y lo que hay que rehacer
          content:
            application/json:
              schema:
                type: object
                properties:
                  ahora: { type: string }
                  ventanaMin: { type: array, items: { type: integer } }
                  partesEnVentana: { type: integer }
                  enVentana:
                    type: array
                    items:
                      type: object
                      properties:
                        fixtureId: { type: integer }
                        partido: { type: string }
                        pitazo: { type: string }
                        minutosAlPitazo: { type: integer }
                  pendientes:
                    type: array
                    description: 'los de enVentana con DTP-REHACER, con esas alertas en `alertas`'
                    items: { type: object }
                  nota: { type: string }
  /analisis/cowork/contrato:
    get:
      summary: La forma del cuerpo del POST del parte, derivada de las constantes que validan
      description: >
        `/openapi.json` está apagado en despliegue (expone también lo que gasta dinero) y
        quien deposita no puede adivinar la forma: esto sale de los mismos `_CLAVES_*` que
        rechazan en backend/analisis/parte.py, así que no se desincroniza del código.
        Abierto a Cowork.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /analisis/cowork/escaneo:
    get:
      summary: El escaneo preventivo de lo básico, antes de que un parte se escriba encima
      description: >
        30/10/2026, pedido del usuario: no esperar a que un analista tropiece con un dato
        malo. Recorre la agenda de las próximas `horas` y las partes jugadas en las últimas
        `jugadosHoras` con una lista de chequeos (`chequeos`, cada uno con la regla de fútbol
        que cuida, su área y su severidad): sancionados de la base y partes que los tienen
        disponibles, el mismo jugador dos veces en la tabla F1, equipo sin plantilla, DT sin
        confirmar, un equipo con dos partidos a pocas horas, sin cuota prepartido a menos de 12
        h, partes jugados sin ninguna versión del once antes del pitazo y fichas sin eventos.
        `porChequeo` agrupa (hallazgos y partidos) y `hallazgos` trae cada uno con su partido,
        lado y detalle. Solo lee, 0 requests, 0 tokens; el mantenimiento deposita cada
        chequeo con hallazgos como UNA incidencia. Abierto a Cowork.
      parameters:
        - { name: horas, in: query, schema: { type: integer, default: 36, minimum: 1, maximum: 168 } }
        - { name: jugadosHoras, in: query, schema: { type: integer, default: 48, minimum: 1, maximum: 336 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /analisis/cowork/latido:
    get:
      summary: ¿Está corriendo el pipeline, o lleva días muerto en silencio?
      description: >
        Una tubería automática sin vigilancia no falla con ruido: falla callada, y se
        descubre semanas después cuando alguien va a mirar una métrica y no hay casos.
        Esto contesta de una sola llamada las cuatro señales que delatan la caída: nada
        depositado en la ventana, partidos de la agenda de ayer sin parte, veredictos
        vencidos y onces sin cerrar.


        **El silencio cuenta como fallo.** Cero partes en la ventana devuelve `rojo`, no
        «sin novedad» — que es la diferencia entre un monitor y un adorno. `coberturaDeAyer`
        es la señal que no se puede deducir mirando solo los partes: compara contra lo que
        la agenda habría elegido.


        No dispara nada ni corrige nada: solo mira y dice.
      parameters:
        - name: horas
          in: query
          description: 'ventana para contar depósitos; por debajo de ella, el silencio es rojo'
          schema: { type: integer, default: 36, minimum: 1, maximum: 336 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatidoCowork' }
  /analisis/cowork/marcas:
    get:
      summary: ¿Cuáles de estos partidos ya tienen parte de Cowork?
      description: >
        La marca al costado de cada tarjeta en la lista de partidos: sin abrir el partido
        se ve si el análisis pasó y en qué punto está (once cerrado, veredicto). Se pide
        por ids y no por fecha porque el día de la pantalla es local y el de la base es
        UTC. Solo vienen los fixtures que tienen parte.
      parameters:
        - { name: ids, in: query, description: 'fixtureIds separados por coma (máx. 300)', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarcasCowork' }
  /analisis/cowork/dtp/{fixtureId}:
    get:
      summary: Los insumos del DTP que salen de NUESTRA base (abierto a Cowork)
      description: >
        No es el DTP: son los insumos de la ficha de partido ya ingestada, por lado. El partido
        anterior (marcador, goles con minuto, autor y asistente, si cuadran con el marcador,
        minutos ganando/empatando/perdiendo, posesión atada al rival y al marcador —regla de
        posesión condicional—, stats, XI de referencia con carriles), los cambios de XI contra el
        anterior, las parejas de la misma línea que nunca arrancaron juntas en lo capturado, los
        días de descanso, si es primera fecha, el candidato a MECANISMO-ABIERTO (≥2 recibidos),
        `casosBloque` (DTP v1.4: los casos de la pregunta 6 que dejaron los cierres sobre el bloque
        de ESE equipo —`sostuvo`, `caso`, `conUnoMenos`, `deParte`, `fecha`—, solo de partes
        anteriores; la apertura del rival los lee para responder la 6; v1.6: con `sede` y
        `competicion`), `penales` (DTP v1.6: quién tiró los penales del equipo en el último año,
        con convertidos y errados, de los eventos de la ficha; el ejecutor sale de acá; cada uno
        con `enPlantilla` —false si ya no está en el plantel de hoy o su última hoja es con otro club, que viaja en `juegaEn` (1029), y entonces no encabeza—) y
        `ultimoOnceDeLiga` (si el último partido fue de copa: el último once de liga, formación y grid; 966);
        `aperturaPrevia` (la del último partido CON parte, con su `fixtureId`; 997; si no es el último partido, `cierreContra` trae el marcador y los goles de ESE partido, que es contra el que se valida el cierre, 1035): lo que se declaró ANTES del partido anterior, contra lo que se valida el
        cierre. Lo que es juicio va en `noCalculables`. 0 tokens, 0 requests.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { description: el fixture no está en nuestra base }
  /analisis/cowork/reventones:
    get:
      summary: Los reventones que valen un estudio hacia atrás
      description: >
        Burbujas de la familia total con ≥ 3 partidos, o de 2 con la K pico sobre la mediana
        de su signo en ese equipo, de los equipos de la liga en los últimos `meses`. Dos tipos:
        `racha_positiva_revienta` y `racha_negativa_se_corta`. Cada uno dice si hay ficha del
        partido (`conFicha.eventos`, `conFicha.once`) y si ya está estudiado; primero los que
        tienen ficha y no están estudiados. 0 tokens, 0 requests. Abierto a Cowork.
      parameters:
        - { name: liga, in: query, required: true, schema: { type: integer }, description: 'Liga 1 Perú = 281' }
        - { name: meses, in: query, schema: { type: integer, default: 6, minimum: 1, maximum: 36 } }
        - { name: limite, in: query, schema: { type: integer, default: 60, minimum: 1, maximum: 300 } }
        - { name: conFicha, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /analisis/cowork/reventones/backtest:
    get:
      summary: El último backtest de las lecciones, GUARDADO (se lee, no se corre)
      description: >-
        Lo que dejó la última corrida con `lecciones=true` (o el CLI `backtest_burbuja --lecciones`):
        por lección, tasa de reventón encendida/apagada, lift, lift sobre el riesgo y cobertura, más el
        bloque descriptivo del arquero del no favorito. Abierto a Cowork: leer no cuesta; correrlo sigue
        siendo del token maestro.
      responses:
        '200': { description: el resumen guardado con `corridoEn`, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { description: todavía no se corrió }
  /analisis/cowork/reventones/resumen:
    get:
      summary: Lo estudiado junto, por tipo de reventón
      description: >
        Por tipo, cuántos estudios por mecanismo y por señal previa. Frecuencia entre
        reventones ESTUDIADOS, no probabilidad de reventar (falta el denominador de las
        burbujas que no reventaron).
      parameters:
        - { name: liga, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /analisis/cowork/reventones/{fixtureId}/{equipoId}:
    get:
      summary: El reventón al día del partido
      description: >
        La burbuja y el nivel de los dos equipos con la historia cortada ESTRICTAMENTE antes del
        partido (`alDia`), la ficha táctica, el DT de cada banco, el estudio si existe y las
        listas cerradas de `mecanismos` y `senales`.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { description: el equipo no juega ese partido }
  /analisis/cowork/reventones/{fixtureId}/{equipoId}/estudio:
    post:
      summary: Guarda el estudio de un reventón
      description: >
        `mecanismo` (obligatorio) y `mecanismoSecundario` de la lista cerrada; `senales` (lo
        visible ANTES del pitazo) de su lista cerrada —lo que no está se rechaza con motivo—;
        `tde.equipo` / `tde.rival`, `dtp`, `efe` libres; `lecciones` [{skill, reglaTocada,
        leccion}] (hasta 8) que entran a Aprendizaje con clave `rev:fixture:equipo:n`.
        La población es SIEMPRE `post_resultado` (se elige porque ya reventó): fija rúbrica, no
        mueve números. Re-postear reemplaza. 422 si el partido no cerró una burbuja
        significativa de ese equipo o el mecanismo no está en la lista. Abierto a Cowork.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '422': { description: no es un reventón de ese equipo, o el mecanismo no está en la lista }
  /analisis/cowork/f1/{fixtureId}:
    get:
      summary: La tabla F1 del EFE armada desde la base (con jugadorId)
      description: >
        Por lado, los candidatos a la tabla F1 sacados de la plantilla ingestada (los 16
        con más minutos más los decisivos que queden fuera): `jugadorId` —el cruce exacto
        con la hoja del partido—, zona, `rolSugerido` y `rolPor`: con ≥ 5 onces recientes
        en la base, por titularidades en los últimos 10 (`titularEnUltimos`, TF ≥ 80 %,
        TH ≥ 50 %, ROT ≥ 20 %; los titulares recientes sin stats de temporada entran con
        `sinStatsDeTemporada`); si no, por fracción de minutos de la temporada (TF ≥ 75 %,
        TH ≥ 50 %, ROT ≥ 25 %, SUP) y `decisivo` con su porqué (titular habitual o top 3
        en goles+asistencias). Con ≥ 5 onces recientes, un decisivo de la temporada que hoy no
        lo es pierde `decisivo` y viaja en `decisivoTemporada` (dato, no alerta): el titular
        habitual SOLO por minutos tiene que haber sido titular en la mitad o más de los últimos
        onces (incidencia 387, Meza 3 de 10); el de goles y asistencias, en alguno. El mismo
        jugador con dos ids y minutos en los dos (mismo nombre completo con la pila entera, nunca
        juntos en una hoja) sale en UNA fila con los minutos sumados y el otro id en
        `idsAlternos` (incidencia 381, Wesley Natã / Wesley Nata). Con INICIALES distintas o sin la
        pila entera («J. Bisanz» / «F. Bisanz», incidencia 673) se funden solo con el mismo apellido,
        nunca juntos en una hoja y, además, uno que deja de aparecer cuando aparece el otro o los
        mismos goles y asistencias (no cero); la fila lleva `fundidoPorInicial: true`. Si la
        suma de partidos NO cabe en los del equipo (los dos registros se pisan), con el mismo
        nombre, la misma edad y la misma posición y nunca juntos, es la misma persona duplicada
        por la API: una fila con la de más minutos, SIN sumar (incidencia 839, Y. Guzmán).
        Cada lado trae `sancionados` (backend/sanciones.py, 30/10/2026, incidencias 772, 778 y
        835): roja directa o doble amarilla en el último partido terminado de ESTA competición, o
        la amarilla que completa el ciclo de la competición (`reglaAmarillas`, solo las reglas
        conocidas y con los eventos de todos sus partidos; si faltan, `amarillasConteoParcial`),
        cada uno con `tipo`, `fecha`, `detalle` y `certeza: probable`. La fila del sancionado
        lleva `sancion` y cada fila sus `amarillasEnLaCompeticion` (y, si están en el umbral de la regla, `cicloAmarillas`: `suspende` · `cumplido` · `enLaHoja` · `roja`, 1043). Un jugador en la hoja de
        este partido no se infiere sancionado. Un sancionado que el parte no tiene en `fuera`
        dispara `SANCION-SIN-DECLARAR`.
        El rol es SUGERIDO: lo confirma la prensa. Un decisivo que
        no figura en la tabla depositada dispara `F1-DECISIVO-FUERA` en el parte. Los
        titulares del ÚLTIMO once entran todos aunque queden fuera del corte de 16
        (`titularEnElUltimo`): las stats de la temporada llegan atrasadas. Un jugador cuyos
        minutos no caben en sus partidos (más de 125 por partido) viaja con
        `minutosIncoherentes` y su % se cuenta con lo que cabe. Si la alineación de la API lo
        llama distinto que la base, viaja `nombreEnLaHoja` («D. Gelvez» / «Dayan Pérez»): es
        UNA fila, con el `jugadorId`. La `zona` es la del último once en que fue titular
        (la de la plantilla de la temporada viaja en `zonaTemporada` si difiere), y un titular
        reciente que quedó fuera del corte pero está en la plantilla entra con sus stats.
        Un titular de uno de los últimos 3 onces que la plantilla de la API no tiene entra con
        `sinStatsDeTemporada` y `fueraDePlantilla` (incidencia 683).
        La sombra de la API (0 partidos con minutos y ninguna hoja) se funde con su gemelo del
        mismo apellido (incidencia 904), y también dos ids que se ALTERNAN: nunca juntos en una
        hoja y 6 o más hojas entre los dos con este equipo (un arquero y uno de campo, nunca). Dos filas del mismo nombre que NUNCA compartieron una
        hoja y que los datos no alcanzan a fundir llevan `posibleMismoQue` (el id de la otra):
        el bloque F no cuenta a una de baja si la otra jugó (932). Los de la plantilla cuya
        última hoja (de los últimos 120 días) es con OTRO club, posterior a la última con este,
        salen de la tabla y viajan en `jueganEnOtroEquipo` `[{jugadorId, nombre, equipo, teamId,
        ultimaHoja}]` (931). El diminutivo de la pila casa por una lista cerrada («Fran» /
        «Francisco», 937).
        0 tokens, 0 requests.
        Abierto a Cowork.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { description: el fixture no está en nuestra base }
  /analisis/cowork/tde/{fixtureId}:
    get:
      summary: Los insumos del Teorema del Echado que salen de NUESTRA base
      description: >
        No devuelve el IE: devuelve lo que el propio skill manda tomar del motor y que
        hasta ahora se le pedía al modelo que escribiera a mano. `p1a` (rol de protector
        del resultado) es «input inviolable» y sale de comparar los dos `μ_partido` contra
        el umbral de 0.30 —el skill prohíbe derivarlo del gap o corregir μ por localía—;
        `f2` (descanso y calendario) es «dato del motor o no es dato»; `f1` (rotación en
        los últimos 3) sale de las alineaciones ya ingestadas.


        Lo que NO se puede calcular se declara en `noCalculables`, uno por uno y con el
        motivo: un insumo que falta tiene que verse, no adivinarse. `f2` devuelve un PISO
        y no un score cerrado, porque el viaje y la altitud son parte de la rúbrica y no
        están en nuestra base.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaTde' }
        '404': { description: el fixture no está en nuestra base }
  /analisis/cowork/veredictos/pendientes:
    get:
      summary: Partes sin veredicto cuyo partido ya arrancó hace rato (fase B)
      description: >
        El disparador de la validación: partes depositados, con el partido arrancado hace
        más de `horas` y con marcador en nuestra base. Nadie tiene que acordarse de nada y
        lo que no se validó hoy sigue estando mañana. Ver docs/APRENDIZAJE.md.


        Devuelve un SOBRE, no una lista pelada: un `[]` no distingue "no hay nada que
        cerrar" de "los partidos siguen jugándose" o "la ingesta todavía no trajo el
        marcador", y quien corre la validación se queda sin saber si esperar o seguir.
        Cada parte sin veredicto que no entra a `pendientes` sale en `noListados` con su
        motivo y, si está en juego, con su minuto y su marcador parcial.
      parameters:
        - name: horas
          in: query
          description: >
            Se cuenta desde el SAQUE, no desde el pitazo final (no guardamos la hora de
            término). Subirlo ESTRECHA la búsqueda; bajarlo la abre.
          schema: { type: integer, default: 12, minimum: 0, maximum: 720 }
        - { name: limite, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SobrePendientes' }
  /analisis/simulacion:
    get:
      summary: Simulación de apuesta sobre nuestros 1X2 (desde el 28/10/2026)
      description: >
        Qué habría pasado con una banca de 100 unidades apostando con los 1X2 declarados en los
        partes, con seis series lado a lado: plana (control, 1 unidad al elegido), plana solo con el elegido a 60 %+ (el tramo alto de confianza), Kelly entero,
        ½ y ¼ (f* = (p·c − 1)/(c − 1) sobre NUESTRAS probabilidades, a la selección con más
        ventaja; sin ventaja no apuesta) y martingala (1 unidad al elegido, se duplica tras cada
        derrota, por líneas en paralelo). Se apuesta en el pitazo y se cobra dos horas después:
        los partidos simultáneos se apuestan con la banca de antes y ninguna apuesta pasa de la plata
        libre. Cuenta desde los partidos del 28/10/2026 (hora de Lima); entran los partes
        depositados antes del pitazo, sin cuarentena, con el 1X2 completo y las tres cuotas. La
        cuota es la media de las casas en la última captura prepartido (con su margen). Cada
        apuesta trae la versión de cada skill que estaba en la cuenta al depositar (la del 1X2 es
        `sad-analysis`). Se recalcula al leer. No es una recomendación de apuesta. Lectura
        (token web); no abierto a Cowork.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulacionApuesta' }
  /analisis/cowork/espina/calibracion:
    get:
      summary: La espina de la tarjeta medida contra los veredictos ciegos
      description: >
        Lo que el parte lee ANTES de escribir su espina: cuánto acierta la espina de la tarjeta
        por fuerza y por nivel de riesgo, cuánto acierta el analista cuando la sigue, y quién
        gana cuando la contradice (`analistaVaContra`). Población ciega; se recalibra sola con
        cada veredicto. Abierto al token de Cowork.
      parameters:
        - { name: limite, in: query, schema: { type: integer, default: 400 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  generadoEn: { type: string }
                  tarjeta:
                    type: object
                    nullable: true
                    properties:
                      porFuerza: { type: object, additionalProperties: { $ref: '#/components/schemas/TasaWilson' } }
                      porNivel: { type: object, additionalProperties: { $ref: '#/components/schemas/TasaWilson' } }
                      porTipo:
                        type: object
                        description: 'la tarjeta GENERAL (K total) o la de la condición que leyó el parte (local para el lado a, visita para el b), cada una con `todas`, `fuerte` y `debil`'
                        additionalProperties: { type: object, additionalProperties: { $ref: '#/components/schemas/TasaWilson' } }
                      analistaLaSigue: { $ref: '#/components/schemas/TasaWilson' }
                      partido:
                        type: object
                        description: 'por partido: las dos tarjetas como 1X2 (concuerdan · concuerdanDebiles · unaSola con su tasa; discrepan con cuántas veces acertó cada una)'
                        additionalProperties: true
                      analistaVaContra:
                        type: object
                        properties:
                          lados: { type: integer }
                          aciertaAnalista: { type: integer }
                          aciertaTarjeta: { type: integer }
                          lectura: { type: string }
                      nota: { type: string }
                  analistaPorLectura: { type: object, additionalProperties: true }
                  comoLeerlo: { type: string }
  /analisis/cowork/lecciones:
    get:
      summary: Las lecciones acumuladas por skill (fase C)
      description: >
        Lo que el bucle aprendió, indexado desde los veredictos. El CONTENIDO de cada
        lección no se copia a ninguna tabla: se deriva del veredicto al leer, igual que el
        marcador y el timeline. Si alguien corrige un veredicto, la lección corregida
        aparece sola; una copia se habría quedado vieja sin que nadie se enterara. Lo único
        que se guarda aparte es el ESTADO (pendiente / en_revision / aplicada / descartada),
        que es lo que evita el bucle infinito y no se puede derivar de nada.


        Las métricas se publican SOLO sobre la población acreditable (`ciega` + `PRE`), con
        su `n` a la vista; las otras poblaciones se cuentan aparte y nunca se suman. Cada
        lección trae `puedeMoverNumeros`: una lección de un caso contaminado puede fijar
        rúbrica —aclarar cómo se aplica una regla— pero NO mueve un peso. Esa distinción la
        lleva el dato, no el criterio de quien lo lea ese día.
      parameters:
        - { name: skill, in: query, description: 'filtra por skill', schema: { type: string } }
        - name: estado
          in: query
          description: 'pendiente | en_revision | aplicada | descartada'
          schema: { type: string }
        - name: cohorte
          in: query
          description: >
            La ÉPOCA del proceso: '' = todas, 'vigente' = la actual, o una clave concreta
            (`rodaje` = lo anterior a la primera cohorte sellada). Las métricas y los conteos
            por skill son SOLO de la cohorte elegida; `cohortes` viaja siempre entero. La
            cohorte se sella al depositar y un re-depósito no la cambia.
          schema: { type: string }
        - name: resumen
          in: query
          description: >
            Sin lecciones: solo conteos, métricas y la versión de cada skill. La pantalla de
            Aprendizaje abre con esto (25/10/2026: la lista entera eran 46 s y 6,3 MB).
          schema: { type: boolean, default: false }
        - name: de
          in: query
          description: "con `cuantas`: de dónde salen las lecciones de `items` ('' = las normales · cuarentena · sinSkill)"
          schema: { type: string, enum: ['', cuarentena, sinSkill] }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - name: cuantas
          in: query
          description: '0 = todas (como siempre); > 0 pagina `items` y deja vacías las listas por skill. `total` dice cuántas hay en el filtro'
          schema: { type: integer, minimum: 0, maximum: 500, default: 0 }
      responses:
        '200':
          description: >
            OK. El núcleo (casos, lecciones, población, métricas) se guarda mientras no cambien
            los partes con veredicto ni los estados de las lecciones (`SAD_CACHE_INVENTARIO_S`,
            30 min de tope para lo que cambia por fuera, como una alineación).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventarioLecciones' }
  /analisis/cowork/antecedentes/{fixtureId}:
    get:
      summary: Fase A del aprendizaje — lo que el sistema ya dijo de estos equipos en partidos ANTERIORES (abierto a Cowork)
      description: >
        Por lado: `partes[]` (los últimos N de partidos anteriores al que se analiza, nunca este ni
        uno posterior), cada uno con clasificación y % del EFE, pronóstico de la cadena, 1X2,
        marcador pronosticado, TDE (ie, nivel, ventana), la clase de su bloque según el DTP del
        rival, marcador real (`marcador` desde el EQUIPO, sus goles primero; `marcadorPartido`
        local-visita, el orden de `marcadorPronosticado`; 907), veredicto, queP, lección, skill, población y `cuarentena`;
        `aciertoCiego` (solo ciega + PRE fuera de cuarentena) y `leccionesVigentes` (pendientes o en
        revisión). El caso nuevo sigue siendo ciego: son desenlaces de OTROS partidos. 0 tokens.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: n, in: query, schema: { type: integer, default: 5, minimum: 1, maximum: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { description: el fixture no está en nuestra base }
  /analisis/cowork/derrotas-favorito:
    get:
      summary: Las derrotas del favorito declarado, con lo que el TDE y el DTP habían escrito antes (lectura)
      description: >
        Por cada veredicto en el que el 1X2 declarado eligió a un equipo y ese equipo PERDIÓ: el
        marcador y los goles, la rama de la reasignación del TDE que jugó el favorito (la del primer
        gol, el `segundoGiro` si le empataron, la `salida` si persiguió) con lo que estaba
        declarado, la del rival, las vías de gol del rival que había escrito el DTP del favorito y
        la lección de la autopsia. `explicacion`: `rama_escrita` · `rama_sin_escribir` ·
        `sin_ficha` · `sin_goles`. Solo cuenta lo declarado ANTES (disciplina 9 del TDE):
        `rama_escrita` dice que el escenario estaba descrito, no que se haya acertado. 0 tokens.
      parameters:
        - { name: cohorte, in: query, schema: { type: string, default: vigente }, description: "'' = todas · 'vigente' · o una clave" }
        - { name: limite, in: query, schema: { type: integer, default: 400 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DerrotasFavoritoDTO' }
  /analisis/cowork/revision/{skill}:
    get:
      summary: El dossier de revisión de un skill (fase D del aprendizaje; abierto a Cowork en lectura)
      description: >
        ABRE la revisión, no autoriza nada. Las lecciones abiertas (pendiente o en_revision) del
        skill agrupadas por la regla que tocan (`porRegla`: lecciones, fallos, acreditables,
        cuántas piden mover un número y cuántas pueden sostenerlo, modo de fallo de Jev), su
        población, las métricas ciegas SOLO de los casos de este skill, el listón del propio skill,
        `pidenMoverSinPoder`, los casos en cuarentena, la versión vigente del snapshot
        (`versionVigente`, la que va en `aplicadaEn`), el flujo y una `lectura` calculada: sin
        acreditables la revisión solo fija rúbrica; con el listón sin cumplir el cambio de peso
        espera. `abierta` = 4+ fallos abiertos del skill, o lecciones ya en revisión.
      parameters:
        - { name: skill, in: path, required: true, schema: { type: string } }
        - { name: cohorte, in: query, schema: { type: string, default: vigente }, description: "'' = todas · 'vigente' · o una clave" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /analisis/cowork/revision/{skill}/cerrar-anteriores:
    post:
      summary: Cierra como `aplicada` las lecciones pendientes anteriores al corte de la versión vigente (token maestro; NO Cowork ni la web en lectura)
      description: >
        25/10/2026: 2.632 lecciones pendientes y ninguna cerrada aunque cuatro versiones ya habían
        salido de esos dossiers. `lecciones.CORTE_VERSION` dice, por skill, la versión vigente y la
        fecha de partido hasta la que la leyó su dossier; lo anterior pasa a `aplicada` en esa
        versión, lo posterior queda pendiente (es el dossier que viene).
      parameters:
        - { name: skill, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: '{ skill, version, corte, cerradas, quedanPendientes, nota }'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '422': { description: el skill no tiene versión con corte }
  /analisis/cowork/revision/{skill}/abrir:
    post:
      summary: Pasa a en_revision las lecciones pendientes del dossier (token maestro; NO Cowork ni la web en lectura)
      parameters:
        - { name: skill, in: path, required: true, schema: { type: string } }
        - { name: cohorte, in: query, schema: { type: string, default: vigente } }
      responses:
        '200':
          description: 'lo movido: { skill, movidas[], versionVigente }'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '422': { description: la revisión no está disparada }
  /analisis/cowork/{fixtureId}/dt:
    post:
      summary: Corregir SOLO el DT de un parte ya depositado (abierto a Cowork)
      description: >
        El POST del parte reemplaza el parte entero; para cambiar un DT eso obligaba a
        re-depositarlo completo y un cuerpo recortado lo vaciaba (Everton–Ipswich, 23/09).
        Esto toca `equipos.{lado}.dt` y nada más: no re-sella la cohorte, no rehace la
        coherencia, no mueve el pronóstico ni el veredicto. El DT pasa por la misma
        normalización que el depósito; un lado rechazado no se aplica y vuelve en
        `rechazos`. `dtEquivocado` dice si el DT sigue sin casar con el que se sentó en el
        banco (vacío = casa o no hay alineación).
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                a: { description: '`{nombre, desde}` o `{nombre, meses}` o solo `{nombre}`' }
                b: { description: 'ídem para el visitante' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [fixtureId, antes, ahora, rechazos, dtEquivocado, sinDt]
                properties:
                  fixtureId: { type: integer }
                  antes: { type: object, additionalProperties: true }
                  ahora: { type: object, additionalProperties: true }
                  rechazos: { type: array, items: { type: object, additionalProperties: true } }
                  dtEquivocado:
                    type: array
                    items: { type: object, properties: { lado: { type: string }, parte: { type: string }, banco: { type: string } } }
                  sinDt: { type: array, items: { type: string } }
                  dtOriginal:
                    type: object
                    additionalProperties: true
                    description: '{lado: {nombre, corregidoEn, por}}: el DT con que se ESCRIBIÓ el parte, sellado la primera vez que se corrige DESPUÉS del pitazo (27/10/2026, incidencia 712). `dtEquivocado` lo sigue mirando y el caso sigue en cuarentena: la corrección arregla el dato, no el análisis. Antes del pitazo no se sella nada'
        '404': { description: no hay parte para ese fixture }
        '422': { description: sin lados en el cuerpo }
  /analisis/cowork/{fixtureId}/banco-desmentido:
    post:
      summary: El DT del banco que trae la API está mal en un lado — lo hace el usuario, no el agente
      description: >
        La cuarentena automática por DT equivocado compara el DT del parte con el entrenador de
        la alineación de API-Football, y esa alineación a veces arrastra a un DT que ya se fue
        (Jaguares–Tolima del 11/10/2026: «H. Bodhert», salido el 28/09). Esto marca, POR LADO y con
        la FUENTE que lo prueba (≥ 8 caracteres), que el banco de la API es el equivocado: ese lado
        deja de compararse y el caso vuelve a contar. No toca el parte, el veredicto ni la cohorte.
        Solo se puede poner en un lado que hoy figure con DT equivocado (422 si no). NO está en la
        lista de permitidos del token de Cowork.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lado, fuente]
              properties:
                lado: { type: string, enum: [a, b] }
                fuente: { type: string, description: 'link o nota de prensa que prueba que ese DT no dirigió' }
                nota: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixtureId: { type: integer }
                  bancoDesmentido: { $ref: '#/components/schemas/BancoDesmentido' }
                  dtEquivocado: { type: array, items: { type: object, additionalProperties: true } }
        '404': { description: No hay parte para ese fixture }
        '422': { description: Sin fuente, lado inválido o lado sin DT equivocado }
  /analisis/cowork/{fixtureId}/banco-desmentido/{lado}:
    delete:
      summary: Quita el desmentido de un lado (el caso vuelve a compararse contra el banco)
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: lado, in: path, required: true, schema: { type: string, enum: [a, b] } }
      responses:
        '200': { description: OK }
        '404': { description: No hay parte para ese fixture }
  /analisis/cowork/cohortes/{cohorte}/descartar:
    post:
      summary: Descarta en bloque las lecciones pendientes de una cohorte vieja — lo hace el usuario
      description: >
        Pasa a `descartada` TODAS las lecciones pendientes de la cohorte (las en cuarentena
        incluidas). Las de `rodaje` y `c2` no calibran nada y llenaban la pantalla de Aprendizaje.
        La cohorte vigente se rechaza (422): sus lecciones se revisan una por una. NO está en la
        lista de permitidos del token de Cowork.
      parameters:
        - { name: cohorte, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nota: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cohorte: { type: string }
                  descartadas: { type: integer }
                  claves: { type: array, items: { type: string } }
                  nota: { type: string }
        '404': { description: Sin casos cerrados en esa cohorte }
        '422': { description: Es la cohorte vigente }
  /analisis/cowork/{fixtureId}/cuarentena:
    post:
      summary: Apartar un caso del aprendizaje, con motivo — lo hace el usuario, no el agente
      description: >
        CUARENTENA POR CRITERIO, NUNCA POR RESULTADO. Se pone por lo que le faltaba al parte
        antes del pitazo (DT viejo, TDE sin nivel, rodaje), no porque el veredicto salió
        fallo: si no, es la forma elegante de borrar los fallos y la métrica deja de
        significar. El motivo es obligatorio (≥ 12 caracteres), se guarda el veredicto que
        tenía el caso al ponerla (`veredictoAlPoner`, para que una auditoría vea si se puso
        después de saber cómo terminó) y NO está en la lista de permitidos del token de
        Cowork. Un caso en cuarentena sale de todas las métricas y sus lecciones no cuentan
        ni fijan rúbrica; se listan aparte en `enCuarentena`. Con `ensena: true` (la
        CUARENTENA QUE ENSEÑA, 27/10/2026: el sistema falló y de eso se aprende) el caso sale
        igual de toda métrica, pero sus lecciones siguen en `items`, con las del skill y en el
        dossier, con `cuarentenaEnsena: true`: fijan rúbrica y nunca mueven un número. La
        automática por DT equivocado también enseña; la de parte sin DT y la de otra fecha no.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, description: 'qué le faltaba a ESTE parte antes del pitazo' }
                ensena: { type: boolean, default: false, description: 'fuera de toda métrica, pero sus lecciones siguen fijando rúbrica' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixtureId: { type: integer }
                  cuarentena: { $ref: '#/components/schemas/Cuarentena' }
        '403': { description: 'el token de Cowork no pone cuarentenas' }
        '404': { description: 'no hay parte para ese fixture' }
        '422': { description: 'sin motivo, o un motivo que no lo es' }
    delete:
      summary: Quitar la cuarentena; devuelve lo quitado
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'OK: `quitada` trae la marca que había' }
        '404': { description: 'no hay parte para ese fixture' }
  /analisis/cowork/lecciones/{clave}:
    post:
      summary: Mover una lección de estado — lo hace el usuario, no el agente
      description: >
        `clave` es `fixtureId:lado` (ej. `1550964:a`). Marcar `aplicada` EXIGE `aplicadaEn`
        con la versión del skill donde entró: una lección aplicada sin versión no se puede
        auditar después, y es justo el momento en que más barato es anotarla.


        Este endpoint NO está en la lista de permitidos de `SAD_TOKEN_COWORK`: el agente
        lee sus lecciones pero no declara aplicada la suya. Mover el estado es del usuario.
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [pendiente, en_revision, aplicada, descartada] }
                aplicadaEn: { type: string, description: 'versión del skill; obligatoria para `aplicada`' }
                nota: { type: string }
      responses:
        '200':
          description: La lección con su estado nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeccionItem' }
        '403': { description: 'el token de Cowork no puede mover estados' }
        '404': { description: 'no hay lección con esa clave' }
        '422': { description: 'estado fuera del vocabulario, o `aplicada` sin `aplicadaEn`' }
  /analisis/cowork/{fixtureId}/objetivo:
    get:
      summary: Lo objetivo del caso ANTES de escribir el veredicto
      description: >
        La misma parte objetiva que trae el veredicto (marcador, 1X2, Brier, ventana del
        TDE, reventón, espina, `matriz`: qué escenario jugó cada lado y qué había escrito
        el parte), calculada sobre el parte depositado sin que haya veredicto todavía.
        `GET …/veredicto` da 404 hasta el primer POST, y quien cierra el caso necesita
        leer qué escenario se jugó para juzgarlo. Se recalcula al leer; no se guarda nada.
        Abierto a Cowork, 0 tokens.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixtureId: { type: integer }
                  tieneVeredicto: { type: boolean }
                  objetivo: { type: object, additionalProperties: true }
        '404': { description: el fixture no tiene parte depositado }
  /analisis/cowork/{fixtureId}/veredicto:
    get:
      summary: El veredicto guardado, con su parte objetiva recalculada al leer
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veredicto' }
        '404': { description: El fixture todavía no tiene veredicto }
    post:
      summary: Cierra el caso 12 h después — ¿acertó el pronóstico?
      description: >
        Lo objetivo lo calcula el backend y viaja en la respuesta (marcador, acierto del
        1X2, Brier, si cayó gol en la ventana del TDE, los goles con su minuto). De fuera
        llega el juicio: por qué falló, la lección, y —lo que no se puede deducir— si el
        caso es CIEGO o está contaminado. Sin pronóstico previo no se escribe veredicto en
        la cadena del equipo: los lados afectados vuelven en `sinPronosticoPrevio`.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VeredictoEntrada' }
      responses:
        '200':
          description: El veredicto con lo calculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veredicto' }
        '422': { description: 'población o modo inválidos, sin porLado, o no hay parte' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    SimulacionApuesta:
      type: object
      properties:
        desde: { type: string, description: 'UTC; 00:00 de Lima del 28/10/2026' }
        bancaInicial: { type: number }
        unidad: { type: number }
        cerradas: { type: integer }
        pendientes: { type: integer }
        aciertos: { type: integer, description: 'cerradas donde salió nuestro elegido' }
        nota: { type: string }
        estrategias:
          type: array
          items:
            type: object
            properties:
              clave: { type: string, enum: [plana, plana60, kelly, kellyMedio, kellyCuarto, martingala, martingala60] }
              nombre: { type: string }
              descripcion: { type: string }
              banca: { type: number }
              ganancia: { type: number }
              apostado: { type: number }
              apuestas: { type: integer }
              ganadas: { type: integer }
              roi: { type: number, nullable: true, description: 'ganancia / apostado' }
              caidaMaxima: { type: number, description: 'la peor caída desde un pico, 0-1' }
              quebro: { type: integer, nullable: true, description: 'fixture en que la banca llegó a cero' }
              exposicionMaxima: { type: number, description: 'lo más que estuvo en juego a la vez' }
              montoMaximo: { type: number, description: 'la apuesta más grande' }
              lineas:
                type: object
                nullable: true
                description: 'solo martingala: líneas abiertas, cuántas vienen de perder y el próximo monto más alto'
                properties:
                  abiertas: { type: integer }
                  perdiendo: { type: integer }
                  proximoMayor: { type: number }
              serie:
                type: array
                items:
                  type: object
                  properties:
                    fixtureId: { type: integer, nullable: true }
                    pitazo: { type: string, nullable: true }
                    banca: { type: number }
        porVersion:
          type: array
          items:
            type: object
            properties:
              version: { type: string, description: 'de sad-analysis (la del 1X2)' }
              partidos: { type: integer }
              aciertos: { type: integer }
              estrategias:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    apostado: { type: number }
                    ganancia: { type: number }
                    apuestas: { type: integer }
                    roi: { type: number, nullable: true }
        apuestas:
          type: array
          description: la más nueva primero
          items:
            type: object
            properties:
              fixtureId: { type: integer }
              pitazo: { type: string }
              partido:
                type: object
                properties:
                  local: { type: string }
                  visita: { type: string }
                  liga: { type: string }
              depositadoEn: { type: string }
              versiones: { type: object, additionalProperties: { type: string }, description: 'por skill, la vigente al depositar' }
              versionPrompt: { type: string }
              probabilidades: { type: object, description: 'local · empate · visita, nuestras, en %' }
              cuotas: { type: object, description: 'media de las casas, con margen' }
              mercado: { type: object, description: 'probabilidad del mercado sin margen, en %' }
              resultado: { type: string, nullable: true, enum: [local, empate, visita, null] }
              elegido: { type: string }
              estado: { type: string, enum: [cerrada, pendiente] }
              kelly:
                type: object
                properties:
                  seleccion: { type: string }
                  fraccion: { type: number, description: 'f*; ≤ 0 = no apuesta' }
                  valor: { type: number, description: 'p·c − 1' }
              porEstrategia:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    seleccion: { type: string, nullable: true, description: 'null = no apostó' }
                    monto: { type: number }
                    linea: { type: integer, nullable: true, description: 'solo martingala: en qué línea entró' }
                    motivo: { type: string, description: "sin apuesta: 'sin ventaja' · 'sin plata libre' · 'bajo 60 %'" }
                    ganancia: { type: number, nullable: true }
                    banca: { type: number, nullable: true }
        excluidos:
          type: array
          items:
            type: object
            properties:
              fixtureId: { type: integer }
              pitazo: { type: string }
              partido: { type: object }
              motivo: { type: string }
    ModoFallo:
      type: object
      nullable: true
      description: >
        La etiqueta de Jev sobre la prosa del veredicto (backend/analisis/modo_fallo.py,
        docs/JEV.md): de qué naturaleza fue el fallo de cada lado y si la lección pide
        mover un número del skill. Sellada AL CERRAR el caso —Jev no es determinista—;
        null en casos cerrados antes de que existiera. No toca la población, ninguna
        métrica ni el estado de la lección: agrupa para el dossier de la fase D.
      properties:
        evaluadoEn: { type: string }
        modelo: { type: string }
        simulado: { type: boolean }
        preguntas: { type: integer }
        tokensEntrada: { type: integer }
        error: { type: string, nullable: true }
        taxonomia: { type: array, items: { type: string } }
        lados:
          type: object
          additionalProperties:
            type: object
            properties:
              modo: { type: string, nullable: true, enum: [insumo, lectura_efe, tde, reventon, mercado, imprevisto, varianza, no_lo_dice, null], description: 'null = sin confianza suficiente o simulado' }
              modoConfianza: { type: number }
              proponeMoverNumero: { type: boolean, nullable: true, description: 'true ≥ 0.70 · false ≤ 0.30 · null en medio o sin lección' }
              proponeMoverP: { type: number, nullable: true }
    LeccionItem:
      type: object
      description: >
        Una lección: el contenido viene del veredicto (derivado al leer), el estado de su
        propia tabla. `clave` es `fixtureId:lado`.
      properties:
        clave: { type: string, example: '1550964:a', description: "`fixture:lado` la primera lección del lado; `fixture:lado:N` las de `otrasLecciones`" }
        orden: { type: integer, description: '1 = la lección principal del lado; 2+ = otrasLecciones' }
        origen: { type: string, enum: [veredicto, reventon], description: "`reventon` = de un estudio hacia atrás (clave `rev:…`, veredicto vacío, post_resultado)" }
        mecanismo: { type: string, description: 'solo en origen reventon: el mecanismo del reventón' }
        fixtureId: { type: integer }
        lado: { type: string, enum: [a, b] }
        equipo: { type: string }
        rival: { type: string }
        partido: { type: string }
        fecha: { type: string }
        skill: { type: string, description: 'vacío = la lección no declaró de qué skill es' }
        veredicto: { type: string, enum: [acierto, parcial, fallo] }
        queP: { type: string }
        leccion: { type: string }
        reglaTocada: { type: string }
        seleccion: { type: string, enum: [ciega, por_resultado, post_resultado] }
        modoEvaluacion: { type: string, enum: [PRE, COND] }
        acredita: { type: boolean }
        mancha: { type: string, description: 'salvedad declarada; el caso acredita igual' }
        puedeMoverNumeros:
          type: boolean
          description: >
            Solo un caso acreditable (ciega + PRE) puede mover un peso. Los demás fijan
            rúbrica: aclaran cómo se aplica una regla, sin tocar ningún número. Uno en
            cuarentena ni siquiera fija rúbrica.
        cohorte: { type: string, description: 'época del proceso en la que se depositó el parte' }
        cuarentena: { type: string, description: 'motivo de la cuarentena; vacío si el caso cuenta' }
        cuarentenaAutomatica: { type: boolean, description: 'la puso la app por criterio: parte sin DT declarado en un lado, o DT del parte distinto del banco. Se levanta re-depositando con el DT o desmintiendo el banco' }
        cuarentenaEnsena: { type: boolean, description: 'cuarentena que enseña: el caso no cuenta en ninguna métrica, pero la lección sigue en items y fija rúbrica' }
        copa: { type: string, description: 'copa nacional (nombre) o vacío: se analiza y enseña, pero no cuenta en ninguna métrica ni mueve números (29/10/2026)' }
        dtEquivocado:
          type: array
          description: 'si la automática es por DT equivocado: qué lado y qué nombres chocaron (parte vs banco de la API)'
          items:
            type: object
            properties:
              lado: { type: string }
              parte: { type: string }
              banco: { type: string }
        modoFallo: { type: string, nullable: true, description: 'etiqueta de Jev: insumo · lectura_efe · tde · reventon · mercado · imprevisto · varianza · no_lo_dice; null sin etiqueta' }
        modoFalloConfianza: { type: number, nullable: true }
        proponeMoverNumero: { type: boolean, nullable: true, description: 'la lección pide mover un número del skill (Jev); cruzado con puedeMoverNumeros da la alarma del dossier' }
        estado: { type: string, enum: [pendiente, en_revision, aplicada, descartada] }
        aplicadaEn: { type: string }
        nota: { type: string }
        actualizadoEn: { type: string }
    Cuarentena:
      type: object
      properties:
        motivo: { type: string }
        puestaEn: { type: string }
        veredictoAlPoner:
          type: object
          nullable: true
          description: 'el veredicto por lado que tenía el caso al ponerla: evidencia para la auditoría'
          additionalProperties: { type: string }
        ensena: { type: boolean, description: 'cuarentena que enseña: sus lecciones siguen con las del skill' }
    Cohorte:
      type: object
      description: >
        Una época del proceso. Se sella al depositar (`ParteCowork.cohorte`) y no cambia con un
        re-depósito; lo anterior a la primera cohorte sellada es `rodaje`. La vigente es la
        única que vale para calibrar; las demás enseñan.
      properties:
        clave: { type: string }
        vigente: { type: boolean }
        descripcion: { type: string }
        casos: { type: integer }
        enCuarentena: { type: integer }
    InventarioLecciones:
      type: object
      properties:
        generadoEn: { type: string }
        filtro:
          type: object
          properties:
            skill: { type: string }
            estado: { type: string }
            cohorte: { type: string }
        cohortes: { type: array, items: { $ref: '#/components/schemas/Cohorte' } }
        cohorteVigente: { type: string }
        notaCohortes: { type: string }
        enCuarentena:
          type: object
          description: 'casos apartados por criterio: no cuentan ni fijan rúbrica'
          properties:
            cuantas: { type: integer }
            automaticas: { type: integer, description: 'de las cuales sin DT declarado (criterio automático)' }
            porque: { type: string }
            items: { type: array, items: { $ref: '#/components/schemas/LeccionItem' } }
        poblacion:
          type: object
          description: 'los casos cerrados por población (más `cuarentena`, que no cuenta en nada, y `copa`: copas nacionales, que enseñan pero no entran a las métricas); NUNCA se suman entre sí'
          additionalProperties: true
        acreditables:
          type: object
          description: >
            La única población medible (ciega + PRE): veredictos por lado, tasa de acierto
            con su n, acierto del 1X2, Brier con su línea de base y `reventon`: la tasa de
            reventón observada por nivel de riesgo (`porNivel`, con `intervalo` de Wilson al
            95 %, `esperadoBacktest`, `dentroDelBacktest` y `lectura` compatible/fuera/sin n:
            FUERA es que el rango del backtest no toca el intervalo, nunca que el punto quede
            afuera; comparado solo con n ≥ `nMinimo`), las burbujas con K-EXTREMO,
            y `fueraDelBacktest` / `revisionAbierta`: un nivel fuera del rango ABRE la revisión
            de los puntos de docs/REVENTON.md §5, no los mueve. `espina`: por lectura (positiva ·
            cero · negativa · neutra) cuántas acertaron adónde fue la K, con intervalo, la
            `frecuenciaDelMovimiento` y si la supera; `lectura` resume; `porGuia` repite la
            cuenta para la K total y la K de la condición, cada una contra sus lados;
            `tarjeta` mide la espina de la tarjeta sola y al analista contra ella (lo mismo
            que /analisis/cowork/espina/calibracion), y en `tarjeta.partido` las dos tarjetas
            del partido como un 1X2: si concuerdan, ¿aciertan más que una sola?
            `confianza`: la calibración del 1X2 por tramo de la probabilidad declarada
            (<40 · 40-49 · 50-59 · 60+), por versión de sad-analysis al depositar
            (`porVersion`) y junta (`todas`): n, aciertos con intervalo de Wilson, lo que
            dijimos y lo que el mercado le daba al mismo elegido.
            `valorMercado` (26/10/2026): apostar 1 unidad a cada selección marcada con valor
            (vsMercado.mejorValor), a la cuota media de la última captura prepartido, en los
            partes cerrados que acreditan y sin cuarentena: n, ganadas, roi (ganancia media por
            unidad) con intervalo al 95 %, `confirmado` (n ≥ `minimo` y el intervalo sobre
            cero), lo mismo para `naceDeRecorte` / `sinRecorte` y, de referencia,
            `nuestroFavorito` (apostar siempre a nuestro elegido).
            `desenlaceTde` (TDE v0.1.24, disciplina 65): por lectura del desenlace del que
            persigue (se_rompe · rescata · abierto) cuántos tramos jugados la cumplieron, cuántos
            iban con la lectura por defecto del ISE de rama y qué se observó; tasa e intervalo
            solo con n ≥ 10, y «abierto» nunca se cobra.
          additionalProperties: true
        porSkill:
          type: array
          items:
            type: object
            properties:
              skill: { type: string }
              lecciones: { type: object, additionalProperties: { type: integer } }
              atribuidos: { type: object, additionalProperties: { type: integer } }
              sesgoDeAtribucion: { type: string }
              revisionAbierta: { type: boolean, description: 'fase D: 4 fallos con lección pendiente' }
              faltanParaDisparar: { type: integer }
              liston: { type: object, nullable: true, additionalProperties: true }
              versionVigente: { type: string, description: 'la versión del snapshot en docs/skills (la que va en aplicadaEn)' }
              anterioresAlCorte:
                type: integer
                nullable: true
                description: 'pendientes de partidos anteriores al corte de la versión vigente: las que cerraría POST …/revision/{skill}/cerrar-anteriores; null = sin corte'
              items: { type: array, items: { $ref: '#/components/schemas/LeccionItem' } }
        sinSkill:
          type: object
          description: 'lecciones que no declararon skill: se delatan, no se reparten a ojo'
          additionalProperties: true
        items:
          type: array
          items: { $ref: '#/components/schemas/LeccionItem' }
        total: { type: integer, description: 'con resumen o cuantas: lecciones en el filtro' }
        desde: { type: integer }
    Health:
      type: object
      required: [status, version, dbOk, lastPipelineRun]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        dbOk: { type: boolean }
        commit: { type: string, description: 'el commit que corre en producción (RAILWAY_GIT_COMMIT_SHA; vacío si no se sabe): el mantenimiento cierra una incidencia como resuelta solo cuando contiene su merge' }
        lastPipelineRun: { type: string, format: date-time, nullable: true }
        jev:
          type: object
          description: 'si TYPESAFE_API_KEY está puesta (nunca la clave), el modo del revisor de coherencia y el alias de modelo. Probarla de verdad: GET /analisis/jev/ping (maestro)'
          properties:
            disponible: { type: boolean }
            modo: { type: string, enum: ['off', sombra, alertas] }
            modelo: { type: string }
            via: { type: string, description: 'host del endpoint configurado' }
            oficial: { type: boolean }
    EstadoFixture:
      type: string
      enum: [programado, en_vivo, finalizado]
    Equipo:
      type: object
      required: [id, nombre, abreviatura]
      properties:
        id: { type: integer }
        nombre: { type: string }
        abreviatura: { type: string }
        pais: { type: string }
        logo: { type: string, nullable: true, description: 'URL del escudo (teams.logo de sad.db)' }
    Fixture:
      type: object
      required: [id, fecha, ligaId, liga, temporada, estado, local, visitante]
      properties:
        id: { type: integer }
        fecha: { type: string, format: date-time }
        ligaId: { type: integer }
        liga: { type: string }
        temporada: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoFixture' }
        minuto: { type: integer, nullable: true }
        estadio: { type: string }
        local: { $ref: '#/components/schemas/Equipo' }
        visitante: { $ref: '#/components/schemas/Equipo' }
        golesLocal: { type: integer, nullable: true }
        golesVisitante: { type: integer, nullable: true }
        ligaLogo: { type: string, nullable: true, description: 'URL del logo del torneo (leagues.logo)' }
        ligaBandera: { type: string, nullable: true, description: 'URL de la bandera del país (leagues.flag; null en copas internacionales)' }
        ligaPais: { type: string, nullable: true, description: 'país del torneo (leagues.country): desambigua torneos homónimos, p. ej. la Copa de la Liga de Perú y la de Chile' }
    Liga:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
        pais: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        bandera: { type: string, nullable: true }
        temporada: { type: integer, nullable: true, description: 'última temporada conocida' }
        temporadas: { type: array, items: { type: integer }, description: 'temporadas con fixtures capturados, descendente' }
        fases: { type: array, items: { type: string }, description: 'fases del torneo de la temporada (Apertura, Clausura, …), ordenadas por fecha; [] si la liga no parte la temporada' }
    Nivel:
      type: object
      required: [equipoId, fixtureId, fecha, nivel, bin, binEtiqueta]
      properties:
        equipoId: { type: integer }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        nivel: { type: number, description: 'continuo ~0.5–3.5' }
        bin: { type: integer, minimum: 0, maximum: 9 }
        binEtiqueta: { type: string }
        desglose:
          type: object
          nullable: true
          description: 'P + G del nivel (MOTOR_SAD_EXTRACCION.md §2.1 y §2.5): puntos/20 de la ventana de 20 y balance de goles de los últimos 5. null con <20 partidos o si la historia cambió desde que corrió el pipeline (se recalcula al leer y se verifica contra el nivel guardado; no se inventa). Dos equipos con el mismo nivel no tienen la misma historia: esto muestra cuál'
          properties:
            puntos: { type: number, description: 'P = Σ puntos / 20' }
            goles: { type: number, description: 'G = Σ(gf−ga) / Σ(gf+ga) de los últimos 5 (0 si no hubo goles)' }
            puntosVentana: { type: integer }
            partidosVentana: { type: integer }
            golesFavor5: { type: integer }
            golesContra5: { type: integer }
    Constantes:
      type: object
      description: Fila de constants + processed_matches (rival, goles) + fusión
      required: [equipoId, fixtureId, fecha, condicion, rivalId, rivalNombre, nivelRival, golesFavor, golesContra, ligaId, esInternacional, q, k, fusion]
      properties:
        equipoId: { type: integer }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        condicion: { type: string, enum: [Local, Visita] }
        rivalId: { type: integer }
        rivalNombre: { type: string }
        nivelRival: { type: number, description: 'nivel CONTINUO del rival con el que el motor ponderó la fila (§3.1), recuperado de las q; processed_matches guarda el bin 0–9 y ese NO es este campo' }
        golesFavor: { type: integer }
        golesContra: { type: integer }
        ligaId: { type: integer }
        temporada: { type: integer, nullable: true, description: 'temporada del torneo (2026, o 2025 para una 2025/26 europea); corta el período «esta temporada» del reventón' }
        esInternacional: { type: boolean, description: 'true si fue torneo internacional (UCL, UEL, Libertadores…)' }
        q:
          type: object
          properties:
            local: { type: number, nullable: true }
            visita: { type: number, nullable: true }
            negativo: { type: number }
            golesAnotado: { type: number }
            golesRecibido: { type: number }
            dc: { type: number, description: 'Aporte Doble Oportunidad (§3.6): 0 si perdió, si no max(dif·nivelRival, 0.5·nivelRival)' }
        k:
          type: object
          description: Acumuladores de racha (§3.3) + Doble Oportunidad (§3.6) + Márgenes (§3.7)
          properties:
            positivo: { type: number }
            negativo: { type: number }
            positivoLocal: { type: number }
            negativoLocal: { type: number }
            positivoVisita: { type: number }
            negativoVisita: { type: number }
            golesAnotado: { type: number }
            golesRecibido: { type: number }
            golesLocalAnotado: { type: number }
            golesLocalRecibido: { type: number }
            golesVisitaAnotado: { type: number }
            golesVisitaRecibido: { type: number }
            dc: { type: number, description: 'Racha "sin perder" (1X); no-negativo, resetea solo al perder (§3.6)' }
            dcLocal: { type: number }
            dcVisita: { type: number }
            # Márgenes (§3.7): racha por margen exacto de goles (1/2/3+). Aporte plano nivelRival.
            vic1: { type: number }
            vic1Local: { type: number }
            vic1Visita: { type: number }
            vic2: { type: number }
            vic2Local: { type: number }
            vic2Visita: { type: number }
            vic3: { type: number }
            vic3Local: { type: number }
            vic3Visita: { type: number }
            der1: { type: number }
            der1Local: { type: number }
            der1Visita: { type: number }
            der2: { type: number }
            der2Local: { type: number }
            der2Visita: { type: number }
            der3: { type: number }
            der3Local: { type: number }
            der3Visita: { type: number }
        fusion:
          type: object
          description: K fusionadas k = k⁺ + k⁻ (§4.2); k_dc pasa tal cual (§3.6)
          properties:
            k: { type: number }
            kLocal: { type: number }
            kVisita: { type: number }
            golesAnotado: { type: number }
            golesRecibido: { type: number }
            golesLocalAnotado: { type: number }
            golesLocalRecibido: { type: number }
            golesVisitaAnotado: { type: number }
            golesVisitaRecibido: { type: number }
            kDc: { type: number }
            kDcLocal: { type: number }
            kDcVisita: { type: number }
            # Márgenes (§3.7): acumuladores no-negativos, pasan tal cual
            kVic1: { type: number }
            kVic1Local: { type: number }
            kVic1Visita: { type: number }
            kVic2: { type: number }
            kVic2Local: { type: number }
            kVic2Visita: { type: number }
            kVic3: { type: number }
            kVic3Local: { type: number }
            kVic3Visita: { type: number }
            kDer1: { type: number }
            kDer1Local: { type: number }
            kDer1Visita: { type: number }
            kDer2: { type: number }
            kDer2Local: { type: number }
            kDer2Visita: { type: number }
            kDer3: { type: number }
            kDer3Local: { type: number }
            kDer3Visita: { type: number }
    ConstanteCuota:
      type: object
      description: 'Fila de constants_cuota (§3.8): rachas de SUMA de cuota del 1X2 y de la Doble Oportunidad, solo 2026'
      required: [equipoId, fixtureId, fecha, resultado, cuota, k]
      properties:
        equipoId: { type: integer }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        resultado: { type: integer, enum: [1, 0, -1], description: '1 gana · 0 empata · -1 pierde' }
        esLocal: { type: boolean, description: 'true si jugó de local (toggle LOCAL/VISITA)' }
        cuota:
          type: object
          description: >-
            Cuotas que aplicaron a ese partido, en la perspectiva del equipo (null si el
            mercado no se capturó; los dos mercados tienen huecos independientes).
          properties:
            victoria: { type: number, nullable: true }
            empate: { type: number, nullable: true }
            derrota: { type: number, nullable: true }
            dc1x: { type: number, nullable: true, description: 'doble oportunidad: no pierde' }
            dc12: { type: number, nullable: true, description: 'doble oportunidad: no empata' }
            dcX2: { type: number, nullable: true, description: 'doble oportunidad: no gana' }
        k:
          type: object
          description: >-
            24 acumuladores: los 18 de suma de cuota (6 familias × total/local/visita) + favorito y
            tapado × total/local/visita (ROADMAP_BURBUJAS §3, DERIVADOS al leer con el nivel del
            rival: gana cerrando favorito suma (1/cuota)·nivel; gana cerrando no favorito suma
            cuota·nivel; con ese rol y sin ganar revienta; sin rol o sin nivel se salta)
          properties:
            victoria: { type: number }
            victoriaLocal: { type: number }
            victoriaVisita: { type: number }
            empate: { type: number }
            empateLocal: { type: number }
            empateVisita: { type: number }
            derrota: { type: number }
            derrotaLocal: { type: number }
            derrotaVisita: { type: number }
            dc1x: { type: number }
            dc1xLocal: { type: number }
            dc1xVisita: { type: number }
            dc12: { type: number }
            dc12Local: { type: number }
            dc12Visita: { type: number }
            dcX2: { type: number }
            dcX2Local: { type: number }
            dcX2Visita: { type: number }
            favorito: { type: number }
            favoritoLocal: { type: number }
            favoritoVisita: { type: number }
            tapado: { type: number }
            tapadoLocal: { type: number }
            tapadoVisita: { type: number }
        favorito: { type: boolean, nullable: true, description: 'true cerró favorito (su cuota de victoria es la menor del 1X2) · false tapado · null sin cuota o parejo' }
        nivelRival: { type: number, nullable: true, description: 'nivel del rival (de /constantes) con el que se ponderan favorito y tapado; null = se salta' }
    GapEquipo:
      type: object
      required: [equipoId, nivel, ptsEsperados, proximos, partidoTrampa]
      properties:
        equipoId: { type: integer }
        nivel: { type: number }
        ptsRecientes: { type: number, nullable: true }
        ptsEsperados: { type: number, description: 'μ recortado a [0,3]' }
        gap: { type: number, nullable: true, description: 'esperados − recientes; >0 subrinde' }
        senal: { type: string, enum: [fuerte, leve, equilibrio], nullable: true }
        tendencia: { type: string, enum: [mejora, empeora], nullable: true }
        ptsEsperadosAjustados: { type: number, nullable: true, description: 'media de μ(nivel, rival_i, localía_i) sobre los MISMOS últ. 5 (ajuste por calendario); null si no hay 5' }
        gapAjustado: { type: number, nullable: true, description: 'esperadosAjustados − recientes; >0 subrinde DADO su calendario' }
        senalAjustada: { type: string, enum: [fuerte, leve, equilibrio], nullable: true }
        tendenciaAjustada: { type: string, enum: [mejora, empeora], nullable: true }
        muPartido: { type: number, nullable: true, description: 'μ del PROPIO fixture analizado (rival real, localía real): si hoy puede expresarse la regresión' }
        proximos:
          type: array
          maxItems: 3
          description: 'camino de recuperación: próximos fixtures del equipo tras el analizado'
          items: { $ref: '#/components/schemas/ProximoPartido' }
        recuperabilidad: { type: number, nullable: true, description: 'media de muEsperado sobre proximos; null si no hay próximos' }
        senalCalendario: { type: string, enum: [blando, neutro, duro], nullable: true, description: 'recuperabilidad vs μ genérica (umbral ±0.15, provisional hasta backtest)' }
        partidoTrampa: { type: boolean, description: 'rival de hoy claramente inferior con un grande (internacional o nivel ≥ propio) a ≤4 días: candidato a rotación/cansancio' }
        ventanaNivel:
          type: object
          nullable: true
          description: >
            De qué partidos está hecho el nivel: los últimos 20 terminados de todas las competiciones
            (MOTOR §2), con el mismo filtro y deduplicación que el pipeline, contados por tipo
            (backend/analisis/ventana_nivel.py; 30/10/2026, incidencia 860: Galatasaray con 6
            amistosos de pretemporada y 3 de Champions en la ventana). Dato contado: no corrige μ.
          properties:
            partidos: { type: integer }
            amistosos: { type: integer }
            internacionales: { type: integer, description: 'torneos internacionales de clubes' }
            otros: { type: integer }
            desde: { type: string }
            hasta: { type: string }
            completa: { type: boolean, description: 'false con menos de 20 partidos en la base' }
    ProximoPartido:
      type: object
      required: [fixtureId, fecha, rival, esLocal, nivelRival, muEsperado, esInternacional, diasDescanso]
      properties:
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        rival: { $ref: '#/components/schemas/Equipo' }
        esLocal: { type: boolean }
        nivelRival: { type: number, description: 'nivel continuo a la fecha (fallback 1.0 — §3.1)' }
        muEsperado: { type: number, description: 'μ(nivel, nivelRival, localía) de ese partido futuro' }
        esInternacional: { type: boolean }
        diasDescanso: { type: integer, description: 'días desde el partido anterior del camino (el analizado para el primero)' }
        conflicto: { type: boolean, description: 'otro partido del equipo a menos de 24 h: uno de los dos es un aplazado sin marcar o un duplicado (jugadores.choque)' }
    Prediccion:
      type: object
      required: [fixtureId, local, visitante, generadoEn]
      properties:
        fixtureId: { type: integer }
        local: { $ref: '#/components/schemas/GapEquipo' }
        visitante: { $ref: '#/components/schemas/GapEquipo' }
        gapDiff: { type: number, nullable: true }
        gapDiffAjustado: { type: number, nullable: true, description: 'gapAjustado_local − gapAjustado_visitante' }
        fiabilidadMu:
          type: object
          nullable: true
          description: 'confianza en μ v2 para la liga del fixture (evidencia: calibración por liga 2026-07, doc §5); BAJA si los dos equipos vienen de bases distintas (la condición de ESCALA-LIGAS: μ cruza niveles que no comparan); MEDIA si la ventana de 20 del nivel de un lado tiene 3+ amistosos (incidencia 860; `porVentana`)'
          properties:
            nivel: { type: string, enum: [alta, media, baja] }
            nota: { type: string, description: 'por qué, en lenguaje de apostador' }
            escala: { type: string, description: 'solo con bases distintas: la relación (rival de categoría inferior · superior · fuera del padrón · otra liga)' }
            notaLiga: { type: string, description: 'solo con bases distintas o con la ventana de amistosos: lo que diría la liga sola' }
            ventana: { type: object, additionalProperties: { type: string }, description: 'por lado (local/visitante), «6 amistosos y 3 internacionales de 20»; solo los lados que tienen alguno' }
            porVentana: { type: boolean, description: 'con 3+ amistosos en la ventana de 20 de un lado: «alta» baja a «media» (o la nota lo suma); con menos de 10 partidos en la ventana o el último de hace más de un año, «baja» (incidencia 991); μ no se toca' }
            canchaNeutral: { type: boolean, description: 'la sede no es la habitual del local (la más repetida en sus últimos 20 de local): la localía que μ suma no aplica; «alta» baja a «media» (incidencia 991)' }
        unXDos:
          nullable: true
          description: >
            El 1X2 del MOTOR desde los dos μ_partido (logística multinomial sobre d = μ_local − μ_visita y d²,
            calibrada con backend/backtest_unxdos_motor.py; MOTOR_SAD_EXTRACCION.md §5.6). Es la fuente «motor» del
            pronóstico (disciplina 33), no el pronóstico. μ son PUNTOS esperados: no se meten en un Poisson como goles.
            null si falta un μ.
          allOf: [{ $ref: '#/components/schemas/UnXDosMotor' }]
        generadoEn: { type: string, format: date-time }
    UnXDosMotor:
      type: object
      required: [local, empate, visita, d, modelo, calibracion, nota]
      properties:
        local: { type: number, description: 'porcentaje; los tres suman 100' }
        empate: { type: number }
        visita: { type: number }
        d: { type: number, description: 'μ_local − μ_visita' }
        modelo: { type: string, example: logistica-mu-v1 }
        calibracion:
          type: object
          description: 'de dónde salen los coeficientes y cómo dio la prueba temporal (20 % más reciente)'
          properties:
            fecha: { type: string }
            partidos: { type: integer }
            equipos: { type: integer }
            desde: { type: string }
            hasta: { type: string }
            logLoss: { type: number }
            logLossFrecuencia: { type: number, description: 'quien no mira el partido' }
            logLossPoissonSobreMu: { type: number, description: 'lo que se improvisaba con μ como λ de goles' }
            acierto: { type: number }
        nota: { type: string }
    AnalisisPrepartido:
      type: object
      required: [fixtureId, niveles, constantes, prediccion, resumen]
      properties:
        fixtureId: { type: integer }
        niveles:
          type: object
          properties:
            local: { $ref: '#/components/schemas/Nivel' }
            visitante: { $ref: '#/components/schemas/Nivel' }
        constantes:
          type: object
          properties:
            local: { $ref: '#/components/schemas/Constantes', nullable: true }
            visitante: { $ref: '#/components/schemas/Constantes', nullable: true }
        prediccion: { $ref: '#/components/schemas/Prediccion' }
        resumen: { type: string }
    EquipoStats:
      type: object
      description: >-
        Calculadas de fixtures. Los promedios avanzados (xG, posesión, tiros a
        puerta, córners) salen de las stats por partido ya ingestadas: los
        últimos `avanzadas.ventana` partidos terminados con ficha, cada uno
        sobre los partidos donde vino esa métrica (`avanzadas.n`). Sin ficha,
        null — nunca un cero.
      required: [equipoId, nombre, partidosJugados, puntos, forma, golesFavorProm, golesContraProm]
      properties:
        equipoId: { type: integer }
        nombre: { type: string }
        partidosJugados: { type: integer }
        puntos: { type: integer }
        forma:
          type: array
          description: Últimos 5 resultados, más reciente primero
          items: { type: string, enum: [W, D, L] }
        golesFavorProm: { type: number }
        golesContraProm: { type: number }
        xgProm: { type: number, nullable: true }
        xgContraProm: { type: number, nullable: true, description: xG del rival por partido }
        posesionProm: { type: number, nullable: true, description: 0-100 }
        tirosPuertaProm: { type: number, nullable: true }
        cornersProm: { type: number, nullable: true }
        temporada:
          type: object
          nullable: true
          description: >
            La temporada en curso en su liga doméstica (`escala.base_de`). Los campos de
            arriba (partidosJugados, puntos, promedios de goles) son TODA la historia de la
            base; esto es lo que el E2 del EFE pide (incidencias 520 y 539). null sin liga
            doméstica en la base.
          properties:
            ligaId: { type: integer }
            liga: { type: string }
            temporada: { type: integer }
            partidosJugados: { type: integer }
            puntos: { type: integer }
            puntosPorPartido: { type: number, nullable: true }
            golesFavor: { type: integer }
            golesContra: { type: integer }
            posicion: { type: integer, nullable: true, description: 'en la tabla del año' }
            nota: { type: string }
        avanzadas:
          type: object
          description: La muestra de los promedios avanzados
          required: [partidos, ventana, n]
          properties:
            partidos: { type: integer, description: partidos terminados con stats capturadas (≤ ventana) }
            ventana: { type: integer }
            n:
              type: object
              description: partidos donde vino cada métrica
              properties:
                xg: { type: integer }
                xgContra: { type: integer }
                posesion: { type: integer }
                tirosPuerta: { type: integer }
                corners: { type: integer }
    Jugador:
      type: object
      description: Indicadores de un jugador (docs/JUGADORES.md, capa 1)
      required: [id, nombre, posicion, partidos, titularidades, minutos, pctMinutos, confianza,
                 goles, asistencias, participacionOfensiva, amarillas, rojas, enCapilla]
      properties:
        id: { type: integer }
        jugadorId: { type: integer, description: 'el mismo id, con el nombre que usan la tabla F1 y el bloque F' }
        nombre: { type: string }
        edad: { type: integer, nullable: true }
        foto: { type: string, nullable: true }
        posicion: { type: string, description: 'Portero · Defensa · Centrocampista · Delantero · ""' }
        partidos: { type: integer }
        titularidades: { type: integer }
        minutos: { type: integer }
        pctMinutos: { type: number, description: 'minutos / máx. de la plantilla (proxy de titularidad); con `minutosIncoherentes`, cuenta solo lo que cabe en sus partidos (125 por partido)' }
        minutosIncoherentes: { type: boolean, description: 'la API trae más minutos de los que caben en sus partidos (J. García, Tigres: 1 partido y 1.708 min); `minutos` es el dato crudo' }
        rating: { type: number, nullable: true, description: media ponderada por minutos entre competiciones }
        confianza: { type: string, enum: [A, B, C], description: 'A ≥1800 min · B ≥600 · C <600; recién llegado baja un grado' }
        goles: { type: integer }
        asistencias: { type: integer }
        golesP90: { type: number, nullable: true }
        asistenciasP90: { type: number, nullable: true }
        gaP90Ajustado: { type: number, nullable: true, description: '(G+A)/90 con encogimiento bayesiano hacia la media de su posición (M=900 min)' }
        participacionOfensiva: { type: number, description: (G+A) del jugador / Σ goles de la plantilla }
        amarillas: { type: integer }
        rojas: { type: integer }
        enCapilla: { type: boolean, description: '≥4 amarillas sin roja: riesgo de sanción (bandera, la regla exacta varía por torneo)' }
        paradasP90: { type: number, nullable: true, description: solo porteros }
        golesEncajadosP90: { type: number, nullable: true, description: solo porteros }
        baja:
          type: object
          nullable: true
          description: 'baja reportada por la API (/injuries). `lectura` dice si cuenta: `senal` (pocos marcados: baja real) o `ruido` (el flag Missing Fixture marcó más del umbral de la plantilla; no cuenta como baja en el resumen del skill, la estabilidad ni las pantallas)'
          properties:
            tipo: { type: string, nullable: true }
            detalle: { type: string, nullable: true }
            lectura: { type: string, enum: [senal, ruido, desmentida], description: 'desmentida = jugó (titular o con un evento) un partido posterior a la fecha de la baja, o figura en una hoja (once o banco) de esa fecha o posterior (incidencia 649): no cuenta. Una sanción (roja, amarillas, suspensión) es senal aunque el equipo esté en ruido' }
            lesion: { type: boolean, description: 'lesión con nombre («Muscle Injury», «Knee Injury»): señal aunque el equipo esté en ruido, como la sanción (incidencia 1014)' }
            soloLista: { type: string, enum: [internacional], description: '«Off the roster» en la fecha de un partido internacional del equipo: fuera de la LISTA de ese torneo, no de la liga; se lee ruido (incidencia 522)' }
            sancion: { type: boolean, description: 'el motivo es disciplinario (Red Card, Yellow Cards, Suspended): cuenta como baja siempre (incidencias 71 y 415, 24/10/2026)' }
            lecturaApi: { type: string, enum: [senal, ruido], description: 'con desmentida, la lectura que tenía' }
            desmentidaPorOnce:
              type: object
              properties:
                fechaBaja: { type: string, format: date }
                jugoEl: { type: string, format: date }
                convocadoEl: { type: string, format: date, description: 'la hoja (once o banco) que la desmintió sin que jugara (649)' }
        recienLlegado:
          type: object
          nullable: true
          description: traspaso hacia el equipo en ≤90 días
          properties:
            desde: { type: string, nullable: true }
            fecha: { type: string, nullable: true }
    Plantilla:
      type: object
      description: Plantilla con indicadores + agregados del equipo (docs/JUGADORES.md)
      required: [equipoId, jugadores, dependencia, revolucion]
      properties:
        equipoId: { type: integer }
        nombre: { type: string }
        temporada: { type: integer, nullable: true }
        actualizadoEn: { type: string, format: date-time, nullable: true, description: última ingesta de jugadores del equipo }
        entrenador:
          type: object
          nullable: true
          description: >
            El DT vigente con su procedencia y su edad: sobre 19 verificados contra prensa el
            18/09/2026, 4 eran el saliente (3 a 27 meses atrás) y sin `actualizadoEn` no había
            forma de marcarlos. `fuente` = coachs (la carrera de /coachs) o alineacion (el DT
            que se sentó en el banco en el último partido y que la carrera no lista: así se
            captura la SALIDA, no solo el alta).
          properties:
            nombre: { type: string, nullable: true }
            desde: { type: string, nullable: true, description: 'asunción; con fuente alineacion, el primer partido de su racha en el banco' }
            actualizadoEn: { type: string, nullable: true, description: 'cuándo se fijó este registro' }
            fuente: { type: string, enum: [coachs, alineacion] }
        dependencia:
          type: object
          description: 'HHI de shares de G+A: ~1/n coral · →1 él-dependiente'
          properties:
            hhi: { type: number, nullable: true }
            top:
              type: array
              items:
                type: object
                properties:
                  jugadorId: { type: integer }
                  nombre: { type: string }
                  participacion: { type: number }
        revolucion:
          type: object
          description: >
            traspasos de la ventana reciente (estabilidad de plantel). Desde el 23/10/2026
            (incidencia 43) `llegadas`/`salidas` cuentan solo jugadores CON MINUTOS en el primer
            equipo (minutos con el club en jugador_stats, o titular en un once del último año),
            una vez por dirección; `enPapeles` trae todos los traspasos (cesiones, vueltas de
            cesión y juveniles incluidos). La Juventus pasaba de 85 en papeles a los que jugaron.
          properties:
            llegadas: { type: integer }
            salidas: { type: integer }
            ventanaDias: { type: integer }
            criterio: { type: string }
            enPapeles:
              type: object
              properties:
                llegadas: { type: integer }
                salidas: { type: integer }
        golesPlantilla: { type: integer, description: Σ goles de la plantilla (denominador de participación) }
        missingFixture:
          type: object
          nullable: true
          description: 'el flag «Missing Fixture» de la API leído por DENSIDAD (docs/JUGADORES.md): null si no marcó a nadie. Por encima de `umbral` (fracción de la plantilla) es ruido —marcó a media plantilla— y ninguna de esas bajas cuenta, salvo las sanciones. Desde el 24/10/2026 la densidad cuenta solo las marcas VIGENTES: las que el once ya desmintió van aparte en `desmentidas`'
          properties:
            marcados: { type: integer, description: 'marcas vigentes (sin las desmentidas)' }
            desmentidas: { type: integer, description: 'marcas viejas de jugadores que ya volvieron a jugar: no cuentan para la densidad' }
            plantilla: { type: integer }
            densidad: { type: number, description: marcados / plantilla }
            umbral: { type: number }
            lectura: { type: string, enum: [senal, ruido] }
        jugadores:
          type: array
          items: { $ref: '#/components/schemas/Jugador' }
        ingestaLanzada: { type: boolean, description: 'con jugadores=[]: true si la ingesta on-demand del equipo quedó lanzada en segundo plano (la UI sondea)' }
        origenTemporada:
          type: string
          enum: [vigente, anterior, plantel]
          description: >
            De qué temporada salen las stats. En muchas ligas la API publica la temporada
            nueva con semanas de retraso (Ludogorets, Spartak Trnava: 25/09/2026). Mientras
            tanto, `anterior` = stats de la temporada anterior SOLO de los que siguen en el
            club (según /players/squads); `plantel` = solo la lista actual, sin stats.
        plantelSinStats:
          type: array
          description: los del plantel actual sin stats en la temporada servida (llegaron después, o todos si origen=plantel)
          items:
            type: object
            properties:
              jugadorId: { type: integer }
              nombre: { type: string }
              posicion: { type: string }
              numero: { type: integer, nullable: true }
    FichaEquipo:
      allOf:
        - $ref: '#/components/schemas/Plantilla'
        - type: object
          properties:
            congestion:
              type: object
              description: calculada de fixtures ya capturados (0 requests)
              properties:
                diasDescanso: { type: integer, nullable: true }
                partidos21d: { type: integer }
    FichaPartido:
      type: object
      description: 'Puente con los skills: plantillas + congestión de ambos equipos + ficha táctica'
      required: [fixtureId, generadoEn, local, visitante]
      properties:
        fixtureId: { type: integer }
        generadoEn: { type: string, format: date-time }
        local: { $ref: '#/components/schemas/FichaEquipo' }
        visitante: { $ref: '#/components/schemas/FichaEquipo' }
        tactica: { $ref: '#/components/schemas/FichaTactica' }
        eliminatoria:
          allOf: [{ $ref: '#/components/schemas/Eliminatoria' }]
          nullable: true
          description: 'quién pasó la llave (`avanzaLado` local | visitante); null si no es eliminatoria o no terminó'
    GolesLado:
      type: object
      properties:
        equipo: { type: string }
        esperados: { type: number, description: 'goles esperados (Poisson del modelo G3)' }
        distribucion: { type: object, additionalProperties: { type: number }, description: '0 · 1 · 2 · 3+' }
        intervalo: { $ref: '#/components/schemas/IntervaloGoles' }
        intervaloAmplio: { $ref: '#/components/schemas/IntervaloGoles' }
    IntervaloGoles:
      type: object
      properties:
        desde: { type: integer }
        hasta: { type: integer }
        prob: { type: number }
    GolesAcotados:
      type: object
      description: >
        Los goles acotados de un partido (backend/analisis/goles.py, REVENTON §17): el intervalo de
        dos goles (y el de tres, más ancho y más seguro) de cada lado, los cuatro marcadores que salen
        de cruzarlos y los más probables. Medido sobre el padrón: el intervalo acierta lo que promete;
        contra el mercado de goles no hay ventaja. `sinDato` sin modelo calibrado o sin historia.
      properties:
        sinDato: { type: string }
        local: { $ref: '#/components/schemas/GolesLado' }
        visita: { $ref: '#/components/schemas/GolesLado' }
        marcadorAcotado:
          type: object
          properties:
            marcadores: { type: array, items: { type: string } }
            prob: { type: number }
        masProbables: { type: array, items: { type: object, properties: { marcador: { type: string }, prob: { type: number } } } }
        masDe2_5: { type: number }
        ambosMarcan: { type: number }
        modelo: { type: object, additionalProperties: true }
        nota: { type: string }
    GolesAcotadosEquipo:
      type: object
      description: 'la misma lectura desde un equipo: `mete` (sus goles) y `recibe` (los del rival)'
      properties:
        sinDato: { type: string }
        mete: { $ref: '#/components/schemas/GolesLado' }
        recibe: { $ref: '#/components/schemas/GolesLado' }
        marcadorAcotado: { type: object, additionalProperties: true }
        masProbables: { type: array, items: { type: object, additionalProperties: true } }
        masDe2_5: { type: number }
        ambosMarcan: { type: number }
        modelo: { type: object, additionalProperties: true }
        nota: { type: string }
    Eliminatoria:
      type: object
      description: >
        Quién pasó una llave de eliminación directa, calculado de la base
        (`backend/eliminatoria.py`, incidencia 774: Palmeiras pasó a la final de
        la Libertadores por penales y un parte lo dio por eliminado). Sale de la
        tanda, del global con la ida o de la prórroga; NUNCA del marcador a 90'.
        `avanza` null = no se sabe (ida de una llave, ronda sin la otra pierna).
      required: [fixtureId, marcador, prorroga]
      properties:
        fixtureId: { type: integer }
        competicion: { type: string }
        ronda: { type: string }
        marcador: { type: string, description: 'con prórroga, local-visita' }
        prorroga: { type: boolean }
        penales: { type: string, nullable: true, description: 'la tanda, local-visita' }
        global: { type: string, nullable: true, description: 'el global con la ida, local-visita de este partido' }
        ida: { type: integer, nullable: true }
        avanza: { type: integer, nullable: true, description: 'id del equipo que pasa' }
        eliminado: { type: integer, nullable: true }
        avanzaLado: { type: string, nullable: true }
    EtiquetaRival:
      type: object
      description: >
        Una etiqueta del bloque G2 con el DATO que la sostiene. Sin el número
        sería una opinión, y una opinión no debería entrar en un análisis.
      required: [codigo, label, dato]
      properties:
        codigo:
          type: string
          enum: [RECIEN_ASCENDIDO, EN_CRISIS, LOCAL_FUERTE, VISITA_DEBIL, EQUIPO_SORPRESA, BLOQUE_BAJO, CLASICO]
        label: { type: string, description: 'el nombre del protocolo, para mostrar' }
        dato: { type: string, description: 'la cifra que dispara la etiqueta ("3 derrotas seguidas")' }
        nota: { type: string, description: 'qué implica para la lectura' }
        parcial:
          type: boolean
          description: >
            true cuando el criterio solo se cubre en parte (CLÁSICO: detectamos
            derbis de ciudad, no rivalidades nacionales). Su ausencia no prueba nada.
    PartidoCalendario:
      type: object
      description: 'Un partido próximo con el mapa de rivales del bloque G ya resuelto'
      required: [fixtureId, fecha, rivalId, rival, condicion, etiquetas]
      properties:
        fixtureId: { type: integer }
        fecha: { type: string, format: date }
        rivalId: { type: integer }
        rival: { type: string }
        condicion: { type: string, enum: [L, V] }
        torneo: { type: string, nullable: true }
        ronda: { type: string, nullable: true }
        posicionRival: { type: integer, nullable: true }
        tablaDe: { type: string, description: 'de qué tabla sale la posición: la fase internacional, el torneo corto en curso (con 5+ fechas) o «año»' }
        equiposEnLaTabla: { type: integer, nullable: true }
        zonaRival: { type: string, nullable: true, enum: [alta, media, descenso, null] }
        diasDescanso: { type: integer, nullable: true, description: 'contra el partido anterior; null si choca con él (conflicto)' }
        conflicto: { type: string, description: 'otro partido del equipo a menos de 24 h: uno es un aplazado sin marcar o un duplicado; ausente si no hay choque' }
        etiquetas: { type: array, items: { $ref: '#/components/schemas/EtiquetaRival' } }
    Distribucion:
      type: object
      description: 'media · mediana · moda · min · max de una lista. moda null si ningún valor se repite (K a entero, nivel a un decimal); en empate, la menor.'
      required: [media, mediana, moda, min, max]
      properties:
        media: { type: number }
        mediana: { type: number }
        moda: { type: number, nullable: true }
        min: { type: number }
        max: { type: number }
    Reventon:
      type: object
      description: 'Una burbuja cerrada: la racha (signo, partidos, K pico) y el partido que la reventó'
      required: [signo, partidos, kPico, fixtureId, fecha, rivalId, rival, nivelRival, condicion, resultado, esInternacional]
      properties:
        signo: { type: string, enum: ['+', '-'] }
        partidos: { type: integer, description: 'partidos de la condición que duró la racha' }
        kPico: { type: number, description: '|K| máxima antes de reventar' }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        rivalId: { type: integer }
        rival: { type: string }
        nivelRival: { type: number }
        condicion: { type: string, enum: [L, V] }
        resultado: { type: string, example: '0-1' }
        esInternacional: { type: boolean }
        termina: { type: string, enum: [cero, cambio], description: 'cómo se cortó: la K se reinició a 0 (empate) o pasó al otro signo' }
    HistorialSigno:
      type: object
      required: [n, kPico, partidos, nivelRival, termina]
      properties:
        n: { type: integer }
        kPico: { $ref: '#/components/schemas/Distribucion' }
        partidos: { $ref: '#/components/schemas/Distribucion' }
        nivelRival: { $ref: '#/components/schemas/Distribucion', description: 'nivel del rival que reventó cada burbuja' }
        termina:
          type: object
          description: 'cuántas burbujas de este signo se cortaron a 0 (primero empata) y cuántas al otro signo (se cae de golpe)'
          properties:
            cero: { type: integer }
            cambio: { type: integer }
    PeriodoBurbuja:
      type: object
      description: >
        Un corte en el tiempo para releer la misma referencia: el Universitario de hoy no es
        el de Fossati ni el City de ahora el del primer Guardiola. En orden fijo: UNA por cada
        temporada de la historia (`temporada:2025`, cerrada en el primer partido de la
        siguiente), UNA por cada año (`anio:2025`), `dt` (desde la asunción del DT de la
        plantilla) y `ultimos20`. `vigente` marca las en curso (la temporada y el año del
        último partido, el DT, los últimos N): la tarjeta muestra esas y la gráfica deja
        elegir cualquiera. Un período que no se pudo cortar viaja con `sinDato`, nunca con un
        corte inventado (`temporada` a secas cuando las filas no traen la temporada).
      required: [clave, etiqueta, desde, hasta, vigente, sinDato]
      properties:
        clave: { type: string }
        etiqueta: { type: string }
        desde: { type: string, description: 'YYYY-MM-DD inclusivo; vacío con sinDato' }
        hasta: { type: string, description: 'YYYY-MM-DD exclusivo; vacío = abierto' }
        vigente: { type: boolean }
        sinDato: { type: string }
    HistorialPeriodo:
      allOf:
        - { $ref: '#/components/schemas/PeriodoBurbuja' }
        - type: object
          description: >
            Las mismas medidas de `historial`, sobre los reventones ocurridos DESDE `desde`
            (se filtra por la fecha en la que reventó; los episodios no se recortan). La
            global sigue mandando en el riesgo —es la calibrada con el backtest—; esto es
            referencia para el que lee, y con n chico dice n.
          required: [partidos, reventones, positivo, negativo]
          properties:
            partidos: { type: integer, description: 'partidos de la familia dentro del período' }
            reventones: { type: integer }
            positivo: { $ref: '#/components/schemas/HistorialSigno', nullable: true }
            negativo: { $ref: '#/components/schemas/HistorialSigno', nullable: true }
    FamiliaBurbuja:
      type: object
      required: [familia, partidosEnCondicion, actual, reventones, historial, historialPorPeriodo, posicion, rival, riesgo, extremo]
      properties:
        familia: { type: string, enum: [total, local, visita] }
        partidosEnCondicion: { type: integer }
        historialPorPeriodo: { type: array, items: { $ref: '#/components/schemas/HistorialPeriodo' } }
        espinaTarjeta: { $ref: '#/components/schemas/EspinaTarjeta', nullable: true }
        sinTarjeta: { type: string, nullable: true, description: 'por qué espinaTarjeta es null (K en 0 · familia que no se mueve en el próximo · sin guía); ausente si hay tarjeta' }
        actual:
          type: object
          nullable: true
          description: 'Burbuja abierta hoy; null si la K está en 0'
          required: [signo, k, partidos, kPico, desde, aplicaAlProximo]
          properties:
            signo: { type: string, enum: ['+', '-'] }
            k: { type: number, description: 'K con signo' }
            partidos: { type: integer }
            kPico: { type: number }
            desde: { type: string, format: date-time }
            aplicaAlProximo: { type: boolean, nullable: true, description: 'si el próximo partido mueve esta familia (null sin próximo)' }
        reventones: { type: array, items: { $ref: '#/components/schemas/Reventon' }, description: 'cerradas, cronológicas (las 40 más recientes; la estadística usa todas)' }
        historial:
          type: object
          required: [positivo, negativo]
          properties:
            positivo: { $ref: '#/components/schemas/HistorialSigno', nullable: true }
            negativo: { $ref: '#/components/schemas/HistorialSigno', nullable: true }
        posicion:
          type: object
          nullable: true
          description: 'la burbuja abierta frente a los reventones de su signo'
          required: [percentilK, percentilRacha, kSobreMediana]
          properties:
            percentilK: { type: integer, description: '% de reventones con K pico ≤ K actual' }
            percentilRacha: { type: integer }
            kSobreMediana: { type: number, nullable: true }
        rival:
          type: object
          nullable: true
          description: 'el próximo rival frente al nivel con el que suele reventar (solo si la familia aplica al próximo)'
          required: [nivelProximo, medianaReventon, distancia, enZona, tramo]
          properties:
            nivelProximo: { type: number }
            medianaReventon: { type: number }
            distancia: { type: number, description: 'nivelProximo − mediana (con signo, sin girar)' }
            enZona: { type: boolean, description: 'tramo ≠ lejos' }
            tramo: { type: string, enum: [lejos, zona, fuerte, muy fuerte], description: 'en la dirección del riesgo (más fuerte para la burbuja +, más flojo para la −): lejos < −0.15 · zona ±0.15 · fuerte ≥ 0.15 · muy fuerte ≥ 0.45' }
            escalaComparable: { type: boolean, description: 'false con escala distinta (22/10/2026): el tramo compara niveles de bases distintas; los puntos NO cambian, se marca' }
            notaEscala: { type: string }
        riesgo:
          type: object
          nullable: true
          required: [nivel, puntos, motivos, confianza, confianzaMotivos]
          properties:
            nivel: { type: string, enum: [bajo, medio, alto, muy alto, sin base] }
            puntos: { type: integer, description: 'calibrados con el backtest real (docs/REVENTON.md §8): la K NO puntúa · racha ≥ mediana +1 · rival en zona +3 · fuerte +5 · muy fuerte +7. bajo 0–1 · medio 2–3 · alto 4–5 · muy alto ≥ 6' }
            motivos: { type: array, items: { type: string } }
            confianza: { type: string, enum: [baja, media, alta], description: 'muestra de reventones y estabilidad; nunca mueve el riesgo' }
            confianzaMotivos: { type: array, items: { type: string } }
            movimiento:
              type: object
              nullable: true
              description: 'guía calibrada (backtest, REVENTON §14), solo familia total: con este signo y nivel de riesgo, qué parte de las burbujas siguió, se reinició a 0 (empate) o pasó al otro signo en el partido siguiente'
              properties:
                sigue: { type: number }
                cero: { type: number }
                cambio: { type: number }
        extremo:
          $ref: '#/components/schemas/ExtremoBurbuja'
          nullable: true
          description: 'ALERTA DE EXTREMO (prudencia, no probabilidad): null sin base del signo'
    ExtremoBurbuja:
      type: object
      description: >
        La burbuja abierta está en su máximo histórico para este equipo: |K| ≥ la K pico más
        alta con la que reventó ese signo (`kRecord`) o racha que SUPERA a la más larga y tiene
        3 partidos o más (`rachaRecord`; igualarla, o una racha de 1-2, no es récord: incidencia
        67, 23/10/2026).
        NO mueve el riesgo —el backtest dice que la K no puntúa—, pero es terreno sin
        precedente y la pantalla y el parte lo gritan aparte: no cargar la apuesta a que la
        racha siga. Cowork no se la puede saltar (docs/COWORK.md). `cerca` es el escalón
        de abajo: sin récord, la K o la racha ya superan (estricto) al 90 % de los reventones
        del signo; se avisa en ámbar (alerta K-CERCA-EXTREMO en el parte) y `activo` sigue
        siendo solo el récord.
      required: [activo, kRecord, rachaRecord, cerca, partidosHistoria, maximoPrevio, motivos, texto]
      properties:
        activo: { type: boolean }
        kRecord: { type: boolean }
        rachaRecord: { type: boolean }
        cerca: { type: boolean, description: 'franja alta sin récord: K o racha por encima del 90 % de los reventones del signo' }
        partidosHistoria: { type: integer, description: 'N: partidos de la condición en la base («la más alta en N partidos»)' }
        maximoPrevio:
          type: object
          required: [kPico, partidos]
          properties:
            kPico: { type: number }
            partidos: { type: integer }
        motivos: { type: array, items: { type: string } }
        texto: { type: string, description: "'' si no está activa ni cerca" }
        inflada:
          type: object
          nullable: true
          description: 'la mitad o más de la racha ABIERTA son amistosos (liga 667), o el récord solo lo es contándolos: cuentan, pero la racha se armó fuera de la competición (REVENTON §10.2). Desde el 23/10/2026 (incidencia 311) se marca en cualquier racha abierta, no solo con la alerta encendida. No apaga la alerta ni mueve el riesgo'
          properties:
            amistosos: { type: integer }
            partidos: { type: integer }
            texto: { type: string }
    EstabilidadEquipo:
      type: object
      required: [grado, motivos, sinDato, dt, movimientos, bajas, actualizadoEn]
      properties:
        grado: { type: string, enum: [estable, en transición, inestable, sin dato] }
        motivos: { type: array, items: { type: string } }
        sinDato: { type: array, items: { type: string }, description: 'lo que no está en la base y NO se rellena (dueños, organización…)' }
        dt:
          type: object
          nullable: true
          properties:
            nombre: { type: string }
            desde: { type: string, nullable: true }
            dias: { type: integer, nullable: true }
        movimientos:
          type: object
          nullable: true
          properties:
            llegadas: { type: integer }
            salidas: { type: integer }
            ventanaDias: { type: integer }
        bajas: { type: integer, nullable: true }
        actualizadoEn: { type: string, nullable: true }
    OtrasFamilias:
      type: object
      description: >
        Las OTRAS burbujas contadas para la narrativa (backend/analisis/familias.py, espejo
        src/lib/familias.ts, vectores dorados scripts/casos_familias.json): doble oportunidad,
        gana/pierde por 2+ y 3+, anota, recibe, ambos marcan, más de 2,5 — en la condición del
        próximo y en total. DESCRIPCIÓN, no riesgo: el largo y el récord no predicen el partido
        siguiente mejor que la frecuencia del equipo y en su récord se sostienen algo más
        (REVENTON §15). `perfilDc` (con qué frecuencia no pierde y no gana en la condición de hoy)
        SÍ agrega al 1X2 del motor (§15.1). `lineas` son las frases listas para leer: el perfil y
        las burbujas destacadas (3+ partidos o en su récord).
      properties:
        nota: { type: string }
        condicion: { type: string, nullable: true, enum: [local, visita, null] }
        perfilDc:
          type: object
          properties:
            condicion: { type: string, enum: [Local, Visita] }
            partidos: { type: integer }
            noPierde: { type: number }
            noGana: { type: number }
            burbuja: { type: integer, description: '+ racha sin perder · − racha perdiendo' }
            maximoPrevio: { type: integer }
            record: { type: integer, description: '2 supera · 1 iguala · 0 no o sin base' }
            texto: { type: string }
            escala: { type: string, description: 'solo con escala distinta (22/10/2026): la relación entre las bases' }
            notaEscala: { type: string }
        familias:
          type: array
          items:
            type: object
            properties:
              familia: { type: string }
              ambito: { type: string, enum: [total, local, visita] }
              valor: { type: boolean, description: 'true = racha (sí) · false = sequía (no)' }
              partidos: { type: integer }
              maximoPrevio: { type: integer, nullable: true }
              burbujasPrevias: { type: integer }
              record: { type: string, nullable: true, enum: [supera, iguala, 'no', null] }
              frecuencia: { type: number }
              n: { type: integer }
              probRacha: { type: number, description: 'frecuencia propia del estado de hoy elevada al largo: la chance de encadenar esta racha (24/10/2026)' }
              improbable: { type: boolean, description: 'probRacha < 0.05: rara para ESTE equipo' }
              destacada: { type: boolean }
              cuidado: { type: boolean, description: "en su récord, de 5+ partidos e improbable para el equipo: cuidado con la carga (alerta FAMILIA-RECORD del parte); prudencia, no probabilidad. Una sequía que su frecuencia hace habitual no grita (incidencias 420 y 450)" }
              texto: { type: string }
        lineas: { type: array, items: { type: string } }
    BurbujasEquipo:
      type: object
      description: 'Reventón de la burbuja (docs/REVENTON.md): guía calculada de la historia del equipo, no una probabilidad'
      required: [equipoId, nombre, nivel, bin, partidos, mandan, proximo, estabilidad, familias, periodos, aviso]
      properties:
        equipoId: { type: integer }
        nombre: { type: string, nullable: true }
        nivel: { type: number }
        bin: { type: integer }
        partidos: { type: integer, description: 'filas de constantes procesadas' }
        periodos: { type: array, items: { $ref: '#/components/schemas/PeriodoBurbuja' } }
        mandan:
          type: object
          description: 'qué familia pesa: la total, siempre (el backtest real la puso por delante en todos los niveles). reglaNivel conserva la hipótesis del nivel como dato'
          required: [tipo, familias, motivo, reglaNivel]
          properties:
            tipo: { type: string, enum: [globales, especificas] }
            familias: { type: array, items: { type: string, enum: [total, local, visita] } }
            motivo: { type: string }
            reglaNivel:
              type: object
              required: [tipo, familias, motivo, confirmada]
              properties:
                tipo: { type: string, enum: [globales, especificas], description: 'bin ≥ 7 o ≤ 2 → globales; 3–6 → la de la condición del próximo' }
                familias: { type: array, items: { type: string, enum: [total, local, visita] } }
                motivo: { type: string }
                confirmada: { type: boolean, description: 'false: el backtest del 16/09/2026 no la confirmó' }
        proximo:
          type: object
          nullable: true
          required: [fixtureId, fecha, rivalId, rival, condicion, nivelRival]
          properties:
            fixtureId: { type: integer }
            fecha: { type: string }
            rivalId: { type: integer }
            rival: { type: string }
            condicion: { type: string, enum: [L, V] }
            nivelRival: { type: number, description: 'último nivel del rival (1.0 si no tiene, como el motor §3.1)' }
        estabilidad: { $ref: '#/components/schemas/EstabilidadEquipo' }
        familias:
          type: object
          required: [total, local, visita]
          properties:
            total: { $ref: '#/components/schemas/FamiliaBurbuja' }
            local: { $ref: '#/components/schemas/FamiliaBurbuja' }
            visita: { $ref: '#/components/schemas/FamiliaBurbuja' }
        aviso: { type: string }
        vistaAlDia:
          type: object
          description: 'solo con antesDe: la vista «al día del partido» (docs/REVENTON.md §9)'
          properties:
            fixtureId: { type: integer }
            fecha: { type: string, nullable: true }
        otrasFamilias: { $ref: '#/components/schemas/OtrasFamilias' }
        golesAcotados:
          allOf: [{ $ref: '#/components/schemas/GolesAcotadosEquipo' }]
          description: 'con próximo: cuánto mete y cuánto recibe el equipo, acotado (REVENTON §17); sinDato sin modelo o sin historia'
        separacionLiga:
          type: object
          description: >-
            Cuánto separa el riesgo del reventón en la liga doméstica del equipo, medido liga por
            liga (AUC de los puntos, backtest sin fuga del 29/10/2026; backend/analisis/separacion_liga.py).
            Sube con la jerarquía de la liga (r = 0,89 con el peso del nivel en la μ). NO mueve los
            puntos ni los cortes: dice cuánto pesar la guía en la lectura.
          properties:
            ligaId: { type: integer, nullable: true }
            liga: { type: string, nullable: true }
            auc: { type: number, nullable: true }
            n: { type: integer, nullable: true }
            nivel: { type: string, enum: [alta, media, baja, sin medir], description: 'alta ≥ 0.64 · media ≥ 0.60 · baja < 0.60' }
            competicion: { type: string, enum: [liga, copa], description: 'copa = el próximo partido es de una copa nacional medida y manda su separación' }
            medidoEn: { type: string, nullable: true }
            nota: { type: string }
        escala:
          type: object
          description: >-
            De qué base sale el nivel del próximo rival (backend/analisis/escala.py). La liga
            doméstica es la más frecuente del último año SIN copas, internacionales ni amistosos;
            con solo copas, `categoria: fuera del padrón`. `comparable: false` = el nivel del rival
            no está en la escala del equipo y el riesgo va con reserva (no se mueve: es el
            calibrado). `historial` = cómo le fue en copas contra rivales de otra base.
          properties:
            equipo: { type: object, nullable: true, additionalProperties: true }
            rival: { type: object, nullable: true, additionalProperties: true }
            relacion: { type: string, enum: [misma, sin dato, rival de categoría inferior, rival fuera del padrón, rival de categoría superior, otra liga, equipo ascendido, equipo descendido, rival ascendido, rival descendido] }
            cambioDeCategoriaRival: { type: string, nullable: true, enum: [ascendido, descendido, null], description: 'en pretemporada (amistoso o copa): el rival ya cambió de categoría para la temporada que arranca (liga de su próximo partido de liga)' }
            cambioDeCategoria: { type: string, nullable: true, enum: [ascendido, descendido, null], description: 'el partido es de liga y de otra categoría que la base del equipo: las medianas del reventón son de la vieja' }
            comparable: { type: boolean }
            nota: { type: string }
            historial: { type: object, additionalProperties: true }
    EslabonDtp:
      type: object
      description: 'Un partido de la cadena DTP de un equipo foco'
      required: [equipoFoco, partidoN, fixtureId]
      properties:
        equipoFoco: { type: string }
        partidoN: { type: integer, description: 'posición cronológica del partido en la temporada del equipo' }
        rival: { type: string, nullable: true }
        fecha: { type: string, nullable: true }
        fixtureId: { type: integer, nullable: true }
        apertura: { type: object, nullable: true, description: 'M1/M2/M3/M6 escritos ANTES del partido' }
        cierre: { type: object, nullable: true, description: 'M4/M5 escritos después' }
        registro:
          type: object
          nullable: true
          properties:
            pronostico_clave: { type: string }
            que_paso: { type: string }
            veredicto: { type: string, enum: ['', acierto, parcial, fallo], description: '"" si no hubo pronóstico previo (anti-hindsight)' }
            leccion: { type: string }
    FichaTactica:
      type: object
      description: |
        Materia prima del DTP (docs/efe-dtp/DTP_DISENO.md): XI con carriles,
        goles con autor y asistente, y métricas del partido. Todo vacío si la
        ingesta aún no capturó la ficha — nunca reconstruido a ojo.
      required: [eventos, capturada]
      properties:
        capturada: { type: boolean, description: 'false = no hay nada capturado; el DTP no puede abrir M1/M2/M4' }
        alineaciones:
          type: object
          nullable: true
          properties:
            local: { $ref: '#/components/schemas/Alineacion' }
            visitante: { $ref: '#/components/schemas/Alineacion' }
        eventos:
          type: array
          items:
            type: object
            properties:
              minuto: { type: integer, description: 'RELOJ CORRIDO: un 45+5 viaja como 50 y un 90+4 como 94 (con `extra` 5 / 4). El minuto del tiempo reglamentario es `minuto − extra`; el veredicto lo usa así (baseAnadido). No es un duplicado' }
              extra: { type: integer, description: 'minutos añadidos ya sumados en `minuto`' }
              tipo: { type: string, description: 'Goal | Card | subst | Var' }
              detalle: { type: string }
              equipoId: { type: integer }
              jugador: { type: string, nullable: true }
              jugadorId: { type: integer, nullable: true }
              asistente: { type: string, nullable: true }
              asistenteId: { type: integer, nullable: true }
              jugadorIdResuelto: { type: boolean, description: 'la API no mandó el id y salió de la plantilla por un nombre que casa con UN solo jugador' }
              cuerpoTecnico: { type: boolean, description: 'tarjeta al DT (el nombre casa con el entrenador y no con el jugador del id): no es de un jugador y jugadorId va null' }
              jugadorIdApi: { type: integer, nullable: true, description: 'con cuerpoTecnico, el id que mandó la API' }
        estadisticas:
          type: object
          nullable: true
          description: 'clave cruda de API-Football → valor ("Ball Possession": "62%")'
          properties:
            local: { type: object, additionalProperties: { type: string } }
            visitante: { type: object, additionalProperties: { type: string } }
    Alineacion:
      type: object
      required: [equipoId, titulares, suplentes, conGrid]
      properties:
        equipoId: { type: integer }
        formacion: { type: string, nullable: true }
        entrenador: { type: string, nullable: true }
        conGrid: { type: boolean, description: 'false = sin grid de la API: M2 no puede hablar de carriles' }
        titulares:
          type: array
          items: { $ref: '#/components/schemas/JugadorAlineado' }
        suplentes:
          type: array
          items: { $ref: '#/components/schemas/JugadorAlineado' }
    JugadorAlineado:
      type: object
      required: [jugadorId, nombre]
      properties:
        jugadorId: { type: integer }
        nombre: { type: string, nullable: true }
        numero: { type: integer, nullable: true }
        posicion: { type: string, nullable: true, description: 'G|D|M|F' }
        grid: { type: string, nullable: true, description: '"fila:columna" de API-Football' }
        carril: { type: string, nullable: true, enum: [izquierda, centro, derecha, null], description: 'derivado del grid; null si no hay' }
        jugadorIdResuelto: { type: boolean, description: 'la API lo mandó sin id (o negativo) y salió de la plantilla por nombre único' }
    CargaDespensa:
      type: object
      required: [equipos]
      properties:
        equipos:
          type: array
          items:
            type: object
            required: [equipo, datos]
            properties:
              equipo: { type: string, description: nombre EXACTO del equipo como aparece en la app }
              datos:
                type: object
                description: 'tipo → resumen textual denso (tipos: dt, plantel, tabla, resultados, fixture, xi_reciente, bajas)'
                additionalProperties: { type: string }
        fuentes:
          type: array
          items: { type: string }
    CargaDespensaResultado:
      type: object
      required: [depositados, equipos]
      properties:
        depositados: { type: integer }
        equipos:
          type: array
          items: { type: string }
        canonizados:
          type: object
          description: nombres ajustados al canon de la app (dado → teams.name)
          additionalProperties: { type: string }
        tiposValidos:
          type: array
          items: { type: string }
        tiposIgnorados:
          type: array
          items: { type: string }
    StandingRow:
      type: object
      required: [posicion, equipoId, nombre, puntos, partidosJugados, golesFavor, golesContra]
      properties:
        posicion: { type: integer }
        equipoId: { type: integer }
        nombre: { type: string }
        puntos: { type: integer }
        partidosJugados: { type: integer }
        golesFavor: { type: integer }
        golesContra: { type: integer }
    Cuota:
      type: object
      required: [fixtureId, mercado, seleccion, cuota, actualizadoEn]
      properties:
        fixtureId: { type: integer }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
        actualizadoEn:
          type: string
          format: date-time
          description: hora de la última captura de cuotas del partido (odds_history); sin historial, la del pedido
    EventoLive:
      type: object
      description: Evento del partido para anclar el movimiento de la gráfica (gol, tarjeta)
      required: [minuto, tipo]
      properties:
        minuto: { type: integer, nullable: true }
        tipo: { type: string, enum: [gol, amarilla, roja] }
        equipoId: { type: integer, nullable: true }
        jugador: { type: string, nullable: true }
        detalle: { type: string, nullable: true, description: 'detalle crudo de la API (Penalty, Own Goal…)' }
    GeneracionEfe:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [listo, generando, error, nada] }
        detalle: { type: string, nullable: true, description: 'mensaje del error o del progreso' }
        registro: { $ref: '#/components/schemas/AnalisisRegistro', nullable: true, description: 'presente solo con estado=listo' }
    OrigenDato:
      type: string
      description: >
        De dónde saldrá el dato al generar. `falta` es el único que cuesta
        dinero (dispara búsqueda web); `api` gasta cuota del plan de
        API-Football, no dólares.
      enum: [despensa, anejo, local, api, falta]
    DatoPreflight:
      type: object
      required: [tipo, origen, detalle]
      properties:
        tipo: { type: string, description: 'tipo del protocolo EFE (dt, plantel, tabla, resultados, fixture, xi_reciente, bajas)' }
        origen: { $ref: '#/components/schemas/OrigenDato' }
        detalle: { type: string, description: 'qué fuente exactamente, o por qué falta' }
        edadDias: { type: integer, nullable: true, description: 'solo en origen=anejo: días desde la captura' }
    EquipoPreflight:
      type: object
      required: [equipo, datos]
      properties:
        equipo: { type: string }
        enDespensa: { type: boolean, description: 'false = ningún dato guardado bajo ESE nombre (posible desajuste de nombre)' }
        datos:
          type: array
          items: { $ref: '#/components/schemas/DatoPreflight' }
    CostoPreflight:
      type: object
      required: [min, max, medido]
      properties:
        min: { type: number, description: 'USD' }
        max: { type: number, description: 'USD' }
        medido: { type: boolean, description: 'true = de corridas reales guardadas; false = de la fórmula' }
        muestra: { type: integer, description: 'corridas medidas que sostienen el rango (0 si es fórmula)' }
    CorridaDTO:
      type: object
      description: >
        Una llamada al modelo, con lo que costó DE VERDAD. `tokensPensamiento`
        es el razonamiento, que se cobra a precio de salida igual que el JSON:
        separarlos es lo que dice si hay que acortar textos (json) o bajar el
        esfuerzo (pensamiento).
      required: [tipo, costo, creadoEn]
      properties:
        tipo: { type: string, enum: [efe, timeline, dtp] }
        fixtureId: { type: integer, nullable: true }
        faltantes: { type: integer }
        busquedas: { type: integer }
        modelo: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        cacheWrite: { type: integer }
        cacheRead: { type: integer }
        tokensJson: { type: integer, description: 'parte del output que fue JSON emitido' }
        tokensPensamiento: { type: integer, description: 'parte del output que fue razonamiento' }
        costo: { type: number, description: 'USD reales de esa llamada' }
        creadoEn: { type: string, format: date-time }
    GastoFixture:
      type: object
      description: >
        Lo YA gastado en el partido. Suma todas las corridas, incluidas
        regeneraciones e intentos fallidos: el cargo existió aunque el análisis
        se descartara.
      required: [total, corridas, porTipo, ultimas]
      properties:
        total: { type: number, description: 'USD' }
        corridas: { type: integer }
        porTipo:
          type: array
          items:
            type: object
            properties:
              tipo: { type: string }
              corridas: { type: integer }
              costo: { type: number }
        ultimas:
          type: array
          items: { $ref: '#/components/schemas/CorridaDTO' }
    PreflightEfe:
      type: object
      required: [fixtureId, nivel, faltantes, busquedasPrevistas, bloqueado, umbralFrio, costo, equipos, recomendaciones]
      properties:
        fixtureId: { type: integer }
        nivel:
          type: string
          enum: [caliente, tibio, frio]
          description: 'caliente = 0 faltantes (sin búsquedas); frio = por encima del umbral del candado'
        faltantes: { type: integer, description: 'campos que dispararán búsqueda web (los dos equipos sumados)' }
        busquedasPrevistas: { type: integer, description: 'min(3 + 2 × faltantes, SAD_EFE_BUSQUEDAS); 0 si no falta nada' }
        bloqueado: { type: boolean, description: 'true = el candado de análisis frío lo va a bloquear (hace falta permitirFrio)' }
        umbralFrio: { type: integer, description: 'SAD_EFE_MAX_FALTANTES' }
        costo: { $ref: '#/components/schemas/CostoPreflight' }
        gasto: { $ref: '#/components/schemas/GastoFixture' }
        yaExiste: { type: boolean, description: 'true = ya hay EFE guardado para este fixture: verlo cuesta 0' }
        demo: { type: boolean, description: 'true = modo demo (SAD_EFE_DEMO): no se gasta nada' }
        equipos:
          type: array
          items: { $ref: '#/components/schemas/EquipoPreflight' }
        recomendaciones:
          type: array
          description: Qué hacer para bajar el costo, ordenado por lo que más ahorra
          items: { type: string }
    AnalisisRegistro:
      type: object
      required: [tipo, fixtureId, estado, versionEfe, creadoEn, resultado]
      properties:
        tipo: { type: string, enum: [efe, dtp, matriz] }
        fixtureId: { type: integer }
        estado: { type: string, enum: [preliminar, confirmado], description: 'preliminar = XI provisional (T−24h); confirmado = XI oficial (T−40min)' }
        versionEfe: { type: string, description: 'versión del protocolo con la que se emitió (inmutable)' }
        creadoEn: { type: string, format: date-time }
        resultado: { type: object, description: 'JSON del esquema EFE_COMPARATIVO / DTP / MATRIZ_V2 (backend/analisis/esquemas.py)', additionalProperties: true }
    FixtureLive:
      type: object
      required: [fixtureId, estado, minuto, golesLocal, golesVisitante, cuotas, serie, eventos, actualizadoEn, coberturaLive, coberturaConsultadaEn, vip]
      properties:
        fixtureId: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoFixture' }
        minuto: { type: integer, nullable: true }
        golesLocal: { type: integer, nullable: true }
        golesVisitante: { type: integer, nullable: true }
        cuotas:
          type: array
          description: Última captura de cuotas en juego (mercados mapeables del contrato)
          items: { $ref: '#/components/schemas/CuotaLive' }
        serie:
          type: array
          description: Movimiento acumulado del partido, asc por captura (sin suspendidas)
          items: { $ref: '#/components/schemas/PuntoLive' }
        eventos:
          type: array
          description: Goles y tarjetas del partido, asc por minuto (de la ingesta en vivo/cierre)
          items: { $ref: '#/components/schemas/EventoLive' }
        actualizadoEn: { type: string, format: date-time, nullable: true, description: 'última captura live; null si nunca hubo' }
        coberturaLive:
          type: string
          enum: [con_datos, sin_datos, feed_ajeno, fallo, presupuesto, sin_consultar]
          description: >
            Por qué `cuotas` puede venir vacía, leído de odds_live_consultas para la liga de
            este fixture. `sin_consultar`: el ciclo NUNCA le pidió /odds/live a esta liga (no
            le tocó turno con el tope por ciclo, o la ingesta está apagada). `sin_datos`: se
            le pidió y el feed vino vacío. `feed_ajeno`: el feed trajo partidos pero ninguno
            nuestro — el filtro ?league= no devolvió lo pedido, y NO es falta de cobertura.
            `fallo`: la consulta se cayó (red, HTTP o errors de la API).
            `presupuesto`: el plan diario de API-Football está agotado — el ciclo en vivo no
            hace ni una request, así que la última ronda de la liga es vieja y no explica nada.
            Manda sobre el resto salvo que la liga sí tenga cuotas capturadas.
            `con_datos`: la última consulta trajo cuotas de esa liga. Ninguno de los cuatro
            primeros permite afirmar que la API no cubra la liga: solo `sin_datos` se acerca,
            y aun así puede ser un feed momentáneamente vacío.
        coberturaConsultadaEn: { type: string, format: date-time, nullable: true, description: 'cuándo se consultó /odds/live de esta liga por última vez; null si nunca' }
        vip: { type: boolean, description: 'partido marcado "sí o sí": entra al rescate por fixture aunque su liga sea menor y, con el plan agotado, al modo emergencia (clave que factura excedente). La marca caduca sola a las 8 h' }
    CuotaLive:
      type: object
      required: [mercado, seleccion, cuota, suspendida]
      properties:
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
        suspendida: { type: boolean, description: 'la casa no acepta apuestas a esta selección ahora' }
    PuntoLive:
      type: object
      required: [minuto, mercado, seleccion, cuota]
      properties:
        minuto: { type: integer, nullable: true }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
    CuotaCasa:
      type: object
      description: Cuota de UNA casa para una selección (última foto de la ingesta)
      required: [fixtureId, mercado, seleccion, casaId, casa, cuota, mejor]
      properties:
        fixtureId: { type: integer }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        casaId: { type: integer }
        casa: { type: string }
        cuota: { type: number }
        mejor: { type: boolean, description: 'true si es la cuota más alta de la selección' }
    CuotaSnapshot:
      type: object
      description: Un punto del movimiento prepartido (media entre casas en esa captura)
      required: [fixtureId, mercado, seleccion, cuota, capturadoEn]
      properties:
        fixtureId: { type: integer }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
        casas: { type: integer, description: 'nº de bookmakers promediados en la captura' }
        capturadoEn: { type: string, format: date-time }
    XiLado:
      type: object
      description: El once de un lado tal como se lee de la hoja o del pantallazo
      properties:
        once: { type: array, items: { type: string }, description: 'los 11 titulares' }
        banca: { type: array, items: { type: string } }
        formacion: { type: string, description: 'en el GET, si el lado viene de la ficha, la formación de la ficha de HOY (la API la corrige después del cierre)' }
        formacionAlCerrar: { type: string, readOnly: true, description: 'solo en el GET: la formación con la que se cerró el once, cuando la ficha la cambió después' }
        fuente: { type: string, description: 'pantallazo BeSoccer, rueda de prensa, cuenta oficial…' }
        reemplazar:
          type: boolean
          default: false
          description: >
            Un lado que ya viene de la ficha de API-Football NO se pisa con una carga manual:
            se conserva y vuelve en `xiConservados` con el motivo. Con `true` sí se reemplaza.
    JugadorParte:
      type: object
      description: Una fila de la tabla F1. Sin zona o sin rol no entra (no pesaría en ninguna fórmula).
      required: [nombre, zona, rol]
      properties:
        nombre: { type: string }
        posicion: { type: string }
        zona: { type: string, enum: [GK, DEF, MID, ATK] }
        rol: { type: string, enum: [TF, TH, ROT, SUP], description: 'TF 🔴×3 · TH 🟠×2 · ROT 🟡×1 · SUP ⚪×0.5' }
        apps: { type: string, description: 'titularidades, ej. "12/15"' }
        jugadorId: { type: integer, description: 'el `id` del jugador en GET /equipos/{id}/plantilla. Con él, el once de la ficha casa por id y no por nombre (la API llama «J. Cerro» a Joshua Cantt): sin él, se cruza por nombre como antes' }
        idsAlternos: { type: array, items: { type: integer }, description: 'el otro id de la API para la misma persona (lo trae la tabla F1, incidencia 381): la hoja del partido casa con cualquiera' }
        estado: { type: string, enum: ['', disponible, baja, duda, duplicado], description: 'lo pone el backend al resolver el once. `duplicado`: una fila SIN jugadorId que casa por nombre con un titular o suplente que ya casó por id con OTRA fila (la base y la prensa lo escriben distinto, «D. Gelvez» / «Dayan Pérez»): es la misma persona y no pesa en el IP' }
        motivo: { type: string }
    EquipoParteEntrada:
      type: object
      description: Lo que Cowork escribe de un equipo. a = local, b = visitante.
      properties:
        nombre: { type: string, description: 'opcional; si no casa con el fixture se declara la discrepancia' }
        bloques:
          type: object
          description: 'sub-scores CRUDOS del protocolo (A ≤4, B ≤6, C ≤4, D ≤4, E ≤3); el ponderado lo calcula el backend'
          properties:
            A: { type: number }
            B: { type: number }
            C: { type: number }
            D: { type: number }
            E: { type: number }
        excluidos:
          type: object
          description: 'letra → motivo; un bloque excluido no suma ni al total ni al máximo'
          additionalProperties: { type: string }
        notas:
          type: object
          description: 'letra → una línea justificando el sub-score'
          additionalProperties: { type: string }
        dt:
          type: object
          description: >
            El DT del bloque A. Se manda `{nombre, desde}` (la fecha de asunción, el día 01 si
            solo se sabe el mes) o `{nombre, meses}`; un texto suelto vale como `nombre`. La
            antigüedad la calcula el backend: `meses` declarado manda; si no, de `desde` a la
            fecha del partido; si no, del DT de NUESTRA base cuando el apellido coincide; y si
            nada de eso, `meses: null` —NUNCA 0, que significa «recién llegado» y entra en A, F3
            y S1—. `nombre` vacío o desconocido se guarda como el canónico «sin establecer»;
            una oración (>60 caracteres o 7+ palabras) se rechaza: la fuente va en `notas.A`.
          properties:
            nombre: { type: string, description: 'el DT a secas; «sin establecer» si no se sabe' }
            desde: { type: string, description: 'YYYY-MM-DD, fecha de asunción' }
            meses: { type: number, nullable: true, description: 'antigüedad al día del partido; null = no se pudo establecer' }
            origenMeses: { type: string, enum: [declarado, desde, base, ''], description: 'de dónde salió `meses` (solo en la lectura)' }
            sinAntiguedad: { type: string, description: 'por qué `meses` quedó null (sin `desde` ni fecha de la base que sirva); no es un rechazo (1010)' }
            banco:
              type: object
              description: >
                Opcional, CON FUENTE: el banco de ese partido no es (o no fue) el DT —suspendido,
                ausente, o una alineación de la API que la prensa desmiente—. Con esto el lado no
                va a cuarentena automática por DT equivocado: si en el banco se sentó `nombre`, no
                hay discrepancia; si no, el caso viaja `disputado` con `bancoDeclarado`. Sin
                fuente (≥ 8 caracteres) o con otro motivo, se rechaza.
              properties:
                motivo: { type: string, enum: [suspendido, ausente, api_errada] }
                nombre: { type: string, description: 'quién se sienta en el banco (puede ir vacío)' }
                fuente: { type: string }
        perfil:
          type: object
          properties:
            sistema: { type: string }
            estilo: { type: string }
            fortaleza: { type: string }
            vulnerabilidad: { type: string }
        plantel:
          type: array
          description: 'los 14-16 jugadores relevantes (tabla F1), SIN estado'
          items: { $ref: '#/components/schemas/JugadorParte' }
        fuera:
          type: array
          description: >
            Lo que ya es público la noche anterior: lesiones largas, sanciones, selección.
            OJO: una baja que no esté también en `plantel` NO pesa en el Impacto Ponderado
            (no tiene rol con el que pesar). Ponla en `plantel`, o dale `zona` y `rol` aquí
            y el backend la incorpora a la tabla F1 marcada como `soloBaja`.
          items:
            type: object
            properties:
              nombre: { type: string }
              estado: { type: string, enum: [baja, duda, descanso], description: 'descanso = no convocado por descanso: va a F4, no pesa en el IP (rúbrica EFE v1.7)' }
              motivo: { type: string }
              zona: { type: string, description: 'necesario si no está en `plantel`' }
              rol: { type: string, description: 'necesario si no está en `plantel`' }
              jugadorId: { type: integer, description: 'opcional, el mismo de `plantel`: una baja con el id de una fila de la tabla no se incorpora dos veces' }
        factorX:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              contexto: { type: string }
        d3:
          type: string
          description: 'D3 del EFE (respuesta a rachas negativas): ✅ · 🔶 · ❌ · «sin dato» (también si · parcial · no, 1 · 0.5 · 0). Con él la app CALCULA la alerta COLAPSO-EN-CASCADA (D3 ❌ contra ✅/🔶, incidencia 162); sin él, lo lee de la nota del bloque D'
        sensibilidad:
          type: array
          description: 'caja de sensibilidad: qué cambiaría si el dato que falta fuera otro'
          items:
            type: object
            properties:
              supuesto: { type: string }
              efecto: { type: string }
    LecturaSadParte:
      type: object
      description: El juicio que cierra el EFE. No se puede calcular; por eso lo escribe Cowork.
      properties:
        moduloOperativo: { type: string }
        unXDos:
          type: object
          properties:
            texto: { type: string }
            rangoAmpliado: { type: boolean, description: '±10% por FACTOR-X' }
        contextoEmocional: { type: string }
        datoEstructural: { type: string }
        paradoja: { type: string, description: '"" si no hay paradoja' }
        reventon: { type: string, description: 'la LECTURA de Cowork del reventón de la burbuja (docs/REVENTON.md): una línea por equipo, qué racha no se recomienda seguir y por qué. Los números no se copian' }
        espina:
          type: object
          description: >
            La espina de la burbuja, por equipo (14/10/2026): adónde va su K total después de ESTE
            partido según la historia de sus burbujas (tope, forma, cómo se cortan): positiva
            (crece o arranca: gana), cero (se reinicia: empata), negativa (pierde) o neutra. Las K
            no mejoran el 1X2 en ninguna fórmula (docs/REVENTON.md §13.3-13.4): esto mide si sirven
            para la LECTURA. Entran también «crece» y «se reinicia»; otra lectura se rechaza.
          properties:
            a: { $ref: '#/components/schemas/EspinaLado' }
            b: { $ref: '#/components/schemas/EspinaLado' }
        golesAcotados:
          allOf: [{ $ref: '#/components/schemas/GolesAcotados' }]
          nullable: true
          readOnly: true
          description: 'solo en el GET: el intervalo de goles de cada lado y el marcador acotado, calculado al leer (REVENTON §17). Lectura del marcador, no señal de apuesta'
        reventonCalculado:
          type: object
          nullable: true
          readOnly: true
          description: 'solo en el GET: el reventón de cada lado con este partido como próximo, familia total (y en `condicion` la de local/visita de hoy), calculado al leer (docs/REVENTON.md). error si no se pudo calcular'
          properties:
            a: { $ref: '#/components/schemas/ReventonLado' }
            b: { $ref: '#/components/schemas/ReventonLado' }
    ReventonLado:
      type: object
      required: [actual, riesgo, rival, extremo, estabilidad, partidos, aviso]
      properties:
        actual: { type: object, nullable: true, description: 'la burbuja abierta (signo, k, partidos, kPico, desde, aplicaAlProximo)' }
        riesgo: { type: object, nullable: true, description: 'nivel, puntos, motivos, confianza, confianzaMotivos, movimiento (guía de adónde va la K)' }
        rival: { type: object, nullable: true, description: 'nivelProximo, medianaReventon, distancia, enZona, tramo' }
        extremo: { $ref: '#/components/schemas/ExtremoBurbuja', nullable: true, description: 'la alerta de extremo de la familia total; activa ⇒ el parte trae la alerta K-EXTREMO' }
        condicion:
          type: object
          description: 'la K de la condición en que juega hoy (local para a, visita para b): actual, riesgo, rival y extremo de esa familia. La que lee una espina con guia condicion; no dispara alertas (manda la total)'
          properties:
            familia: { type: string, enum: [local, visita] }
            actual: { type: object, nullable: true }
            riesgo: { type: object, nullable: true }
            rival: { type: object, nullable: true }
            extremo: { $ref: '#/components/schemas/ExtremoBurbuja', nullable: true }
            espinaTarjeta: { $ref: '#/components/schemas/EspinaTarjeta', nullable: true }
            sinTarjeta: { type: string, nullable: true, description: 'por qué la tarjeta de la condición es null' }
        espinaTarjeta: { $ref: '#/components/schemas/EspinaTarjeta', nullable: true }
        sinTarjeta: { type: string, nullable: true, description: 'por qué espinaTarjeta es null (K en 0, sin guía); null si hay tarjeta' }
        estabilidad: { type: string, enum: [estable, en transición, inestable, sin dato] }
        partidos: { type: integer }
        aviso: { type: string }
        otrasFamilias: { $ref: '#/components/schemas/OtrasFamilias' }
        error: { type: string }
    BloqueTde:
      type: object
      description: >
        El TDE de UN equipo. EL ÍNDICE ES UN NÚMERO Y EL NIVEL UNA ETIQUETA, en dos campos:
        `ie`/`ise` llevan el valor (es el «ieValor»: no hay otro campo numérico) y
        `ieNivel`/`iseNivel` la banda verde/ambar/rojo que pone el skill —el backend no pone
        umbrales a una escala que vive en otro lado, y sin nivel la pantalla pinta el número
        en neutro—. Un número en `ieNivel` se RECHAZA con su sitio (y, si `ie` venía vacío, se
        rescata ahí); una etiqueta fuera de las tres se rechaza y queda ''. `disciplina43: true`
        sin vías, indicadores ni índice se rechaza y queda false.
      properties:
        ie: { type: number, description: 'Índice de Echada (el valor numérico)' }
        ieNivel: { type: string, enum: [verde, ambar, rojo, ''], description: 'la etiqueta, nunca el número' }
        ise: { type: number, description: 'Índice de Sobreexposición (el valor numérico)' }
        iseNivel: { type: string, enum: [verde, ambar, rojo, ''], description: 'la etiqueta, nunca el número' }
        equipo: { type: string, enum: [a, b, ''], description: 'de quién se estima' }
        tipologia: { type: string, description: 'la causa modal entre las seis tipologías' }
        ventana: { type: string, description: "la ventana de 15 minutos, ej. \"75-90'\"" }
        disciplina43: { type: boolean, description: 'true = se declaran las dos vías por separado' }
        notas: { type: string, description: 'la prosa del bloque (se guarda y vuelve en el GET; una clave que el bloque no guarda vuelve en `rechazos` con su nombre)' }
        sinDato: { type: object, additionalProperties: { type: string }, description: 'indicadores excluidos por falta de dato, {indicador: motivo}; llega como lista o como objeto (`excluidos` también se acepta) y vuelve como objeto' }
        regimen: { description: 'disciplina 45 del TDE: en configuración dual, el régimen (texto o {inicio, duracion, nota}) además de la ventana. El eco del GET (calculado, declarado, discrepancia, heredadoDtp) se ignora en silencio' }
        vias:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              indice: { type: number }
              ventana: { type: string }
              detalle: { type: string }
        falsador: { type: string }
        reasignacion:
          type: object
          description: >
            Disciplina 44 como CAMPO (obligatoria en PRE): qué le pasa a las vías de ESTE
            equipo si marca primero y si recibe primero. Una rama suelta como texto se
            guarda como `nota`; un `sob1` fuera de 0/0.5/1 o una rama desconocida se
            rechazan con motivo. Sin las dos ramas, el recibo lo avisa en `faltan`
            (`tde.reasignacion`) y el veredicto dice qué rama jugó el partido.
          properties:
            siMarcaPrimero: { $ref: '#/components/schemas/RamaReasignacion' }
            siRecibePrimero: { $ref: '#/components/schemas/RamaReasignacion' }
            siLeEmpatan: { $ref: '#/components/schemas/RamaReasignacion', description: 'TDE v0.1.21 (44a), opcional: si el que marcó primero recibe el empate antes del 75 —la rama de ventaja caduca—, qué vía reabre y desde qué minuto' }
            siExpulsion: { description: 'TDE v0.1.21 (44d, disciplina 16 desdoblada): roja yendo empatado o ganando → ECHADA-NUM e ISE anulado; yendo perdiendo → ISE agravado. v0.1.23: {propia: RamaReasignacion, rival: RamaReasignacion} — la roja del rival con su línea (se guarda como siExpulsionRival); la forma plana es la propia. El recibo la pide junto con siLeEmpatan' }
            siIguala: { $ref: '#/components/schemas/RamaReasignacion', description: 'TDE v0.1.23: el que iba abajo empata; por defecto sigue empujando en SOB, ventana desde el empate +15' }
            siExpulsionRival: { $ref: '#/components/schemas/RamaReasignacion', description: 'TDE v0.1.23: lo que llega en siExpulsion.rival' }
        calculado:
          type: object
          description: 'el índice CALCULADO con sus compuertas (solo en la respuesta). Sin ningún indicador S el IE sale PARCIAL sobre F, C y P (divisor 7.0) con `sinS: true` y `notaSinS` (decisión del 21/10/2026); sin F, C o P sigue sin calcularse (`sinDato`)'
          additionalProperties: true
        declarado:
          type: object
          description: 'el ie/ise que llegó escrito, para poder contrastarlo'
          additionalProperties: true
        discrepancia:
          type: array
          description: 'diferencias entre lo declarado y la cuenta; vacío es lo normal'
          items: { type: string }
        heredadoDtp:
          type: array
          description: 'C1 (clase del bloque de ESTE equipo, que calculó el checklist del bloque DTP con foco en el rival: el DTP de A da el C1 de B y viceversa; ambiguo no hereda) y SOB2 (rest defense) HEREDADOS del DTP: mandan sobre lo declarado —el skill prohíbe re-estimarlos— y el índice se calcula con ellos; si difieren, alerta HERENCIA-DTP'
          items:
            type: object
            properties:
              indicador: { type: string }
              valor: { type: number, nullable: true }
              declarado: { type: number, nullable: true }
              de: { type: string }
              discrepa: { type: boolean }
              noHeredado: { type: boolean, description: 'el DTP clasificó el bloque como ambiguo: C1 NO se hereda y queda lo declarado (valor = declarado)' }
    DtpParte:
      type: object
      description: >
        El Diagnóstico Táctico de Partido (skill `diagnostico-tactico` v1.2) estructurado, UN
        bloque por equipo foco. Cowork responde las 6 preguntas del checklist del bloque rival
        (`p1`-`p5`: `improvisado` | `estructural` | `sin dato`; `p6`: `no` | `si` + `casoP6`);
        la clase la calcula el backend: 3+ improvisado → improvisado (55-65'); 3+ estructural →
        estructural (80-90') si la p6 es sí CON caso nombrado, si no `estructural no probado`
        (alerta de degradación sin suprimir, `c1Tde` 0.5); sin 3 de un lado → ambiguo. La
        apertura entra a `cadena_dtp` (antes del pitazo, sin pisar la primera) para que el
        próximo parte la cierre.
      properties:
        bloques:
          type: array
          items:
            type: object
            required: [equipo]
            properties:
              equipo: { type: string, enum: [a, b] }
              apertura:
                type: object
                properties:
                  m1: { type: object, additionalProperties: true, description: 'sistema, xiReferencia (DTP v1.5: obligatorio, lista de 11 —texto con comas o array de nombres, que se guarda unido por comas—; vacío o en prosa → rechazo con motivo al depositar), senalXi, rolesReasignados[], vulnerabilidad, formaSinBalon, minutosCompartidos' }
                  m2: { type: object, additionalProperties: true, description: 'choqueSistemas, duelosCarril[{carril, duelo, mismatch, vuelta (DTP v1.4: lo que expone ese carril si pierde la pelota), condicional (bool: duelo con nombre propio que depende del once)}], checklistBloqueRival{p1..p5: improvisado|estructural|sin dato, p6: si|no|sin dato, casoP6, notas — se guardan y vuelven como izq/der/sin dato, que también se aceptan; otro valor se guarda «sin dato» con rechazo. Este checklist mira el bloque del RIVAL del foco: fija el C1 del TDE del rival, no el del foco}, viasGol{foco[], rival[]}, restDefense{foco, rival, nivelFoco, nivelRival: fijo|depende|sin → SOB2 0|0.5|1 del TDE; v1.5: nivelFocoPersiguiendo, nivelRivalPersiguiendo (no se heredan al TDE hasta que el usuario decida)}, posesion{valor, contraQuien, marcador, sede; v1.5: igualadoOArriba{…} y persiguiendo{…} con la misma forma}, piezas (v1.5)[{nombre, lado: foco|rival, rol}: de quién depende la capa de nombres; una pieza que arranca en el banco → DTP-REHACER], veredicto (FAVORABLE|NEUTRO|DESFAVORABLE), razon; v1.6: veredictoRamas{igualadoOArriba{veredicto, razon}, persiguiendo{veredicto, razon}} — un veredicto por rama del estado de marcador; el de arriba queda como el de la rama más probable y el veredicto del partido lee el de la rama jugada (objetivo.dtp)' }
                  m3Fases: { type: array, items: { type: object, additionalProperties: true }, description: 'tramo 0-25 | 25-65 | 65-80+, plan, palancas[]' }
                  m6: { type: object, additionalProperties: true, description: 'competitivo, rotacion, fatiga, ausencias, otros' }
              cierre:
                type: object
                properties:
                  sinAnterior: { type: boolean }
                  m4Goles: { type: array, items: { type: object, additionalProperties: true }, description: 'gol, minuto, via (pelota_parada|transicion|juego_abierto), disparador, secuencia, definicion, responsablesMerito[], responsablesError[{jugador, nivel principal|secundario|estructural, detalle}], absolucion' }
                  m5: { type: object, additionalProperties: true, description: 'planFuncionoHastaMin, peligroReal, cronologiaGiro, contraste{aciertos[], fallos[]}, preguntaChecklistFallida' }
                  mecanismoAbierto: { type: object, additionalProperties: true, description: 'activo, mecanismo, lineaRepite, correccionEnVivo, sinMecanica (DTP v1.4: la frecuencia se cumplió y ninguna fuente nombra la jugada → vía a verificar, nivel C, no degrada K), regimen (v1.5: cualquiera|persiguiendo)' }
                  casoBloque: { type: object, nullable: true, additionalProperties: true, description: 'DTP v1.4: el caso de la pregunta 6 del bloque PROPIO del foco en el partido que se cierra —sostuvo (bool|null), caso, conUnoMenos; v1.5: conUnoMas (con uno más no prueba), tipo (ventaja|empate_que_sirve|cero_cero), sostuvoArquero (bool|null), linea; v1.6: sede (local|visita|neutral) y competicion —si no vienen, la app las toma del partido que se cierra y las marca `sedeCalculada`—. Vuelve en `casosBloque` de los insumos del DTP del rival siguiente' }
              calculado:
                type: object
                description: 'SOLO en la lectura; se ignora si llega'
                properties:
                  bloqueRival:
                    type: object
                    properties:
                      clase: { type: string, enum: ['', improvisado, estructural, 'estructural no probado', ambiguo] }
                      vidaUtilMin: { type: string }
                      alertaDegradacion: { type: boolean, nullable: true }
                      c1Tde: { type: number, nullable: true, description: 'C1 del TDE del equipo del bloque: 0 estructural probado · 0.5 no probado · 1 improvisado' }
                      equipoDelBloque: { type: string, enum: [a, b] }
                      motivo: { type: string }
                      conteo: { type: object, additionalProperties: { type: integer } }
                      respuestas: { type: object, additionalProperties: { type: string } }
                  contraElOnce:
                    type: object
                    description: >
                      Solo cuando la ficha ya trae el once oficial del equipo foco (sin once, la
                      clave no viaja: no es «cuadra»). `rehacer` si el sistema declarado en M1
                      tiene otras cifras que la formación oficial, o si ≥ 3 titulares oficiales
                      no figuran en `xiReferencia` (por apellido). Va también a la tira como
                      `DTP-REHACER` (tipo dato). También rehace si el seguro de atrás
                      (`m2.restDefense.foco`) nombra a un jugador que arrancó en el banco. Con
                      el grid completo, los defensores son la fila 2. Sin XI de referencia, o
                      con uno que mezcla proyecciones, va `DTP-SIN-REFERENCIA` (tipo dato).
                      No reescribe la apertura.
                    properties:
                      rehacer: { type: boolean }
                      motivos: { type: array, items: { type: string } }
                      sinReferencia: { type: boolean }
                      referenciaMezclada: { type: boolean, description: 'el xiReferencia cita varias fuentes o proyecciones: no es un XI' }
                      sistemaDeclarado: { type: string }
                      sistemaOficial: { type: string }
                      defensoresOficiales: { type: integer, nullable: true }
                      ausentesDeLaReferencia: { type: array, items: { type: string } }
                      rolesVsGrid:
                        type: array
                        description: >
                          EN SOMBRA (incidencia 646, 29/10/2026): el rol que `m1.rolesReasignados`
                          le da a un titular contra su casilla del grid oficial (la línea, y la
                          banda de un lateral, carrilero o central). No pide rehacer hasta que
                          los veredictos digan cuántas son reales; vacío sin grid completo.
                        items:
                          type: object
                          properties:
                            jugador: { type: string }
                            rol: { type: string, description: 'la línea de rolesReasignados' }
                            grid: { type: string }
                            motivo: { type: string }
    Incidencia:
      type: object
      properties:
        id: { type: integer }
        origen: { type: string }
        corrida: { type: string }
        fixtureId: { type: integer, nullable: true }
        area: { type: string }
        severidad: { type: string, enum: [bloquea, error, aviso] }
        titulo: { type: string }
        detalle: { type: string }
        estado: { type: string }
        resolucion: { type: string }
        pr: { type: string }
        veces: { type: integer, description: 'cuántas veces se reportó la MISMA CAUSA (área + título sin paréntesis ni lo que sigue a «:»)' }
        fixtures: { type: array, items: { type: integer }, description: 'los partidos donde se vio esa causa (hasta 50)' }
        creadoEn: { type: string }
        ultimaVez: { type: string }
        cerradoEn: { type: string, nullable: true }
        conocida: { $ref: '#/components/schemas/IncidenciaConocida' }
    IncidenciaConocida:
      type: object
      nullable: true
      description: 'la última cerrada de la misma familia de causa (27/10/2026): si la nueva no trae nada distinto, se cierra remitiendo a ella'
      properties:
        id: { type: integer }
        estado: { type: string }
        titulo: { type: string }
        resolucion: { type: string }
        pr: { type: string }
        cerradoEn: { type: string, nullable: true }
    DerrotasFavoritoDTO:
      type: object
      properties:
        generadoEn: { type: string }
        cohorte: { type: string }
        resumen: { type: object, properties: { rama_escrita: { type: integer }, rama_sin_escribir: { type: integer }, sin_ficha: { type: integer }, sin_goles: { type: integer } } }
        nota: { type: string }
        derrotas:
          type: array
          items:
            type: object
            properties:
              fixtureId: { type: integer }
              fecha: { type: string }
              partido: { type: string }
              favorito: { type: object, properties: { lado: { type: string, enum: [a, b] }, equipo: { type: string }, probabilidad: { type: number, nullable: true } } }
              marcador: { type: string }
              goles: { type: array, items: { type: object, additionalProperties: true } }
              seleccion: { type: string }
              cuarentena: { type: boolean }
              explicacion: { type: string, enum: [rama_escrita, rama_sin_escribir, sin_ficha, sin_goles] }
              tde: { type: object, additionalProperties: true, description: 'ramaJugada, minuto, loDeclarado, segundoGiro, salida (concedio|marco|sinMasGoles|otra_via: v0.1.23, penal o autogol), tipologia, ventana, golEnVentana, anadido (v0.1.23: {concedidos[], marcados[], rojas[{minuto, propia}], cambioElTramo})' }
              tdeRival: { type: object, additionalProperties: true, description: 'ramaJugada, loDeclarado' }
              dtpViasRival: { type: array, items: { type: string }, description: 'las vías de gol del rival que había escrito el DTP del favorito' }
              leccion: { type: string }
    RamaReasignacion:
      type: object
      properties:
        sob1: { type: number, nullable: true, enum: [0, 0.5, 1, null], description: 'el valor que tomaría SOB1 en esa rama' }
        sob2: { type: number, enum: [0, 0.5, 1], description: 'TDE v0.1.22: el seguro de atrás CUANDO se juega esta rama (no se hereda el del arranque); obligatorio en siRecibePrimero/siLeEmpatan con sob1 ≥ 0.5 (si falta, `faltan`)' }
        sob3: { type: number, enum: [0, 0.5, 1], description: 'TDE v0.1.22: SOB3 en esta rama, si cambia; si no viene se usa el del bloque' }
        iseRama: { type: number, description: 'CALCULADO: (SOB1+SOB2+SOB3)/3×10 de la rama (la misma fórmula del ISE). Solo con sob1 y sob2' }
        iseRamaHeredados: { type: array, items: { type: string }, description: 'qué SOB de la cuenta salió del bloque y no de la rama (hoy, solo SOB3)' }
        tipologia: { type: string, description: 'el tipo modal en esa rama, si cambia' }
        nota: { type: string }
        ventana: { type: string, description: "la ventana de 15' de esta rama, si cambia (minutos de reloj): el veredicto mide la de la rama que jugó el partido" }
        desenlace: { type: string, enum: [se_rompe, rescata, abierto], description: 'TDE v0.1.24 (disciplina 65), solo en siRecibePrimero, siLeEmpatan y siIguala: cómo termina el régimen del que persigue —se_rompe (concede otro antes de igualar), rescata (iguala o vuelve a ponerse adelante), abierto—. En otra rama o fuera de la lista se rechaza con motivo; sin él, con sob1 ≥ 0.5, el recibo lo pide en `faltan`' }
        porqueDesenlace: { type: string, description: 'el hecho que sostiene «rescata» con ISE de rama ≥ 7 (rival que no administra, banco ofensivo documentado, roja rival); sin él, `faltan`' }
        desenlaceDefecto: { type: string, enum: [se_rompe, abierto], description: 'CALCULADO: la lectura por defecto del ISE de rama (≥ 7 → se_rompe; si no, abierto)' }
    TdeParte:
      type: object
      description: >
        Teorema del Echado del partido. El índice es POR EQUIPO, así que el parte guarda
        una LISTA: hasta un bloque por lado. Antes guardaba uno solo y el del otro equipo
        terminaba en `notas` —prosa que no se puede consultar ni medir—.
      properties:
        bloques:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/BloqueTde' }
    TdeEntrada:
      description: >
        Al depositar se aceptan cuatro formas y todas se guardan igual, en `bloques`:
        la canónica `{"bloques": [...]}` (que es lo que devuelve el GET, para poder
        re-depositar la respuesta tal cual), un objeto plano con `equipo` adentro,
        `{"a": {...}, "b": {...}}` como los equipos, y una lista de bloques. Dos bloques
        para el mismo lado se rechazan: no se elige uno en silencio.
      oneOf:
        - $ref: '#/components/schemas/TdeParte'
        - $ref: '#/components/schemas/BloqueTde'
        - type: object
          properties:
            a: { $ref: '#/components/schemas/BloqueTde' }
            b: { $ref: '#/components/schemas/BloqueTde' }
        - type: array
          items: { $ref: '#/components/schemas/BloqueTde' }
    EventoTimelineParte:
      type: object
      description: >
        Evento INSTITUCIONAL del timeline. Los partidos NO entran por aquí: el marcador,
        la jornada y el enfrentamiento directo los calcula backend/cronologia.py de
        nuestra base, y un evento de tipo resultado/derrota/empate se descarta al normalizar.
      required: [fecha, titulo, tipo]
      properties:
        fecha: { type: string, description: 'YYYY-MM-DD, o ~YYYY-MM si es aproximada' }
        aproximada: { type: boolean }
        equipo: { type: string, description: 'nombre del equipo, o "ambos"' }
        tipo: { type: string, enum: [institucional, tecnico, sancion, hito] }
        titulo: { type: string }
        detalle: { type: string }
        destacado: { type: boolean }
        alertaRelacionada: { type: string }
        fuente: { type: string }
    ParteCoworkEntrada:
      type: object
      required: [fixtureId, equipos]
      properties:
        fixtureId: { type: integer, description: 'de /analisis/cowork/agenda' }
        version: { type: string, default: cowork/1 }
        generadoEn: { type: string }
        equipos:
          type: object
          properties:
            a: { $ref: '#/components/schemas/EquipoParteEntrada' }
            b: { $ref: '#/components/schemas/EquipoParteEntrada' }
        alertas:
          type: array
          items: { $ref: '#/components/schemas/AlertaParte' }
        matchup:
          type: object
          properties:
            diagnostico: { type: string, enum: [FAVORABLE, NEUTRO, DESFAVORABLE] }
            favorece: { type: string, enum: [a, b, ''] }
            razon: { type: string }
            h2a: { type: string, enum: [verde, ambar, rojo, na] }
            h2b: { type: string, enum: [verde, ambar, rojo, na] }
            h2c: { type: string, enum: [verde, ambar, rojo, na] }
        lecturaSad: { $ref: '#/components/schemas/LecturaSadParte' }
        tde: { $ref: '#/components/schemas/TdeEntrada' }
        dtp: { $ref: '#/components/schemas/DtpParte' }
        timelineEventos:
          type: array
          description: 'solo lo institucional; los partidos los pone el backend'
          items: { $ref: '#/components/schemas/EventoTimelineParte' }
        timelineNarrativa: { type: string }
        cadena:
          type: object
          description: >
            El pronóstico clave por equipo foco. Entra en cadena_dtp (la película del
            equipo, página de Equipo) como APERTURA: el veredicto lo emite después quien
            cierre el eslabón, que es lo que lo hace auditable.
          properties:
            a: { type: object, properties: { pronostico: { type: string } } }
            b: { type: object, properties: { pronostico: { type: string } } }
        pronostico: { $ref: '#/components/schemas/PronosticoParte' }
        documentos:
          type: array
          description: 'UN documento por id (24/10/2026): sin `id` se rechaza con motivo (antes se guardaba como «nota»); dos con el mismo id dejan el ÚLTIMO y el recibo lo avisa'
          items: { $ref: '#/components/schemas/DocumentoParte' }
        pendientes: { type: array, items: { type: string } }
        fuentes: { type: array, items: { type: string } }
        descartados: { type: array, items: { type: string } }
        notas: { type: string }
        entrada:
          type: object
          description: >
            El eco que devuelve el GET, aceptado TAL CUAL. Corregir un parte es leer →
            modificar → re-depositar, así que el cuerpo del POST puede ser la respuesta
            del GET sin desarmar: `entrada` se desempaqueta aquí dentro y lo que venga
            suelto en la raíz manda sobre lo que traiga este bloque. Lo calculado que
            también vuelve en la lectura (partido, estado, equipos[].total, timeline,
            veredicto, xi…) se ignora en silencio: no es un campo desconocido, es
            nuestra propia respuesta.
          properties:
            timelineEventos:
              type: array
              items: { $ref: '#/components/schemas/EventoTimelineParte' }
            timelineNarrativa: { type: string }
            cadena: { type: object, additionalProperties: true }
            descartados: { type: array, items: { type: string } }
    AlertaParte:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string, description: 'T.54, R-KT.2, GK-DOWNGRADE, F3… Las que agrega el backend al leer: K-EXTREMO (burbuja en su máximo), K-CERCA-EXTREMO (franja alta sin récord, tipo dato), K-EXTREMO-CONDICION y K-CERCA-EXTREMO-CONDICION (la K de la condición de hoy en su récord o en la franja alta, con la total sin él; tipo dato), ESPINA-VS-RIESGO (la espina declarada contra el riesgo calculado del reventón), DT-DISCREPANCIA (el DT del parte no es el de la base: la prensa manda, la base es alarma) y DT-SIN-DT (el parte o la base sin DT), TIPOLOGIA-VS-INDICES (la tipología modal del TDE contradice IE contra ISE), ELIMINATORIA-AL-REVES (29/10/2026: el parte da por eliminado al que pasó la llave, o al revés; la base lo calcula en backend/eliminatoria.py), HERENCIA-DTP (C1/SOB2 del TDE declarados distinto de lo que dice el DTP; manda el DTP), HUECO-DOBLE (EFE y TDE leídos del mismo vacío) ESCALA-LIGAS (los dos equipos vienen de ligas distintas: el nivel no compara entre bases), F1-DECISIVO-FUERA (un titular habitual o goleador de la base que no está en la tabla F1: no pesa en el IP) DTP-REHACER (el once oficial contradice el sistema o el XI de referencia de la apertura del DTP), EFE-EMPATE-TECNICO (26/10/2026: brecha del EFE ≥ 5 puntos con T.54 / R-KT.2 en un lado o ESCALA-LIGAS: empate técnico de formación, no ordena el partido; trae `brecha` y `motivos`), ESPINA-SIGUE-EN-EXTREMO (la espina dice que la racha sigue con la burbuja total o de la condición en K-EXTREMO o K-CERCA-EXTREMO) T.54-SIN-DECLARAR (EFE v1.8: el DT de un lado lleva menos de 6 meses y el parte no declara T.54 ni T.54-B ahí; trae `meses` y cuenta para EFE-EMPATE-TECNICO) SANCION-SIN-DECLARAR (30/10/2026: un sancionado de la base —roja o amarillas en el último partido de la competición— que el parte no tiene en `fuera`; trae `sancionados`) ONCE-SIN-FILA-F1 (incidencia 743: titulares del once oficial sin fila en la tabla F1, que no pesan en el IP; trae `titulares`) y TDE-RELEVANCIA-SIN-DECLARAR (01/11/2026, incidencia 791: P1a y SOB1 en 0,5 o menos en los dos lados y ningún texto del TDE declara la relevancia baja; tipo dato, no se cobra a partes anteriores). Las CAPTURADAS al depositar por el guardrail de coherencia (Jev, docs/JEV.md): COHERENCIA-BLOQUE, COHERENCIA-1X2, COHERENCIA-MATCHUP, COHERENCIA-REVENTON — solo salen en la tira con SAD_JEV_COHERENCIA=alertas; en sombra viven en `coherencia`' }
        equipo: { type: string, enum: [a, b, ambos, global] }
        tipo: { type: string, enum: [estructural, fecha, dato], description: '`dato` = la pone el backend sobre los datos, no el skill' }
        detalle: { type: string, description: '`texto` se acepta como alias' }
        origen: { type: string, enum: [jev], description: 'solo en COHERENCIA-*: la puso Jev al depositar; no se recalcula al leer' }
        posteriorAlParte: { type: boolean, description: 'solo en ESPINA-SIGUE-EN-EXTREMO y EFE-EMPATE-TECNICO (27/10/2026): la regla nació el 26/10, después de que se creó este parte; se muestra, pero el veredicto no la cobra como incumplida' }
        modelo: { type: string, description: 'solo en COHERENCIA-*: la versión exacta que respondió (jev-1.13.0)' }
        evaluadoEn: { type: string, description: 'solo en COHERENCIA-*: cuándo se evaluó (al depositar)' }
        momento:
          type: string
          enum: [tardio, sinRehacer, conocido]
          description: 'solo en DTP-REHACER, ya jugado el partido (26/10/2026): cuándo llegó el once que la dispara. `tardio` = la versión final llegó a menos de 15 min del pitazo, después del último rehacer posible (apertura caída por un once tardío, no un aviso ignorado) · `sinRehacer` = llegó a tiempo y el parte no se volvió a depositar (falla de la corrida de rehacer) · `conocido` = ya estaba en el último depósito previo y la apertura igual lo contradice. La versión final es la última capturada HASTA el pitazo (un refresco en juego o al terminar no cuenta). Sin versiones del once hasta el pitazo o sin depósito previo sellado (partes anteriores) no viaja'
        onceFinalEn: { type: string, nullable: true, description: 'solo con `momento`: cuándo se capturó la versión final del once (UTC); null si ninguna versión llegó antes del pitazo (847)' }
        ultimoDepositoPrevio: { type: string, description: 'solo con `momento`: el último depósito del parte ANTES del pitazo (UTC)' }
        jev:
          type: object
          nullable: true
          description: 'solo en COHERENCIA-*: la pregunta, la etiqueta que eligió y su confianza'
          properties:
            pregunta: { type: string }
            valor: {}
            confianza: { type: number }
        ligas:
          type: object
          nullable: true
          description: 'solo en ESCALA-LIGAS: la liga doméstica de cada lado (la más frecuente en su último año, fuera de internacionales y amistosos)'
          properties:
            a: { $ref: '#/components/schemas/LigaDomestica' }
            b: { $ref: '#/components/schemas/LigaDomestica' }
