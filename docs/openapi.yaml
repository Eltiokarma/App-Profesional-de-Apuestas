openapi: 3.0.3
info:
  title: SAD API
  version: 0.1.0
  description: >
    Contrato entre el backend SAD (FastAPI + PostgreSQL, monolito modular con el
    paquete motor_sad) y los clientes (web SAD, UI PyQt). Espeja el pipeline
    sad → levels → constants → discreto documentado en MOTOR_SAD_EXTRACCION.md.
    El frontend web consume estos endpoints vía src/api/ cuando
    VITE_DATA_SOURCE=http.
servers:
  - url: http://localhost:8000/api/v1
    description: desarrollo local
  - url: https://api.CAMBIAR-DOMINIO.com/api/v1
    description: producción
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Estado del servicio, la DB y el último ciclo del pipeline
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /fixtures:
    get:
      summary: Lista de fixtures (filtrable por fecha, estado, liga, temporada, equipo y rival H2H)
      parameters:
        - { name: fecha, in: query, schema: { type: string, format: date } }
        - { name: desde, in: query, schema: { type: string, format: date, description: 'solo fixtures con fecha >= desde' } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoFixture' } }
        - { name: orden, in: query, schema: { type: string, enum: [asc, desc], default: desc, description: 'orden por fecha' } }
        - { name: ligaId, in: query, schema: { type: integer } }
        - { name: temporada, in: query, schema: { type: integer, description: 'solo fixtures de esta temporada de la liga' } }
        - { name: equipoId, in: query, schema: { type: integer, description: 'solo partidos de este equipo' } }
        - { name: rivalId, in: query, schema: { type: integer, description: 'con equipoId: solo enfrentamientos directos entre ambos (H2H); requiere equipoId' } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500, description: 'tope 500: un día con amistosos globales supera los 200 partidos' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Fixture' } }
  /fixtures/{id}:
    get:
      summary: Un fixture por id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fixture' }
        '404': { description: No existe }
  /fixtures/{id}/live:
    get:
      summary: Estado en vivo real del fixture (marcador, minuto, cuotas en juego)
      description: >
        Alimentado por la ingesta en vivo (SAD_LIVE_SEGUNDOS). `cuotas` es la
        última captura de odds en juego y `serie` el movimiento acumulado del
        partido (solo selecciones no suspendidas). Ambas vacías si la liga no
        tiene cobertura de odds live o la ingesta en vivo está apagada; el
        marcador/minuto salen de la tabla fixtures, refrescada por el mismo ciclo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixtureLive' }
        '404': { description: No existe }
  /fixtures/{id}/vip:
    post:
      summary: Marca/desmarca el partido como VIP ("este sí o sí, aunque cueste")
      description: >
        La marca vive en .vip_fixtures.json de la raíz de datos (no en las .db)
        y la lee el ciclo en vivo. Con plan sano, el VIP entra al rescate por
        fixture aunque su liga sea menor; con el plan y el respaldo agotados,
        el modo emergencia (SAD_EMERGENCIA_KEY, la clave que puede facturar
        excedente) le mantiene marcador y cuotas dentro de SAD_EMERGENCIA_TOPE.
        Caduca sola a las 8 h.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [fixtureId, vip]
                properties:
                  fixtureId: { type: integer }
                  vip: { type: boolean }
        '404': { description: No existe }
  /ligas/{ligaId}/refrescar:
    post:
      summary: Refresco forzado del marcador de una liga (el botón ⟳ de Partidos)
      description: >
        Escribe el pedido en .refresco_ligas.json (la raíz de datos, no las .db)
        y el próximo ciclo en vivo actualiza estado/marcador/minuto de todos los
        partidos en ventana de esa liga por /fixtures?ids= — presupuesto normal
        si queda, clave de emergencia si el plan está muerto. Solo marcador; las
        cuotas siguen sus reglas (VIP para pagarlas). Se consume al atenderse y
        caduca a los 15 min.
      parameters:
        - { name: ligaId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ligaId, pedido, fixtures]
                properties:
                  ligaId: { type: integer }
                  pedido: { type: boolean }
                  fixtures: { type: integer, description: 'partidos sin resultado que el ciclo va a refrescar (0 = nada que refrescar; -1 = no se pudo calcular)' }
        '404': { description: Liga sin fixtures en la base }
  /niveles/{equipoId}:
    get:
      summary: Historia de niveles del equipo (desc por fecha)
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: antesDe, in: query, schema: { type: integer }, description: 'id de fixture: solo lo ESTRICTAMENTE anterior a ese partido (vista «al día del partido», docs/REVENTON.md §9). 404 si no existe' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Nivel' } }
  /constantes/{equipoId}:
    get:
      summary: Historia de constantes K del equipo (desc por fecha)
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: antesDe, in: query, schema: { type: integer }, description: 'id de fixture: solo lo ESTRICTAMENTE anterior a ese partido (vista «al día del partido», docs/REVENTON.md §9). 404 si no existe' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Constantes' } }
  /constantes-cuota/{equipoId}:
    get:
      summary: 'k_cuota (§3.8): rachas de suma de cuota prepartido 1X2 y doble oportunidad, solo 2026 (asc por fecha)'
      description: Vacío si aún no se construyó constants_cuota (correr backend/backfill_cuota).
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConstanteCuota' } }
  /predicciones/{fixtureId}:
    get:
      summary: Ley de la Regresión al Nivel (gap) para un fixture
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prediccion' }
  /analisis-prepartido/{fixtureId}:
    get:
      summary: Reporte integral pre-partido (niveles + K + gap + resumen)
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalisisPrepartido' }
  /equipos:
    get:
      summary: Búsqueda inteligente de equipos (sin tildes, ranking por prefijo)
      parameters:
        - { name: buscar, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 60 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 25 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Equipo' } }
  /equipos/{equipoId}/stats:
    get:
      summary: Stats de temporada calculadas de los fixtures terminados
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipoStats' }
        '404': { description: No existe }
  /equipos/{equipoId}/plantilla:
    get:
      summary: Plantilla con indicadores de jugadores (docs/JUGADORES.md)
      description: >
        Indicadores calculados en lectura de las tablas de jugadores de sad.db
        (ingesta backend.ingesta.jugadores): por-90 con encogimiento bayesiano
        hacia la media de la posición, grado de confianza por minutos (A/B/C),
        dependencia ofensiva HHI, bajas, recién llegados y DT. Sin ingesta de
        jugadores para el equipo, `jugadores: []` — nada se inventa.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plantilla' }
        '404': { description: No existe }
  /equipos/{equipoId}/calendario:
    get:
      summary: Calendario SAD — próximos partidos con el mapa de rivales (bloque G del EFE)
      description: >
        Las etiquetas contextuales del rival (RECIÉN ASCENDIDO, EN CRISIS,
        LOCAL FUERTE, VISITA DÉBIL, EQUIPO SORPRESA, BLOQUE BAJO, CLÁSICO)
        calculadas de sad.db con el criterio numérico del protocolo, cada una
        con el dato que la sostiene. 0 requests y 0 tokens: es el mismo bloque
        que antes deducía el modelo. `[]` si no hay fixtures programados.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: n, in: query, schema: { type: integer, default: 4, minimum: 1, maximum: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PartidoCalendario' } }
        '404': { description: No existe el equipo }
  /equipos/{equipoId}/burbujas:
    get:
      summary: Reventón de la burbuja — cuándo la K del equipo suele volver a cero (guía calculada, no probabilidad)
      description: >
        Por familia (total · local · visita): las burbujas cerradas de la K de
        resultado con la K pico, los partidos que duró y el rival que la reventó;
        media, mediana y moda de esas tres cosas por signo; la burbuja abierta
        hoy comparada con ellas (percentiles) y el próximo rival frente al nivel
        con el que suele reventar; qué constantes mandan según el nivel del
        equipo (alto o bajo → globales, medio → la de la condición); estabilidad
        (DT, ventana, bajas) como CONFIANZA de la guía, con lo que no está en la
        base declarado en `sinDato`. Riesgo por puntos, cada punto con su motivo.
        0 requests y 0 tokens (docs/REVENTON.md). Las K de goles quedan fuera a
        propósito por ahora.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: antesDe, in: query, schema: { type: integer }, description: 'id de fixture: la historia se corta ESTRICTAMENTE antes de ese partido y ese partido hace de próximo (rival, condición, nivel del rival a esa fecha); la plantilla de hoy no se usa (estabilidad sin dato). La misma construcción anti-hindsight del backtest. 404 si no existe, 400 si el equipo no lo juega' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BurbujasEquipo' }
        '404': { description: No existe el equipo }
  /analisis/burbujas/backtest:
    get:
      summary: Backtest hacia atrás del reventón de burbuja sobre las .db del servidor (token maestro)
      description: >
        Recorre la historia de cada equipo y, en cada partido con burbuja abierta,
        rehace la guía solo con las filas anteriores (el rival real como próximo,
        sin fuga) y la compara con lo que pasó dentro de `horizonte` partidos de la
        condición. Devuelve la tasa de reventón por nivel de riesgo y por puntos
        (con AUC), el lift de cada señal, la separación por familia y por «manda»,
        la regla del nivel y el desglose por liga. `padron=true` = solo las ligas
        importantes (padrón único de las cuotas en vivo). No abierto a Cowork:
        es calibración, no un dato del parte (docs/REVENTON.md §8).
      parameters:
        - { name: padron, in: query, schema: { type: boolean, default: true } }
        - { name: horizonte, in: query, schema: { type: integer, default: 1, minimum: 1, maximum: 5 } }
        - { name: muestra, in: query, schema: { type: integer, default: 0, minimum: 0, maximum: 2000 }, description: 'equipos al azar (0 = todos)' }
        - { name: liga, in: query, schema: { type: integer }, description: 'solo partidos de esta league_id (manda sobre padron)' }
        - { name: minFilas, in: query, schema: { type: integer, default: 12, minimum: 10, maximum: 200 } }
        - { name: calibrar, in: query, schema: { type: boolean, default: false }, description: 'añade `calibracion`: regresión logística sobre las señales (rival graduado por distancia), coeficientes, puntos propuestos, tasa por puntos y cortes propuestos. Ajuste en muestra.' }
      responses:
        '200':
          description: Resumen del backtest (tablas por nivel, puntos, señal, familia, liga; ligasEvaluadas y equipos; calibracion si se pidió)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /fixtures/{fixtureId}/ficha:
    get:
      summary: Ficha de partido — plantillas + congestión de ambos equipos
      description: >
        El puente con los skills (EFE/DTP/timeline): JSON determinista con la
        plantilla de indicadores de local y visitante más la congestión de
        calendario (días de descanso, partidos en 21 días) calculada de los
        fixtures ya capturados (0 requests).
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaPartido' }
        '404': { description: No existe }
  /ligas/{ligaId}:
    get:
      summary: Metadatos de una liga (nombre, país, logo, bandera)
      parameters:
        - { name: ligaId, in: path, required: true, schema: { type: integer } }
        - { name: temporada, in: query, schema: { type: integer, description: 'para calcular las fases de esa temporada; default: la última' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liga' }
        '404': { description: No existe }
  /ligas/{ligaId}/standings:
    get:
      summary: Tabla de posiciones calculada de los fixtures terminados
      description: >
        Sin `fase`, la tabla del año (todos los partidos de la temporada). Con
        `fase` (Apertura/Clausura/… según lo nombre la región, tal cual viene en
        `league_round`), solo los partidos de esa fase: cada torneo corto arranca
        de cero. Las fases disponibles vienen en `Liga.fases`.
      parameters:
        - { name: ligaId, in: path, required: true, schema: { type: integer } }
        - { name: temporada, in: query, schema: { type: integer, description: 'default: última temporada' } }
        - { name: fase, in: query, schema: { type: string, description: 'nombre de la fase (Apertura, Clausura, …); default: tabla del año' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StandingRow' } }
  /cuotas/{fixtureId}:
    get:
      summary: Cuotas del fixture por mercado y selección
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cuota' } }
  /cuotas/{fixtureId}/casas:
    get:
      summary: Cuotas por casa de apuestas (última foto) para comparar dónde paga más
      description: >
        Una fila por casa y selección, orden mercado → selección → cuota desc.
        `mejor: true` marca la cuota más alta de cada selección (varias si empatan):
        la diferencia de decimales entre casas es la ventaja al elegir dónde apostar.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CuotaCasa' } }
  /cuotas/{fixtureId}/historial/fuentes:
    get:
      summary: Casas de referencia con historial propio para el fixture
      description: Nombres de casas (SAD_CASAS_REFERENCIA) con snapshots individuales, además de la media.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /cuotas/{fixtureId}/historial:
    get:
      summary: Historial de cuotas prepartido (snapshots de cada corrida de ingesta, asc por captura)
      description: >
        Cada corrida de la ingesta guarda en odds_history la media entre casas por
        mercado/selección, y el crudo de las casas de referencia. Sin `casa` se
        sirve la media; con `casa` el movimiento de esa casa. Vacío si el fixture
        aún no tiene snapshots.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: casa, in: query, schema: { type: string, description: 'nombre de la casa de referencia (default: media)' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CuotaSnapshot' } }
  /analisis/despensa:
    post:
      summary: Carga manual de la despensa (investigación hecha en el Claude de escritorio)
      description: >
        docs/DESPENSA_DESKTOP.md — la investigación cara (plantel, DT, bajas,
        táctica) se hace GRATIS en el Claude de escritorio (suscripción plana),
        se exporta como JSON y se deposita aquí. El siguiente EFE por API la
        recibe como datos_cacheados y no busca en la web (~$0.10-0.20 en vez
        del análisis frío). El nombre del equipo debe coincidir con el de la
        app; tipos válidos: dt, plantel, tabla, resultados, fixture,
        xi_reciente, bajas. Escribe efe.db (misma excepción documentada de
        solo-lectura que /analisis/efe).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CargaDespensa' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargaDespensaResultado' }
        '422': { description: Cuerpo inválido o equipos vacío }
  /analisis/efe:
    post:
      summary: Lanza el análisis EFE de un fixture (respuesta inmediata, trabajo en el servidor)
      description: >
        Capa EFE+DTP (docs/efe-dtp/PLAN_ADAPTADO.md). El análisis tarda 1-3 min:
        el POST responde al instante — 'listo' con el registro si ya existe (0
        créditos), o 'generando' tras lanzar el trabajo en un hilo del backend
        (sobrevive aunque el cliente cierre). El frontend sondea
        /analisis/efe/estado/{fixtureId}. Escribe SOLO en efe.db (excepción
        documentada a la regla de solo lectura). 404 si el fixture no existe;
        503 sin ANTHROPIC_API_KEY.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtureId]
              properties:
                fixtureId: { type: integer }
                forzar:
                  type: boolean
                  default: false
                  description: Regenerar — descarta el análisis guardado y emite uno nuevo (consume créditos)
                permitirFrio:
                  type: boolean
                  default: false
                  description: >
                    Candado de análisis frío — por defecto, si faltan más de
                    SAD_EFE_MAX_FALTANTES campos (default 6) el análisis se
                    bloquea ANTES de gastar y el error guía a cargar la
                    despensa gratis; true = acepto pagar el frío (~$0.6-1.2).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/efe/estado/{fixtureId}:
    get:
      summary: Sondeo del trabajo de análisis EFE
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: listo (con registro) / generando / error (con detalle) / nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/efe/preflight/{fixtureId}:
    get:
      summary: Qué va a costar el EFE ANTES de generarlo (costo cero)
      description: >
        Resuelve exactamente las mismas fuentes que usaría /analisis/efe —
        despensa, sad.db, capa de jugadores— pero SIN llamar a ningún modelo y
        SIN gastar cuota de API-Football, y devuelve el origen de cada dato por
        equipo. Los `falta` son los que disparan búsqueda web, que es lo caro:
        el presupuesto es 3 + 2 × faltantes (techo SAD_EFE_BUSQUEDAS), y el
        candado de análisis frío bloquea por encima de SAD_EFE_MAX_FALTANTES.
        `costo` viene de las corridas realmente medidas cuando las hay
        (`medido: true`); si no, de la fórmula, y se dice cuál es cuál.
        404 si el fixture no existe.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreflightEfe' }
        '404': { description: El fixture no existe }
  /analisis/timeline:
    post:
      summary: Lanza el timeline comparativo del fixture (modo futbol-timeline)
      description: >
        Cronología de los dos equipos del fixture (últimos 6 meses por defecto)
        emitida por el modelo como JSON del esquema TIMELINE y renderizada por
        <TimelineComparativo>. Mismo patrón asíncrono y de regeneración que
        /analisis/efe; hereda alertas y colores del EFE previo si existe. El
        registro devuelto lleva tipo 'timeline' y su resultado es el TIMELINE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtureId]
              properties:
                fixtureId: { type: integer }
                forzar:
                  type: boolean
                  default: false
                  description: Regenerar — descarta el timeline guardado y emite uno nuevo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/timeline/estado/{fixtureId}:
    get:
      summary: Sondeo del trabajo de timeline
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: listo (con registro) / generando / error (con detalle) / nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /analisis/dtp:
    post:
      summary: Lanza el DTP (Diagnóstico Táctico de Partido) desde un equipo foco
      description: >
        Cadena rodante del protocolo DTP (docs/efe-dtp/DTP_DISENO.md):
        CIERRE del partido anterior (M4 autopsia de goles + M5 contraste) +
        APERTURA del próximo (M1 lectura del XI, M2 duelos por carril, M3 plan
        por fases, M6 contexto). Es POR EQUIPO FOCO: un mismo fixture puede
        tener dos DTP, uno por equipo. NO busca en la web — se alimenta de la
        ficha de partido (`/fixtures/{id}/ficha.tactica`); si esa ficha falta,
        responde 409 diciendo qué hay que correr en vez de inventar.
        Mismo patrón asíncrono que /analisis/efe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtureId, equipoFoco]
              properties:
                fixtureId: { type: integer }
                equipoFoco: { type: integer, description: 'equipoId del equipo desde el que se analiza' }
                forzar: { type: boolean, default: false }
      responses:
        '200':
          description: listo (con registro) / generando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
        '404': { description: El fixture no existe o el equipo no lo juega }
        '409': { description: Sin ficha de partido para analizar (correr backend.ingesta.ficha_partido) }
        '503': { description: Falta ANTHROPIC_API_KEY }
  /analisis/dtp/estado/{fixtureId}:
    get:
      summary: Sondeo del trabajo de DTP
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
        - { name: equipoFoco, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: listo (con registro) / generando / error (con detalle) / nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneracionEfe' }
  /equipos/{equipoId}/cadena:
    get:
      summary: La película del equipo (cadena DTP)
      description: >
        Pronóstico → qué pasó → veredicto → lección, del partido más reciente
        hacia atrás. `[]` si aún no se generó ningún DTP del equipo.
      parameters:
        - { name: equipoId, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EslabonDtp' }
        '404': { description: No existe el equipo }
  /analisis/partido/{fixtureId}:
    get:
      summary: Análisis emitidos para un fixture (lectura pura, cero créditos)
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK ([] si no hay análisis)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AnalisisRegistro' } }
  /analisis/cowork/agenda:
    get:
      summary: Los partidos del día ordenados por prioridad (paso 1 del batch de Cowork)
      description: >
        Calculado de nuestra base con el criterio del protocolo (Liga 1 Perú, derbi de
        ciudad, copa internacional, liga grande con equipo arriba o en crisis, choque del
        top 6 europeo). Sin `fecha` ni `desdeAhora`: desde ahora y por 24 h, a la hora que
        se corra. La fase de grupos / fase liga internacional y las segundas divisiones
        quedan fuera por defecto (`grupos` / `segundas` las meten). Los descartados viajan
        con su motivo. Cero créditos.
      parameters:
        - { name: fecha, in: query, schema: { type: string, format: date }, description: 'un día concreto (UTC); sin él, desde ahora y por 24 h' }
        - { name: limite, in: query, schema: { type: integer, default: 8, minimum: 1, maximum: 20 } }
        - name: ligaId
          in: query
          schema: { type: integer }
          description: 'acota a una liga (mando manual para apuntar el batch sin tocar el padrón)'
        - name: liga
          in: query
          schema: { type: string, maxLength: 60 }
          description: 'acota por TEXTO: las ligas del padrón cuyo país o nombre contiene esto («España», «LaLiga», «Perú»); la respuesta lista `filtro.ligasQueCasan`'
        - name: grupos
          in: query
          schema: { type: boolean, default: false }
          description: 'incluir la fase de grupos / fase liga de los torneos internacionales (fuera por defecto; la fase decisiva entra siempre)'
        - name: segundas
          in: query
          schema: { type: boolean, default: false }
          description: 'incluir las segundas divisiones (fuera por defecto)'
        - name: desdeAhora
          in: query
          schema: { type: boolean, default: false }
          description: >
            ventana rodante desde este momento en vez del día natural. De noche el día UTC
            ya cambió respecto al local, y un filtro por fecha se comería justo los partidos
            de esta noche.
        - { name: horas, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 72 } }
        - name: incluirDescartados
          in: query
          schema: { type: boolean, default: false }
          description: 'los de prioridad 0 entran al final de la lista, con su motivo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaCowork' }
  /analisis/cowork/pendientes:
    get:
      summary: Partes que todavía esperan el once
      parameters:
        - { name: limite, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PartePendiente' }
  /analisis/cowork:
    post:
      summary: Deposita el parte de análisis de un partido (idempotente por fixtureId)
      description: >
        El camino barato: Cowork escribe el análisis con la suscripción y lo deposita.
        NO hay que mandar total, máximo alcanzable, porcentaje, clasificación, IP,
        reducción por zona, ramas A/B, F3, F4 ni los nombres/fecha del partido: todo eso
        lo calcula el backend y se ignora si llega. Ver docs/COWORK.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParteCoworkEntrada' }
      responses:
        '200':
          description: Recibo del depósito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReciboParte' }
        '422': { description: 'fixtureId ausente o desconocido, o equipos vacíos' }
  /analisis/cowork/{fixtureId}:
    get:
      summary: El parte con lo calculable ya calculado (lectura pura, cero créditos)
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParteCowork' }
        '404': { description: No hay parte para ese fixture }
    delete:
      summary: Descarta el parte (y su once) para volver a depositarlo limpio
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Borrado }
        '404': { description: No hay parte para ese fixture }
  /analisis/cowork/{fixtureId}/xi:
    post:
      summary: Llega el once y se cierra el bloque F — en local, gratis y al instante
      description: >
        Tres caminos: `desdeFicha` (lo que ya capturó API-Football), el once a mano en
        `a`/`b` (el pantallazo que el usuario le pasa a Cowork), o los dos mezclados.
        Recalcula IP, reducción por zona, F3 y F4 con las fórmulas del protocolo: ningún
        modelo interviene. Si el once no casa con la tabla del parte (menos de 7 nombres),
        el bloque NO se cierra y se devuelve el conflicto declarado.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                a: { $ref: '#/components/schemas/XiLado' }
                b: { $ref: '#/components/schemas/XiLado' }
                desdeFicha: { type: boolean, default: false }
      responses:
        '200':
          description: El parte recalculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParteCowork' }
        '409': { description: 'No hay parte, o la ficha todavía no trae alineaciones' }
  /analisis/cowork/xi/auto:
    post:
      summary: Cierra el bloque F de todos los partes cuya alineación ya está ingestada
      description: >
        **El once no necesita al modelo.** Cerrar el bloque F es cruzar dos listas de
        nombres y aplicar los pesos de rol: aritmética que vive en `bloque_f.py`. Por eso
        seis partidos que arrancan juntos no son seis análisis contra el reloj, son seis
        cierres de milisegundos — la carrera de 30 minutos no existe.


        Idempotente: un lado ya cerrado no se vuelve a tocar. Lo que no se pudo cerrar sale
        con el motivo. `sinFichaTodavia` son los que necesitan el pantallazo a mano, y
        `conConflicto` los que casan con menos de 7 nombres de la tabla F1 — ahí no se
        fuerza nada: un IP inventado es peor que un bloque abierto.
      parameters:
        - { name: limite, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisados: { type: integer }
                  cerrados: { type: array, items: { type: object, additionalProperties: true } }
                  conConflicto: { type: array, items: { type: object, additionalProperties: true } }
                  nuncaVaALlegar:
                    type: array
                    description: >
                      Partidos YA TERMINADOS cuya liga no da alineaciones por API-Football.
                      No están esperando nada: reintentar no sirve, y el pantallazo a mano
                      es el procedimiento para esa liga, no la excepción.
                    items: { type: object, additionalProperties: true }
                  ligasSinOnce:
                    type: array
                    description: 'ligas que no dan onces: para verlo como patrón, no caso por caso'
                    items: { type: integer }
                  sinFichaTodavia: { type: array, items: { type: object, additionalProperties: true } }
                  nota: { type: string }
  /analisis/cowork/latido:
    get:
      summary: ¿Está corriendo el pipeline, o lleva días muerto en silencio?
      description: >
        Una tubería automática sin vigilancia no falla con ruido: falla callada, y se
        descubre semanas después cuando alguien va a mirar una métrica y no hay casos.
        Esto contesta de una sola llamada las cuatro señales que delatan la caída: nada
        depositado en la ventana, partidos de la agenda de ayer sin parte, veredictos
        vencidos y onces sin cerrar.


        **El silencio cuenta como fallo.** Cero partes en la ventana devuelve `rojo`, no
        «sin novedad» — que es la diferencia entre un monitor y un adorno. `coberturaDeAyer`
        es la señal que no se puede deducir mirando solo los partes: compara contra lo que
        la agenda habría elegido.


        No dispara nada ni corrige nada: solo mira y dice.
      parameters:
        - name: horas
          in: query
          description: 'ventana para contar depósitos; por debajo de ella, el silencio es rojo'
          schema: { type: integer, default: 36, minimum: 1, maximum: 336 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatidoCowork' }
  /analisis/cowork/tde/{fixtureId}:
    get:
      summary: Los insumos del Teorema del Echado que salen de NUESTRA base
      description: >
        No devuelve el IE: devuelve lo que el propio skill manda tomar del motor y que
        hasta ahora se le pedía al modelo que escribiera a mano. `p1a` (rol de protector
        del resultado) es «input inviolable» y sale de comparar los dos `μ_partido` contra
        el umbral de 0.30 —el skill prohíbe derivarlo del gap o corregir μ por localía—;
        `f2` (descanso y calendario) es «dato del motor o no es dato»; `f1` (rotación en
        los últimos 3) sale de las alineaciones ya ingestadas.


        Lo que NO se puede calcular se declara en `noCalculables`, uno por uno y con el
        motivo: un insumo que falta tiene que verse, no adivinarse. `f2` devuelve un PISO
        y no un score cerrado, porque el viaje y la altitud son parte de la rúbrica y no
        están en nuestra base.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaTde' }
        '404': { description: el fixture no está en nuestra base }
  /analisis/cowork/veredictos/pendientes:
    get:
      summary: Partes sin veredicto cuyo partido ya arrancó hace rato (fase B)
      description: >
        El disparador de la validación: partes depositados, con el partido arrancado hace
        más de `horas` y con marcador en nuestra base. Nadie tiene que acordarse de nada y
        lo que no se validó hoy sigue estando mañana. Ver docs/APRENDIZAJE.md.


        Devuelve un SOBRE, no una lista pelada: un `[]` no distingue "no hay nada que
        cerrar" de "los partidos siguen jugándose" o "la ingesta todavía no trajo el
        marcador", y quien corre la validación se queda sin saber si esperar o seguir.
        Cada parte sin veredicto que no entra a `pendientes` sale en `noListados` con su
        motivo y, si está en juego, con su minuto y su marcador parcial.
      parameters:
        - name: horas
          in: query
          description: >
            Se cuenta desde el SAQUE, no desde el pitazo final (no guardamos la hora de
            término). Subirlo ESTRECHA la búsqueda; bajarlo la abre.
          schema: { type: integer, default: 12, minimum: 0, maximum: 720 }
        - { name: limite, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SobrePendientes' }
  /analisis/cowork/lecciones:
    get:
      summary: Las lecciones acumuladas por skill (fase C)
      description: >
        Lo que el bucle aprendió, indexado desde los veredictos. El CONTENIDO de cada
        lección no se copia a ninguna tabla: se deriva del veredicto al leer, igual que el
        marcador y el timeline. Si alguien corrige un veredicto, la lección corregida
        aparece sola; una copia se habría quedado vieja sin que nadie se enterara. Lo único
        que se guarda aparte es el ESTADO (pendiente / en_revision / aplicada / descartada),
        que es lo que evita el bucle infinito y no se puede derivar de nada.


        Las métricas se publican SOLO sobre la población acreditable (`ciega` + `PRE`), con
        su `n` a la vista; las otras poblaciones se cuentan aparte y nunca se suman. Cada
        lección trae `puedeMoverNumeros`: una lección de un caso contaminado puede fijar
        rúbrica —aclarar cómo se aplica una regla— pero NO mueve un peso. Esa distinción la
        lleva el dato, no el criterio de quien lo lea ese día.
      parameters:
        - { name: skill, in: query, description: 'filtra por skill', schema: { type: string } }
        - name: estado
          in: query
          description: 'pendiente | en_revision | aplicada | descartada'
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventarioLecciones' }
  /analisis/cowork/lecciones/{clave}:
    post:
      summary: Mover una lección de estado — lo hace el usuario, no el agente
      description: >
        `clave` es `fixtureId:lado` (ej. `1550964:a`). Marcar `aplicada` EXIGE `aplicadaEn`
        con la versión del skill donde entró: una lección aplicada sin versión no se puede
        auditar después, y es justo el momento en que más barato es anotarla.


        Este endpoint NO está en la lista de permitidos de `SAD_TOKEN_COWORK`: el agente
        lee sus lecciones pero no declara aplicada la suya. Mover el estado es del usuario.
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [pendiente, en_revision, aplicada, descartada] }
                aplicadaEn: { type: string, description: 'versión del skill; obligatoria para `aplicada`' }
                nota: { type: string }
      responses:
        '200':
          description: La lección con su estado nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeccionItem' }
        '403': { description: 'el token de Cowork no puede mover estados' }
        '404': { description: 'no hay lección con esa clave' }
        '422': { description: 'estado fuera del vocabulario, o `aplicada` sin `aplicadaEn`' }
  /analisis/cowork/{fixtureId}/veredicto:
    get:
      summary: El veredicto guardado, con su parte objetiva recalculada al leer
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veredicto' }
        '404': { description: El fixture todavía no tiene veredicto }
    post:
      summary: Cierra el caso 12 h después — ¿acertó el pronóstico?
      description: >
        Lo objetivo lo calcula el backend y viaja en la respuesta (marcador, acierto del
        1X2, Brier, si cayó gol en la ventana del TDE, los goles con su minuto). De fuera
        llega el juicio: por qué falló, la lección, y —lo que no se puede deducir— si el
        caso es CIEGO o está contaminado. Sin pronóstico previo no se escribe veredicto en
        la cadena del equipo: los lados afectados vuelven en `sinPronosticoPrevio`.
      parameters:
        - { name: fixtureId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VeredictoEntrada' }
      responses:
        '200':
          description: El veredicto con lo calculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veredicto' }
        '422': { description: 'población o modo inválidos, sin porLado, o no hay parte' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    LeccionItem:
      type: object
      description: >
        Una lección: el contenido viene del veredicto (derivado al leer), el estado de su
        propia tabla. `clave` es `fixtureId:lado`.
      properties:
        clave: { type: string, example: '1550964:a' }
        fixtureId: { type: integer }
        lado: { type: string, enum: [a, b] }
        equipo: { type: string }
        rival: { type: string }
        partido: { type: string }
        fecha: { type: string }
        skill: { type: string, description: 'vacío = la lección no declaró de qué skill es' }
        veredicto: { type: string, enum: [acierto, parcial, fallo] }
        queP: { type: string }
        leccion: { type: string }
        reglaTocada: { type: string }
        seleccion: { type: string, enum: [ciega, por_resultado, post_resultado] }
        modoEvaluacion: { type: string, enum: [PRE, COND] }
        acredita: { type: boolean }
        mancha: { type: string, description: 'salvedad declarada; el caso acredita igual' }
        puedeMoverNumeros:
          type: boolean
          description: >
            Solo un caso acreditable (ciega + PRE) puede mover un peso. Los demás fijan
            rúbrica: aclaran cómo se aplica una regla, sin tocar ningún número.
        estado: { type: string, enum: [pendiente, en_revision, aplicada, descartada] }
        aplicadaEn: { type: string }
        nota: { type: string }
        actualizadoEn: { type: string }
    InventarioLecciones:
      type: object
      properties:
        generadoEn: { type: string }
        filtro:
          type: object
          properties:
            skill: { type: string }
            estado: { type: string }
        poblacion:
          type: object
          description: 'los casos cerrados por población; NUNCA se suman entre sí'
          additionalProperties: true
        acreditables:
          type: object
          description: >
            La única población medible (ciega + PRE): veredictos por lado, tasa de acierto
            con su n, acierto del 1X2 y Brier con su línea de base.
          additionalProperties: true
        porSkill:
          type: array
          items:
            type: object
            properties:
              skill: { type: string }
              lecciones: { type: object, additionalProperties: { type: integer } }
              atribuidos: { type: object, additionalProperties: { type: integer } }
              sesgoDeAtribucion: { type: string }
              revisionAbierta: { type: boolean, description: 'fase D: 4 fallos con lección pendiente' }
              faltanParaDisparar: { type: integer }
              liston: { type: object, nullable: true, additionalProperties: true }
              items: { type: array, items: { $ref: '#/components/schemas/LeccionItem' } }
        sinSkill:
          type: object
          description: 'lecciones que no declararon skill: se delatan, no se reparten a ojo'
          additionalProperties: true
        items:
          type: array
          items: { $ref: '#/components/schemas/LeccionItem' }
    Health:
      type: object
      required: [status, version, dbOk, lastPipelineRun]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        dbOk: { type: boolean }
        lastPipelineRun: { type: string, format: date-time, nullable: true }
    EstadoFixture:
      type: string
      enum: [programado, en_vivo, finalizado]
    Equipo:
      type: object
      required: [id, nombre, abreviatura]
      properties:
        id: { type: integer }
        nombre: { type: string }
        abreviatura: { type: string }
        pais: { type: string }
        logo: { type: string, nullable: true, description: 'URL del escudo (teams.logo de sad.db)' }
    Fixture:
      type: object
      required: [id, fecha, ligaId, liga, temporada, estado, local, visitante]
      properties:
        id: { type: integer }
        fecha: { type: string, format: date-time }
        ligaId: { type: integer }
        liga: { type: string }
        temporada: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoFixture' }
        minuto: { type: integer, nullable: true }
        estadio: { type: string }
        local: { $ref: '#/components/schemas/Equipo' }
        visitante: { $ref: '#/components/schemas/Equipo' }
        golesLocal: { type: integer, nullable: true }
        golesVisitante: { type: integer, nullable: true }
        ligaLogo: { type: string, nullable: true, description: 'URL del logo del torneo (leagues.logo)' }
        ligaBandera: { type: string, nullable: true, description: 'URL de la bandera del país (leagues.flag; null en copas internacionales)' }
        ligaPais: { type: string, nullable: true, description: 'país del torneo (leagues.country): desambigua torneos homónimos, p. ej. la Copa de la Liga de Perú y la de Chile' }
    Liga:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
        pais: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        bandera: { type: string, nullable: true }
        temporada: { type: integer, nullable: true, description: 'última temporada conocida' }
        temporadas: { type: array, items: { type: integer }, description: 'temporadas con fixtures capturados, descendente' }
        fases: { type: array, items: { type: string }, description: 'fases del torneo de la temporada (Apertura, Clausura, …), ordenadas por fecha; [] si la liga no parte la temporada' }
    Nivel:
      type: object
      required: [equipoId, fixtureId, fecha, nivel, bin, binEtiqueta]
      properties:
        equipoId: { type: integer }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        nivel: { type: number, description: 'continuo ~0.5–3.5' }
        bin: { type: integer, minimum: 0, maximum: 9 }
        binEtiqueta: { type: string }
    Constantes:
      type: object
      description: Fila de constants + processed_matches (rival, goles) + fusión
      required: [equipoId, fixtureId, fecha, condicion, rivalId, rivalNombre, nivelRival, golesFavor, golesContra, ligaId, esInternacional, q, k, fusion]
      properties:
        equipoId: { type: integer }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        condicion: { type: string, enum: [Local, Visita] }
        rivalId: { type: integer }
        rivalNombre: { type: string }
        nivelRival: { type: number, description: 'nivel CONTINUO del rival con el que el motor ponderó la fila (§3.1), recuperado de las q; processed_matches guarda el bin 0–9 y ese NO es este campo' }
        golesFavor: { type: integer }
        golesContra: { type: integer }
        ligaId: { type: integer }
        esInternacional: { type: boolean, description: 'true si fue torneo internacional (UCL, UEL, Libertadores…)' }
        q:
          type: object
          properties:
            local: { type: number, nullable: true }
            visita: { type: number, nullable: true }
            negativo: { type: number }
            golesAnotado: { type: number }
            golesRecibido: { type: number }
            dc: { type: number, description: 'Aporte Doble Oportunidad (§3.6): 0 si perdió, si no max(dif·nivelRival, 0.5·nivelRival)' }
        k:
          type: object
          description: Acumuladores de racha (§3.3) + Doble Oportunidad (§3.6) + Márgenes (§3.7)
          properties:
            positivo: { type: number }
            negativo: { type: number }
            positivoLocal: { type: number }
            negativoLocal: { type: number }
            positivoVisita: { type: number }
            negativoVisita: { type: number }
            golesAnotado: { type: number }
            golesRecibido: { type: number }
            golesLocalAnotado: { type: number }
            golesLocalRecibido: { type: number }
            golesVisitaAnotado: { type: number }
            golesVisitaRecibido: { type: number }
            dc: { type: number, description: 'Racha "sin perder" (1X); no-negativo, resetea solo al perder (§3.6)' }
            dcLocal: { type: number }
            dcVisita: { type: number }
            # Márgenes (§3.7): racha por margen exacto de goles (1/2/3+). Aporte plano nivelRival.
            vic1: { type: number }
            vic1Local: { type: number }
            vic1Visita: { type: number }
            vic2: { type: number }
            vic2Local: { type: number }
            vic2Visita: { type: number }
            vic3: { type: number }
            vic3Local: { type: number }
            vic3Visita: { type: number }
            der1: { type: number }
            der1Local: { type: number }
            der1Visita: { type: number }
            der2: { type: number }
            der2Local: { type: number }
            der2Visita: { type: number }
            der3: { type: number }
            der3Local: { type: number }
            der3Visita: { type: number }
        fusion:
          type: object
          description: K fusionadas k = k⁺ + k⁻ (§4.2); k_dc pasa tal cual (§3.6)
          properties:
            k: { type: number }
            kLocal: { type: number }
            kVisita: { type: number }
            golesAnotado: { type: number }
            golesRecibido: { type: number }
            golesLocalAnotado: { type: number }
            golesLocalRecibido: { type: number }
            golesVisitaAnotado: { type: number }
            golesVisitaRecibido: { type: number }
            kDc: { type: number }
            kDcLocal: { type: number }
            kDcVisita: { type: number }
            # Márgenes (§3.7): acumuladores no-negativos, pasan tal cual
            kVic1: { type: number }
            kVic1Local: { type: number }
            kVic1Visita: { type: number }
            kVic2: { type: number }
            kVic2Local: { type: number }
            kVic2Visita: { type: number }
            kVic3: { type: number }
            kVic3Local: { type: number }
            kVic3Visita: { type: number }
            kDer1: { type: number }
            kDer1Local: { type: number }
            kDer1Visita: { type: number }
            kDer2: { type: number }
            kDer2Local: { type: number }
            kDer2Visita: { type: number }
            kDer3: { type: number }
            kDer3Local: { type: number }
            kDer3Visita: { type: number }
    ConstanteCuota:
      type: object
      description: 'Fila de constants_cuota (§3.8): rachas de SUMA de cuota del 1X2 y de la Doble Oportunidad, solo 2026'
      required: [equipoId, fixtureId, fecha, resultado, cuota, k]
      properties:
        equipoId: { type: integer }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        resultado: { type: integer, enum: [1, 0, -1], description: '1 gana · 0 empata · -1 pierde' }
        esLocal: { type: boolean, description: 'true si jugó de local (toggle LOCAL/VISITA)' }
        cuota:
          type: object
          description: >-
            Cuotas que aplicaron a ese partido, en la perspectiva del equipo (null si el
            mercado no se capturó; los dos mercados tienen huecos independientes).
          properties:
            victoria: { type: number, nullable: true }
            empate: { type: number, nullable: true }
            derrota: { type: number, nullable: true }
            dc1x: { type: number, nullable: true, description: 'doble oportunidad: no pierde' }
            dc12: { type: number, nullable: true, description: 'doble oportunidad: no empata' }
            dcX2: { type: number, nullable: true, description: 'doble oportunidad: no gana' }
        k:
          type: object
          description: 18 acumuladores de suma de cuota (6 familias × total/local/visita)
          properties:
            victoria: { type: number }
            victoriaLocal: { type: number }
            victoriaVisita: { type: number }
            empate: { type: number }
            empateLocal: { type: number }
            empateVisita: { type: number }
            derrota: { type: number }
            derrotaLocal: { type: number }
            derrotaVisita: { type: number }
            dc1x: { type: number }
            dc1xLocal: { type: number }
            dc1xVisita: { type: number }
            dc12: { type: number }
            dc12Local: { type: number }
            dc12Visita: { type: number }
            dcX2: { type: number }
            dcX2Local: { type: number }
            dcX2Visita: { type: number }
    GapEquipo:
      type: object
      required: [equipoId, nivel, ptsEsperados, proximos, partidoTrampa]
      properties:
        equipoId: { type: integer }
        nivel: { type: number }
        ptsRecientes: { type: number, nullable: true }
        ptsEsperados: { type: number, description: 'μ recortado a [0,3]' }
        gap: { type: number, nullable: true, description: 'esperados − recientes; >0 subrinde' }
        senal: { type: string, enum: [fuerte, leve, equilibrio], nullable: true }
        tendencia: { type: string, enum: [mejora, empeora], nullable: true }
        ptsEsperadosAjustados: { type: number, nullable: true, description: 'media de μ(nivel, rival_i, localía_i) sobre los MISMOS últ. 5 (ajuste por calendario); null si no hay 5' }
        gapAjustado: { type: number, nullable: true, description: 'esperadosAjustados − recientes; >0 subrinde DADO su calendario' }
        senalAjustada: { type: string, enum: [fuerte, leve, equilibrio], nullable: true }
        tendenciaAjustada: { type: string, enum: [mejora, empeora], nullable: true }
        muPartido: { type: number, nullable: true, description: 'μ del PROPIO fixture analizado (rival real, localía real): si hoy puede expresarse la regresión' }
        proximos:
          type: array
          maxItems: 3
          description: 'camino de recuperación: próximos fixtures del equipo tras el analizado'
          items: { $ref: '#/components/schemas/ProximoPartido' }
        recuperabilidad: { type: number, nullable: true, description: 'media de muEsperado sobre proximos; null si no hay próximos' }
        senalCalendario: { type: string, enum: [blando, neutro, duro], nullable: true, description: 'recuperabilidad vs μ genérica (umbral ±0.15, provisional hasta backtest)' }
        partidoTrampa: { type: boolean, description: 'rival de hoy claramente inferior con un grande (internacional o nivel ≥ propio) a ≤4 días: candidato a rotación/cansancio' }
    ProximoPartido:
      type: object
      required: [fixtureId, fecha, rival, esLocal, nivelRival, muEsperado, esInternacional, diasDescanso]
      properties:
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        rival: { $ref: '#/components/schemas/Equipo' }
        esLocal: { type: boolean }
        nivelRival: { type: number, description: 'nivel continuo a la fecha (fallback 1.0 — §3.1)' }
        muEsperado: { type: number, description: 'μ(nivel, nivelRival, localía) de ese partido futuro' }
        esInternacional: { type: boolean }
        diasDescanso: { type: integer, description: 'días desde el partido anterior del camino (el analizado para el primero)' }
    Prediccion:
      type: object
      required: [fixtureId, local, visitante, generadoEn]
      properties:
        fixtureId: { type: integer }
        local: { $ref: '#/components/schemas/GapEquipo' }
        visitante: { $ref: '#/components/schemas/GapEquipo' }
        gapDiff: { type: number, nullable: true }
        gapDiffAjustado: { type: number, nullable: true, description: 'gapAjustado_local − gapAjustado_visitante' }
        fiabilidadMu:
          type: object
          nullable: true
          description: 'confianza en μ v2 para la liga del fixture (evidencia: calibración por liga 2026-07, doc §5)'
          properties:
            nivel: { type: string, enum: [alta, media, baja] }
            nota: { type: string, description: 'por qué, en lenguaje de apostador' }
        generadoEn: { type: string, format: date-time }
    AnalisisPrepartido:
      type: object
      required: [fixtureId, niveles, constantes, prediccion, resumen]
      properties:
        fixtureId: { type: integer }
        niveles:
          type: object
          properties:
            local: { $ref: '#/components/schemas/Nivel' }
            visitante: { $ref: '#/components/schemas/Nivel' }
        constantes:
          type: object
          properties:
            local: { $ref: '#/components/schemas/Constantes', nullable: true }
            visitante: { $ref: '#/components/schemas/Constantes', nullable: true }
        prediccion: { $ref: '#/components/schemas/Prediccion' }
        resumen: { type: string }
    EquipoStats:
      type: object
      description: Calculadas de fixtures; los promedios avanzados son null hasta que el backend los derive
      required: [equipoId, nombre, partidosJugados, puntos, forma, golesFavorProm, golesContraProm]
      properties:
        equipoId: { type: integer }
        nombre: { type: string }
        partidosJugados: { type: integer }
        puntos: { type: integer }
        forma:
          type: array
          description: Últimos 5 resultados, más reciente primero
          items: { type: string, enum: [W, D, L] }
        golesFavorProm: { type: number }
        golesContraProm: { type: number }
        xgProm: { type: number, nullable: true }
        posesionProm: { type: number, nullable: true }
        tirosPuertaProm: { type: number, nullable: true }
        cornersProm: { type: number, nullable: true }
    Jugador:
      type: object
      description: Indicadores de un jugador (docs/JUGADORES.md, capa 1)
      required: [id, nombre, posicion, partidos, titularidades, minutos, pctMinutos, confianza,
                 goles, asistencias, participacionOfensiva, amarillas, rojas, enCapilla]
      properties:
        id: { type: integer }
        nombre: { type: string }
        edad: { type: integer, nullable: true }
        foto: { type: string, nullable: true }
        posicion: { type: string, description: 'Portero · Defensa · Centrocampista · Delantero · ""' }
        partidos: { type: integer }
        titularidades: { type: integer }
        minutos: { type: integer }
        pctMinutos: { type: number, description: minutos / máx. de la plantilla (proxy de titularidad) }
        rating: { type: number, nullable: true, description: media ponderada por minutos entre competiciones }
        confianza: { type: string, enum: [A, B, C], description: 'A ≥1800 min · B ≥600 · C <600; recién llegado baja un grado' }
        goles: { type: integer }
        asistencias: { type: integer }
        golesP90: { type: number, nullable: true }
        asistenciasP90: { type: number, nullable: true }
        gaP90Ajustado: { type: number, nullable: true, description: '(G+A)/90 con encogimiento bayesiano hacia la media de su posición (M=900 min)' }
        participacionOfensiva: { type: number, description: (G+A) del jugador / Σ goles de la plantilla }
        amarillas: { type: integer }
        rojas: { type: integer }
        enCapilla: { type: boolean, description: '≥4 amarillas sin roja: riesgo de sanción (bandera, la regla exacta varía por torneo)' }
        paradasP90: { type: number, nullable: true, description: solo porteros }
        golesEncajadosP90: { type: number, nullable: true, description: solo porteros }
        baja:
          type: object
          nullable: true
          properties:
            tipo: { type: string, nullable: true }
            detalle: { type: string, nullable: true }
        recienLlegado:
          type: object
          nullable: true
          description: traspaso hacia el equipo en ≤90 días
          properties:
            desde: { type: string, nullable: true }
            fecha: { type: string, nullable: true }
    Plantilla:
      type: object
      description: Plantilla con indicadores + agregados del equipo (docs/JUGADORES.md)
      required: [equipoId, jugadores, dependencia, revolucion]
      properties:
        equipoId: { type: integer }
        nombre: { type: string }
        temporada: { type: integer, nullable: true }
        actualizadoEn: { type: string, format: date-time, nullable: true, description: última ingesta de jugadores del equipo }
        entrenador:
          type: object
          nullable: true
          properties:
            nombre: { type: string, nullable: true }
            desde: { type: string, nullable: true }
        dependencia:
          type: object
          description: 'HHI de shares de G+A: ~1/n coral · →1 él-dependiente'
          properties:
            hhi: { type: number, nullable: true }
            top:
              type: array
              items:
                type: object
                properties:
                  jugadorId: { type: integer }
                  nombre: { type: string }
                  participacion: { type: number }
        revolucion:
          type: object
          description: traspasos de la ventana reciente (estabilidad de plantel)
          properties:
            llegadas: { type: integer }
            salidas: { type: integer }
            ventanaDias: { type: integer }
        golesPlantilla: { type: integer, description: Σ goles de la plantilla (denominador de participación) }
        jugadores:
          type: array
          items: { $ref: '#/components/schemas/Jugador' }
        ingestaLanzada: { type: boolean, description: 'con jugadores=[]: true si la ingesta on-demand del equipo quedó lanzada en segundo plano (la UI sondea)' }
    FichaEquipo:
      allOf:
        - $ref: '#/components/schemas/Plantilla'
        - type: object
          properties:
            congestion:
              type: object
              description: calculada de fixtures ya capturados (0 requests)
              properties:
                diasDescanso: { type: integer, nullable: true }
                partidos21d: { type: integer }
    FichaPartido:
      type: object
      description: 'Puente con los skills: plantillas + congestión de ambos equipos + ficha táctica'
      required: [fixtureId, generadoEn, local, visitante]
      properties:
        fixtureId: { type: integer }
        generadoEn: { type: string, format: date-time }
        local: { $ref: '#/components/schemas/FichaEquipo' }
        visitante: { $ref: '#/components/schemas/FichaEquipo' }
        tactica: { $ref: '#/components/schemas/FichaTactica' }
    EtiquetaRival:
      type: object
      description: >
        Una etiqueta del bloque G2 con el DATO que la sostiene. Sin el número
        sería una opinión, y una opinión no debería entrar en un análisis.
      required: [codigo, label, dato]
      properties:
        codigo:
          type: string
          enum: [RECIEN_ASCENDIDO, EN_CRISIS, LOCAL_FUERTE, VISITA_DEBIL, EQUIPO_SORPRESA, BLOQUE_BAJO, CLASICO]
        label: { type: string, description: 'el nombre del protocolo, para mostrar' }
        dato: { type: string, description: 'la cifra que dispara la etiqueta ("3 derrotas seguidas")' }
        nota: { type: string, description: 'qué implica para la lectura' }
        parcial:
          type: boolean
          description: >
            true cuando el criterio solo se cubre en parte (CLÁSICO: detectamos
            derbis de ciudad, no rivalidades nacionales). Su ausencia no prueba nada.
    PartidoCalendario:
      type: object
      description: 'Un partido próximo con el mapa de rivales del bloque G ya resuelto'
      required: [fixtureId, fecha, rivalId, rival, condicion, etiquetas]
      properties:
        fixtureId: { type: integer }
        fecha: { type: string, format: date }
        rivalId: { type: integer }
        rival: { type: string }
        condicion: { type: string, enum: [L, V] }
        torneo: { type: string, nullable: true }
        ronda: { type: string, nullable: true }
        posicionRival: { type: integer, nullable: true }
        equiposEnLaTabla: { type: integer, nullable: true }
        zonaRival: { type: string, nullable: true, enum: [alta, media, descenso, null] }
        diasDescanso: { type: integer, nullable: true, description: 'contra el partido anterior' }
        etiquetas: { type: array, items: { $ref: '#/components/schemas/EtiquetaRival' } }
    Distribucion:
      type: object
      description: 'media · mediana · moda · min · max de una lista. moda null si ningún valor se repite (K a entero, nivel a un decimal); en empate, la menor.'
      required: [media, mediana, moda, min, max]
      properties:
        media: { type: number }
        mediana: { type: number }
        moda: { type: number, nullable: true }
        min: { type: number }
        max: { type: number }
    Reventon:
      type: object
      description: 'Una burbuja cerrada: la racha (signo, partidos, K pico) y el partido que la reventó'
      required: [signo, partidos, kPico, fixtureId, fecha, rivalId, rival, nivelRival, condicion, resultado, esInternacional]
      properties:
        signo: { type: string, enum: ['+', '-'] }
        partidos: { type: integer, description: 'partidos de la condición que duró la racha' }
        kPico: { type: number, description: '|K| máxima antes de reventar' }
        fixtureId: { type: integer }
        fecha: { type: string, format: date-time }
        rivalId: { type: integer }
        rival: { type: string }
        nivelRival: { type: number }
        condicion: { type: string, enum: [L, V] }
        resultado: { type: string, example: '0-1' }
        esInternacional: { type: boolean }
    HistorialSigno:
      type: object
      required: [n, kPico, partidos, nivelRival]
      properties:
        n: { type: integer }
        kPico: { $ref: '#/components/schemas/Distribucion' }
        partidos: { $ref: '#/components/schemas/Distribucion' }
        nivelRival: { $ref: '#/components/schemas/Distribucion', description: 'nivel del rival que reventó cada burbuja' }
    FamiliaBurbuja:
      type: object
      required: [familia, partidosEnCondicion, actual, reventones, historial, posicion, rival, riesgo, extremo]
      properties:
        familia: { type: string, enum: [total, local, visita] }
        partidosEnCondicion: { type: integer }
        actual:
          type: object
          nullable: true
          description: 'Burbuja abierta hoy; null si la K está en 0'
          required: [signo, k, partidos, kPico, desde, aplicaAlProximo]
          properties:
            signo: { type: string, enum: ['+', '-'] }
            k: { type: number, description: 'K con signo' }
            partidos: { type: integer }
            kPico: { type: number }
            desde: { type: string, format: date-time }
            aplicaAlProximo: { type: boolean, nullable: true, description: 'si el próximo partido mueve esta familia (null sin próximo)' }
        reventones: { type: array, items: { $ref: '#/components/schemas/Reventon' }, description: 'cerradas, cronológicas (las 40 más recientes; la estadística usa todas)' }
        historial:
          type: object
          required: [positivo, negativo]
          properties:
            positivo: { $ref: '#/components/schemas/HistorialSigno', nullable: true }
            negativo: { $ref: '#/components/schemas/HistorialSigno', nullable: true }
        posicion:
          type: object
          nullable: true
          description: 'la burbuja abierta frente a los reventones de su signo'
          required: [percentilK, percentilRacha, kSobreMediana]
          properties:
            percentilK: { type: integer, description: '% de reventones con K pico ≤ K actual' }
            percentilRacha: { type: integer }
            kSobreMediana: { type: number, nullable: true }
        rival:
          type: object
          nullable: true
          description: 'el próximo rival frente al nivel con el que suele reventar (solo si la familia aplica al próximo)'
          required: [nivelProximo, medianaReventon, distancia, enZona, tramo]
          properties:
            nivelProximo: { type: number }
            medianaReventon: { type: number }
            distancia: { type: number, description: 'nivelProximo − mediana (con signo, sin girar)' }
            enZona: { type: boolean, description: 'tramo ≠ lejos' }
            tramo: { type: string, enum: [lejos, zona, fuerte, muy fuerte], description: 'en la dirección del riesgo (más fuerte para la burbuja +, más flojo para la −): lejos < −0.15 · zona ±0.15 · fuerte ≥ 0.15 · muy fuerte ≥ 0.45' }
        riesgo:
          type: object
          nullable: true
          required: [nivel, puntos, motivos, confianza, confianzaMotivos]
          properties:
            nivel: { type: string, enum: [bajo, medio, alto, muy alto, sin base] }
            puntos: { type: integer, description: 'calibrados con el backtest real (docs/REVENTON.md §8): la K NO puntúa · racha ≥ mediana +1 · rival en zona +3 · fuerte +5 · muy fuerte +7. bajo 0–1 · medio 2–3 · alto 4–5 · muy alto ≥ 6' }
            motivos: { type: array, items: { type: string } }
            confianza: { type: string, enum: [baja, media, alta], description: 'muestra de reventones y estabilidad; nunca mueve el riesgo' }
            confianzaMotivos: { type: array, items: { type: string } }
        extremo:
          $ref: '#/components/schemas/ExtremoBurbuja'
          nullable: true
          description: 'ALERTA DE EXTREMO (prudencia, no probabilidad): null sin base del signo'
    ExtremoBurbuja:
      type: object
      description: >
        La burbuja abierta está en su máximo histórico para este equipo: |K| ≥ la K pico más
        alta con la que reventó ese signo (`kRecord`) o racha ≥ la más larga (`rachaRecord`).
        NO mueve el riesgo —el backtest dice que la K no puntúa—, pero es terreno sin
        precedente y la pantalla y el parte lo gritan aparte: no cargar la apuesta a que la
        racha siga. Cowork no se la puede saltar (docs/COWORK.md).
      required: [activo, kRecord, rachaRecord, partidosHistoria, maximoPrevio, motivos, texto]
      properties:
        activo: { type: boolean }
        kRecord: { type: boolean }
        rachaRecord: { type: boolean }
        partidosHistoria: { type: integer, description: 'N: partidos de la condición en la base («la más alta en N partidos»)' }
        maximoPrevio:
          type: object
          required: [kPico, partidos]
          properties:
            kPico: { type: number }
            partidos: { type: integer }
        motivos: { type: array, items: { type: string } }
        texto: { type: string, description: "'' si no está activa" }
    EstabilidadEquipo:
      type: object
      required: [grado, motivos, sinDato, dt, movimientos, bajas, actualizadoEn]
      properties:
        grado: { type: string, enum: [estable, en transición, inestable, sin dato] }
        motivos: { type: array, items: { type: string } }
        sinDato: { type: array, items: { type: string }, description: 'lo que no está en la base y NO se rellena (dueños, organización…)' }
        dt:
          type: object
          nullable: true
          properties:
            nombre: { type: string }
            desde: { type: string, nullable: true }
            dias: { type: integer, nullable: true }
        movimientos:
          type: object
          nullable: true
          properties:
            llegadas: { type: integer }
            salidas: { type: integer }
            ventanaDias: { type: integer }
        bajas: { type: integer, nullable: true }
        actualizadoEn: { type: string, nullable: true }
    BurbujasEquipo:
      type: object
      description: 'Reventón de la burbuja (docs/REVENTON.md): guía calculada de la historia del equipo, no una probabilidad'
      required: [equipoId, nombre, nivel, bin, partidos, mandan, proximo, estabilidad, familias, aviso]
      properties:
        equipoId: { type: integer }
        nombre: { type: string, nullable: true }
        nivel: { type: number }
        bin: { type: integer }
        partidos: { type: integer, description: 'filas de constantes procesadas' }
        mandan:
          type: object
          description: 'qué familia pesa: la total, siempre (el backtest real la puso por delante en todos los niveles). reglaNivel conserva la hipótesis del nivel como dato'
          required: [tipo, familias, motivo, reglaNivel]
          properties:
            tipo: { type: string, enum: [globales, especificas] }
            familias: { type: array, items: { type: string, enum: [total, local, visita] } }
            motivo: { type: string }
            reglaNivel:
              type: object
              required: [tipo, familias, motivo, confirmada]
              properties:
                tipo: { type: string, enum: [globales, especificas], description: 'bin ≥ 7 o ≤ 2 → globales; 3–6 → la de la condición del próximo' }
                familias: { type: array, items: { type: string, enum: [total, local, visita] } }
                motivo: { type: string }
                confirmada: { type: boolean, description: 'false: el backtest del 16/09/2026 no la confirmó' }
        proximo:
          type: object
          nullable: true
          required: [fixtureId, fecha, rivalId, rival, condicion, nivelRival]
          properties:
            fixtureId: { type: integer }
            fecha: { type: string }
            rivalId: { type: integer }
            rival: { type: string }
            condicion: { type: string, enum: [L, V] }
            nivelRival: { type: number, description: 'último nivel del rival (1.0 si no tiene, como el motor §3.1)' }
        estabilidad: { $ref: '#/components/schemas/EstabilidadEquipo' }
        familias:
          type: object
          required: [total, local, visita]
          properties:
            total: { $ref: '#/components/schemas/FamiliaBurbuja' }
            local: { $ref: '#/components/schemas/FamiliaBurbuja' }
            visita: { $ref: '#/components/schemas/FamiliaBurbuja' }
        aviso: { type: string }
        vistaAlDia:
          type: object
          description: 'solo con antesDe: la vista «al día del partido» (docs/REVENTON.md §9)'
          properties:
            fixtureId: { type: integer }
            fecha: { type: string, nullable: true }
    EslabonDtp:
      type: object
      description: 'Un partido de la cadena DTP de un equipo foco'
      required: [equipoFoco, partidoN, fixtureId]
      properties:
        equipoFoco: { type: string }
        partidoN: { type: integer, description: 'posición cronológica del partido en la temporada del equipo' }
        rival: { type: string, nullable: true }
        fecha: { type: string, nullable: true }
        fixtureId: { type: integer, nullable: true }
        apertura: { type: object, nullable: true, description: 'M1/M2/M3/M6 escritos ANTES del partido' }
        cierre: { type: object, nullable: true, description: 'M4/M5 escritos después' }
        registro:
          type: object
          nullable: true
          properties:
            pronostico_clave: { type: string }
            que_paso: { type: string }
            veredicto: { type: string, enum: ['', acierto, parcial, fallo], description: '"" si no hubo pronóstico previo (anti-hindsight)' }
            leccion: { type: string }
    FichaTactica:
      type: object
      description: |
        Materia prima del DTP (docs/efe-dtp/DTP_DISENO.md): XI con carriles,
        goles con autor y asistente, y métricas del partido. Todo vacío si la
        ingesta aún no capturó la ficha — nunca reconstruido a ojo.
      required: [eventos, capturada]
      properties:
        capturada: { type: boolean, description: 'false = no hay nada capturado; el DTP no puede abrir M1/M2/M4' }
        alineaciones:
          type: object
          nullable: true
          properties:
            local: { $ref: '#/components/schemas/Alineacion' }
            visitante: { $ref: '#/components/schemas/Alineacion' }
        eventos:
          type: array
          items:
            type: object
            properties:
              minuto: { type: integer }
              extra: { type: integer, description: 'minutos añadidos ya sumados en `minuto`' }
              tipo: { type: string, description: 'Goal | Card | subst | Var' }
              detalle: { type: string }
              equipoId: { type: integer }
              jugador: { type: string, nullable: true }
              jugadorId: { type: integer, nullable: true }
              asistente: { type: string, nullable: true }
              asistenteId: { type: integer, nullable: true }
        estadisticas:
          type: object
          nullable: true
          description: 'clave cruda de API-Football → valor ("Ball Possession": "62%")'
          properties:
            local: { type: object, additionalProperties: { type: string } }
            visitante: { type: object, additionalProperties: { type: string } }
    Alineacion:
      type: object
      required: [equipoId, titulares, suplentes, conGrid]
      properties:
        equipoId: { type: integer }
        formacion: { type: string, nullable: true }
        entrenador: { type: string, nullable: true }
        conGrid: { type: boolean, description: 'false = sin grid de la API: M2 no puede hablar de carriles' }
        titulares:
          type: array
          items: { $ref: '#/components/schemas/JugadorAlineado' }
        suplentes:
          type: array
          items: { $ref: '#/components/schemas/JugadorAlineado' }
    JugadorAlineado:
      type: object
      required: [jugadorId, nombre]
      properties:
        jugadorId: { type: integer }
        nombre: { type: string, nullable: true }
        numero: { type: integer, nullable: true }
        posicion: { type: string, nullable: true, description: 'G|D|M|F' }
        grid: { type: string, nullable: true, description: '"fila:columna" de API-Football' }
        carril: { type: string, nullable: true, enum: [izquierda, centro, derecha, null], description: 'derivado del grid; null si no hay' }
    CargaDespensa:
      type: object
      required: [equipos]
      properties:
        equipos:
          type: array
          items:
            type: object
            required: [equipo, datos]
            properties:
              equipo: { type: string, description: nombre EXACTO del equipo como aparece en la app }
              datos:
                type: object
                description: 'tipo → resumen textual denso (tipos: dt, plantel, tabla, resultados, fixture, xi_reciente, bajas)'
                additionalProperties: { type: string }
        fuentes:
          type: array
          items: { type: string }
    CargaDespensaResultado:
      type: object
      required: [depositados, equipos]
      properties:
        depositados: { type: integer }
        equipos:
          type: array
          items: { type: string }
        canonizados:
          type: object
          description: nombres ajustados al canon de la app (dado → teams.name)
          additionalProperties: { type: string }
        tiposValidos:
          type: array
          items: { type: string }
        tiposIgnorados:
          type: array
          items: { type: string }
    StandingRow:
      type: object
      required: [posicion, equipoId, nombre, puntos, partidosJugados, golesFavor, golesContra]
      properties:
        posicion: { type: integer }
        equipoId: { type: integer }
        nombre: { type: string }
        puntos: { type: integer }
        partidosJugados: { type: integer }
        golesFavor: { type: integer }
        golesContra: { type: integer }
    Cuota:
      type: object
      required: [fixtureId, mercado, seleccion, cuota, actualizadoEn]
      properties:
        fixtureId: { type: integer }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
        actualizadoEn: { type: string, format: date-time }
    EventoLive:
      type: object
      description: Evento del partido para anclar el movimiento de la gráfica (gol, tarjeta)
      required: [minuto, tipo]
      properties:
        minuto: { type: integer, nullable: true }
        tipo: { type: string, enum: [gol, amarilla, roja] }
        equipoId: { type: integer, nullable: true }
        jugador: { type: string, nullable: true }
        detalle: { type: string, nullable: true, description: 'detalle crudo de la API (Penalty, Own Goal…)' }
    GeneracionEfe:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [listo, generando, error, nada] }
        detalle: { type: string, nullable: true, description: 'mensaje del error o del progreso' }
        registro: { $ref: '#/components/schemas/AnalisisRegistro', nullable: true, description: 'presente solo con estado=listo' }
    OrigenDato:
      type: string
      description: >
        De dónde saldrá el dato al generar. `falta` es el único que cuesta
        dinero (dispara búsqueda web); `api` gasta cuota del plan de
        API-Football, no dólares.
      enum: [despensa, anejo, local, api, falta]
    DatoPreflight:
      type: object
      required: [tipo, origen, detalle]
      properties:
        tipo: { type: string, description: 'tipo del protocolo EFE (dt, plantel, tabla, resultados, fixture, xi_reciente, bajas)' }
        origen: { $ref: '#/components/schemas/OrigenDato' }
        detalle: { type: string, description: 'qué fuente exactamente, o por qué falta' }
        edadDias: { type: integer, nullable: true, description: 'solo en origen=anejo: días desde la captura' }
    EquipoPreflight:
      type: object
      required: [equipo, datos]
      properties:
        equipo: { type: string }
        enDespensa: { type: boolean, description: 'false = ningún dato guardado bajo ESE nombre (posible desajuste de nombre)' }
        datos:
          type: array
          items: { $ref: '#/components/schemas/DatoPreflight' }
    CostoPreflight:
      type: object
      required: [min, max, medido]
      properties:
        min: { type: number, description: 'USD' }
        max: { type: number, description: 'USD' }
        medido: { type: boolean, description: 'true = de corridas reales guardadas; false = de la fórmula' }
        muestra: { type: integer, description: 'corridas medidas que sostienen el rango (0 si es fórmula)' }
    CorridaDTO:
      type: object
      description: >
        Una llamada al modelo, con lo que costó DE VERDAD. `tokensPensamiento`
        es el razonamiento, que se cobra a precio de salida igual que el JSON:
        separarlos es lo que dice si hay que acortar textos (json) o bajar el
        esfuerzo (pensamiento).
      required: [tipo, costo, creadoEn]
      properties:
        tipo: { type: string, enum: [efe, timeline, dtp] }
        fixtureId: { type: integer, nullable: true }
        faltantes: { type: integer }
        busquedas: { type: integer }
        modelo: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        cacheWrite: { type: integer }
        cacheRead: { type: integer }
        tokensJson: { type: integer, description: 'parte del output que fue JSON emitido' }
        tokensPensamiento: { type: integer, description: 'parte del output que fue razonamiento' }
        costo: { type: number, description: 'USD reales de esa llamada' }
        creadoEn: { type: string, format: date-time }
    GastoFixture:
      type: object
      description: >
        Lo YA gastado en el partido. Suma todas las corridas, incluidas
        regeneraciones e intentos fallidos: el cargo existió aunque el análisis
        se descartara.
      required: [total, corridas, porTipo, ultimas]
      properties:
        total: { type: number, description: 'USD' }
        corridas: { type: integer }
        porTipo:
          type: array
          items:
            type: object
            properties:
              tipo: { type: string }
              corridas: { type: integer }
              costo: { type: number }
        ultimas:
          type: array
          items: { $ref: '#/components/schemas/CorridaDTO' }
    PreflightEfe:
      type: object
      required: [fixtureId, nivel, faltantes, busquedasPrevistas, bloqueado, umbralFrio, costo, equipos, recomendaciones]
      properties:
        fixtureId: { type: integer }
        nivel:
          type: string
          enum: [caliente, tibio, frio]
          description: 'caliente = 0 faltantes (sin búsquedas); frio = por encima del umbral del candado'
        faltantes: { type: integer, description: 'campos que dispararán búsqueda web (los dos equipos sumados)' }
        busquedasPrevistas: { type: integer, description: 'min(3 + 2 × faltantes, SAD_EFE_BUSQUEDAS); 0 si no falta nada' }
        bloqueado: { type: boolean, description: 'true = el candado de análisis frío lo va a bloquear (hace falta permitirFrio)' }
        umbralFrio: { type: integer, description: 'SAD_EFE_MAX_FALTANTES' }
        costo: { $ref: '#/components/schemas/CostoPreflight' }
        gasto: { $ref: '#/components/schemas/GastoFixture' }
        yaExiste: { type: boolean, description: 'true = ya hay EFE guardado para este fixture: verlo cuesta 0' }
        demo: { type: boolean, description: 'true = modo demo (SAD_EFE_DEMO): no se gasta nada' }
        equipos:
          type: array
          items: { $ref: '#/components/schemas/EquipoPreflight' }
        recomendaciones:
          type: array
          description: Qué hacer para bajar el costo, ordenado por lo que más ahorra
          items: { type: string }
    AnalisisRegistro:
      type: object
      required: [tipo, fixtureId, estado, versionEfe, creadoEn, resultado]
      properties:
        tipo: { type: string, enum: [efe, dtp, matriz] }
        fixtureId: { type: integer }
        estado: { type: string, enum: [preliminar, confirmado], description: 'preliminar = XI provisional (T−24h); confirmado = XI oficial (T−40min)' }
        versionEfe: { type: string, description: 'versión del protocolo con la que se emitió (inmutable)' }
        creadoEn: { type: string, format: date-time }
        resultado: { type: object, description: 'JSON del esquema EFE_COMPARATIVO / DTP / MATRIZ_V2 (backend/analisis/esquemas.py)', additionalProperties: true }
    FixtureLive:
      type: object
      required: [fixtureId, estado, minuto, golesLocal, golesVisitante, cuotas, serie, eventos, actualizadoEn, coberturaLive, coberturaConsultadaEn, vip]
      properties:
        fixtureId: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoFixture' }
        minuto: { type: integer, nullable: true }
        golesLocal: { type: integer, nullable: true }
        golesVisitante: { type: integer, nullable: true }
        cuotas:
          type: array
          description: Última captura de cuotas en juego (mercados mapeables del contrato)
          items: { $ref: '#/components/schemas/CuotaLive' }
        serie:
          type: array
          description: Movimiento acumulado del partido, asc por captura (sin suspendidas)
          items: { $ref: '#/components/schemas/PuntoLive' }
        eventos:
          type: array
          description: Goles y tarjetas del partido, asc por minuto (de la ingesta en vivo/cierre)
          items: { $ref: '#/components/schemas/EventoLive' }
        actualizadoEn: { type: string, format: date-time, nullable: true, description: 'última captura live; null si nunca hubo' }
        coberturaLive:
          type: string
          enum: [con_datos, sin_datos, feed_ajeno, fallo, presupuesto, sin_consultar]
          description: >
            Por qué `cuotas` puede venir vacía, leído de odds_live_consultas para la liga de
            este fixture. `sin_consultar`: el ciclo NUNCA le pidió /odds/live a esta liga (no
            le tocó turno con el tope por ciclo, o la ingesta está apagada). `sin_datos`: se
            le pidió y el feed vino vacío. `feed_ajeno`: el feed trajo partidos pero ninguno
            nuestro — el filtro ?league= no devolvió lo pedido, y NO es falta de cobertura.
            `fallo`: la consulta se cayó (red, HTTP o errors de la API).
            `presupuesto`: el plan diario de API-Football está agotado — el ciclo en vivo no
            hace ni una request, así que la última ronda de la liga es vieja y no explica nada.
            Manda sobre el resto salvo que la liga sí tenga cuotas capturadas.
            `con_datos`: la última consulta trajo cuotas de esa liga. Ninguno de los cuatro
            primeros permite afirmar que la API no cubra la liga: solo `sin_datos` se acerca,
            y aun así puede ser un feed momentáneamente vacío.
        coberturaConsultadaEn: { type: string, format: date-time, nullable: true, description: 'cuándo se consultó /odds/live de esta liga por última vez; null si nunca' }
        vip: { type: boolean, description: 'partido marcado "sí o sí": entra al rescate por fixture aunque su liga sea menor y, con el plan agotado, al modo emergencia (clave que factura excedente). La marca caduca sola a las 8 h' }
    CuotaLive:
      type: object
      required: [mercado, seleccion, cuota, suspendida]
      properties:
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
        suspendida: { type: boolean, description: 'la casa no acepta apuestas a esta selección ahora' }
    PuntoLive:
      type: object
      required: [minuto, mercado, seleccion, cuota]
      properties:
        minuto: { type: integer, nullable: true }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
    CuotaCasa:
      type: object
      description: Cuota de UNA casa para una selección (última foto de la ingesta)
      required: [fixtureId, mercado, seleccion, casaId, casa, cuota, mejor]
      properties:
        fixtureId: { type: integer }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        casaId: { type: integer }
        casa: { type: string }
        cuota: { type: number }
        mejor: { type: boolean, description: 'true si es la cuota más alta de la selección' }
    CuotaSnapshot:
      type: object
      description: Un punto del movimiento prepartido (media entre casas en esa captura)
      required: [fixtureId, mercado, seleccion, cuota, capturadoEn]
      properties:
        fixtureId: { type: integer }
        mercado: { type: string, enum: [1x2, dc, ou, ah, btts] }
        seleccion: { type: string }
        cuota: { type: number }
        casas: { type: integer, description: 'nº de bookmakers promediados en la captura' }
        capturadoEn: { type: string, format: date-time }
    XiLado:
      type: object
      description: El once de un lado tal como se lee de la hoja o del pantallazo
      properties:
        once: { type: array, items: { type: string }, description: 'los 11 titulares' }
        banca: { type: array, items: { type: string } }
        formacion: { type: string }
        fuente: { type: string, description: 'pantallazo BeSoccer, rueda de prensa, cuenta oficial…' }
    JugadorParte:
      type: object
      description: Una fila de la tabla F1. Sin zona o sin rol no entra (no pesaría en ninguna fórmula).
      required: [nombre, zona, rol]
      properties:
        nombre: { type: string }
        posicion: { type: string }
        zona: { type: string, enum: [GK, DEF, MID, ATK] }
        rol: { type: string, enum: [TF, TH, ROT, SUP], description: 'TF 🔴×3 · TH 🟠×2 · ROT 🟡×1 · SUP ⚪×0.5' }
        apps: { type: string, description: 'titularidades, ej. "12/15"' }
        estado: { type: string, enum: ['', disponible, baja, duda], description: 'lo pone el backend al resolver el once' }
        motivo: { type: string }
    EquipoParteEntrada:
      type: object
      description: Lo que Cowork escribe de un equipo. a = local, b = visitante.
      properties:
        nombre: { type: string, description: 'opcional; si no casa con el fixture se declara la discrepancia' }
        bloques:
          type: object
          description: 'sub-scores CRUDOS del protocolo (A ≤4, B ≤6, C ≤4, D ≤4, E ≤3); el ponderado lo calcula el backend'
          properties:
            A: { type: number }
            B: { type: number }
            C: { type: number }
            D: { type: number }
            E: { type: number }
        excluidos:
          type: object
          description: 'letra → motivo; un bloque excluido no suma ni al total ni al máximo'
          additionalProperties: { type: string }
        notas:
          type: object
          description: 'letra → una línea justificando el sub-score'
          additionalProperties: { type: string }
        dt:
          type: object
          properties:
            nombre: { type: string }
            meses: { type: number }
        perfil:
          type: object
          properties:
            sistema: { type: string }
            estilo: { type: string }
            fortaleza: { type: string }
            vulnerabilidad: { type: string }
        plantel:
          type: array
          description: 'los 14-16 jugadores relevantes (tabla F1), SIN estado'
          items: { $ref: '#/components/schemas/JugadorParte' }
        fuera:
          type: array
          description: >
            Lo que ya es público la noche anterior: lesiones largas, sanciones, selección.
            OJO: una baja que no esté también en `plantel` NO pesa en el Impacto Ponderado
            (no tiene rol con el que pesar). Ponla en `plantel`, o dale `zona` y `rol` aquí
            y el backend la incorpora a la tabla F1 marcada como `soloBaja`.
          items:
            type: object
            properties:
              nombre: { type: string }
              estado: { type: string, enum: [baja, duda] }
              motivo: { type: string }
              zona: { type: string, description: 'necesario si no está en `plantel`' }
              rol: { type: string, description: 'necesario si no está en `plantel`' }
        factorX:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              contexto: { type: string }
        sensibilidad:
          type: array
          description: 'caja de sensibilidad: qué cambiaría si el dato que falta fuera otro'
          items:
            type: object
            properties:
              supuesto: { type: string }
              efecto: { type: string }
    LecturaSadParte:
      type: object
      description: El juicio que cierra el EFE. No se puede calcular; por eso lo escribe Cowork.
      properties:
        moduloOperativo: { type: string }
        unXDos:
          type: object
          properties:
            texto: { type: string }
            rangoAmpliado: { type: boolean, description: '±10% por FACTOR-X' }
        contextoEmocional: { type: string }
        datoEstructural: { type: string }
        paradoja: { type: string, description: '"" si no hay paradoja' }
        reventon: { type: string, description: 'la LECTURA de Cowork del reventón de la burbuja (docs/REVENTON.md): una línea por equipo, qué racha no se recomienda seguir y por qué. Los números no se copian' }
        reventonCalculado:
          type: object
          nullable: true
          readOnly: true
          description: 'solo en el GET: el reventón de cada lado con este partido como próximo, familia total, calculado al leer (docs/REVENTON.md). error si no se pudo calcular'
          properties:
            a: { $ref: '#/components/schemas/ReventonLado' }
            b: { $ref: '#/components/schemas/ReventonLado' }
    ReventonLado:
      type: object
      required: [actual, riesgo, rival, extremo, estabilidad, partidos, aviso]
      properties:
        actual: { type: object, nullable: true, description: 'la burbuja abierta (signo, k, partidos, kPico, desde, aplicaAlProximo)' }
        riesgo: { type: object, nullable: true, description: 'nivel, puntos, motivos, confianza, confianzaMotivos' }
        rival: { type: object, nullable: true, description: 'nivelProximo, medianaReventon, distancia, enZona, tramo' }
        extremo: { $ref: '#/components/schemas/ExtremoBurbuja', nullable: true, description: 'la alerta de extremo de la familia total; activa ⇒ el parte trae la alerta K-EXTREMO' }
        estabilidad: { type: string, enum: [estable, en transición, inestable, sin dato] }
        partidos: { type: integer }
        aviso: { type: string }
        error: { type: string }
    BloqueTde:
      type: object
      description: >
        El TDE de UN equipo. Los NIVELES (ieNivel/iseNivel) llegan del skill: el backend no
        pone umbrales a una escala que vive en otro lado, y sin nivel la pantalla pinta el
        número en neutro.
      properties:
        ie: { type: number, description: 'Índice de Echada' }
        ieNivel: { type: string, enum: [verde, ambar, rojo, ''] }
        ise: { type: number, description: 'Índice de Sobreexposición' }
        iseNivel: { type: string, enum: [verde, ambar, rojo, ''] }
        equipo: { type: string, enum: [a, b, ''], description: 'de quién se estima' }
        tipologia: { type: string, description: 'la causa modal entre las seis tipologías' }
        ventana: { type: string, description: "la ventana de 15 minutos, ej. \"75-90'\"" }
        disciplina43: { type: boolean, description: 'true = se declaran las dos vías por separado' }
        vias:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              indice: { type: number }
              ventana: { type: string }
              detalle: { type: string }
        falsador: { type: string }
        calculado:
          type: object
          description: 'el índice CALCULADO con sus compuertas (solo en la respuesta)'
          additionalProperties: true
        declarado:
          type: object
          description: 'el ie/ise que llegó escrito, para poder contrastarlo'
          additionalProperties: true
        discrepancia:
          type: array
          description: 'diferencias entre lo declarado y la cuenta; vacío es lo normal'
          items: { type: string }
    TdeParte:
      type: object
      description: >
        Teorema del Echado del partido. El índice es POR EQUIPO, así que el parte guarda
        una LISTA: hasta un bloque por lado. Antes guardaba uno solo y el del otro equipo
        terminaba en `notas` —prosa que no se puede consultar ni medir—.
      properties:
        bloques:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/BloqueTde' }
    TdeEntrada:
      description: >
        Al depositar se aceptan cuatro formas y todas se guardan igual, en `bloques`:
        la canónica `{"bloques": [...]}` (que es lo que devuelve el GET, para poder
        re-depositar la respuesta tal cual), un objeto plano con `equipo` adentro,
        `{"a": {...}, "b": {...}}` como los equipos, y una lista de bloques. Dos bloques
        para el mismo lado se rechazan: no se elige uno en silencio.
      oneOf:
        - $ref: '#/components/schemas/TdeParte'
        - $ref: '#/components/schemas/BloqueTde'
        - type: object
          properties:
            a: { $ref: '#/components/schemas/BloqueTde' }
            b: { $ref: '#/components/schemas/BloqueTde' }
        - type: array
          items: { $ref: '#/components/schemas/BloqueTde' }
    EventoTimelineParte:
      type: object
      description: >
        Evento INSTITUCIONAL del timeline. Los partidos NO entran por aquí: el marcador,
        la jornada y el enfrentamiento directo los calcula backend/cronologia.py de
        nuestra base, y un evento de tipo resultado/derrota/empate se descarta al normalizar.
      required: [fecha, titulo, tipo]
      properties:
        fecha: { type: string, description: 'YYYY-MM-DD, o ~YYYY-MM si es aproximada' }
        aproximada: { type: boolean }
        equipo: { type: string, description: 'nombre del equipo, o "ambos"' }
        tipo: { type: string, enum: [institucional, tecnico, sancion, hito] }
        titulo: { type: string }
        detalle: { type: string }
        destacado: { type: boolean }
        alertaRelacionada: { type: string }
        fuente: { type: string }
    ParteCoworkEntrada:
      type: object
      required: [fixtureId, equipos]
      properties:
        fixtureId: { type: integer, description: 'de /analisis/cowork/agenda' }
        version: { type: string, default: cowork/1 }
        generadoEn: { type: string }
        equipos:
          type: object
          properties:
            a: { $ref: '#/components/schemas/EquipoParteEntrada' }
            b: { $ref: '#/components/schemas/EquipoParteEntrada' }
        alertas:
          type: array
          items: { $ref: '#/components/schemas/AlertaParte' }
        matchup:
          type: object
          properties:
            diagnostico: { type: string, enum: [FAVORABLE, NEUTRO, DESFAVORABLE] }
            favorece: { type: string, enum: [a, b, ''] }
            razon: { type: string }
            h2a: { type: string, enum: [verde, ambar, rojo, na] }
            h2b: { type: string, enum: [verde, ambar, rojo, na] }
            h2c: { type: string, enum: [verde, ambar, rojo, na] }
        lecturaSad: { $ref: '#/components/schemas/LecturaSadParte' }
        tde: { $ref: '#/components/schemas/TdeEntrada' }
        timelineEventos:
          type: array
          description: 'solo lo institucional; los partidos los pone el backend'
          items: { $ref: '#/components/schemas/EventoTimelineParte' }
        timelineNarrativa: { type: string }
        cadena:
          type: object
          description: >
            El pronóstico clave por equipo foco. Entra en cadena_dtp (la película del
            equipo, página de Equipo) como APERTURA: el veredicto lo emite después quien
            cierre el eslabón, que es lo que lo hace auditable.
          properties:
            a: { type: object, properties: { pronostico: { type: string } } }
            b: { type: object, properties: { pronostico: { type: string } } }
        pronostico: { $ref: '#/components/schemas/PronosticoParte' }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/DocumentoParte' }
        pendientes: { type: array, items: { type: string } }
        fuentes: { type: array, items: { type: string } }
        descartados: { type: array, items: { type: string } }
        notas: { type: string }
        entrada:
          type: object
          description: >
            El eco que devuelve el GET, aceptado TAL CUAL. Corregir un parte es leer →
            modificar → re-depositar, así que el cuerpo del POST puede ser la respuesta
            del GET sin desarmar: `entrada` se desempaqueta aquí dentro y lo que venga
            suelto en la raíz manda sobre lo que traiga este bloque. Lo calculado que
            también vuelve en la lectura (partido, estado, equipos[].total, timeline,
            veredicto, xi…) se ignora en silencio: no es un campo desconocido, es
            nuestra propia respuesta.
          properties:
            timelineEventos:
              type: array
              items: { $ref: '#/components/schemas/EventoTimelineParte' }
            timelineNarrativa: { type: string }
            cadena: { type: object, additionalProperties: true }
            descartados: { type: array, items: { type: string } }
    AlertaParte:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string, description: 'T.54, R-KT.2, GK-DOWNGRADE, F3…' }
        equipo: { type: string, enum: [a, b, ambos, global] }
        tipo: { type: string, enum: [estructural, fecha] }
        detalle: { type: string, description: '`texto` se acepta como alias' }
    PronosticoParte:
      type: object
      description: Las tres fuentes van declaradas en simultáneo (Disciplina 33); ninguna reemplaza a otra.
      properties:
        motor: { type: string }
        matriz: { type: string }
        mercado: { type: string }
        probabilidades:
          type: object
          properties:
            local: { type: number }
            empate: { type: number }
            visita: { type: number }
        marcador: { type: string }
        falsador: { type: string, description: 'la condición observable que declara fallado el pronóstico' }
    DocumentoParte:
      type: object
      required: [id, cuerpo]
      properties:
        id: { type: string, description: 'dtp, matriz, tde, ensayo, timeline, pendientes o el que sea' }
        titulo: { type: string }
        formato: { type: string, enum: [md, html, texto], default: md }
        cuerpo: { type: string }
    BloqueParte:
      type: object
      required: [score, max, peso, ponderado, topePonderado, excluido]
      properties:
        score: { type: number }
        max: { type: number }
        peso: { type: number }
        ponderado: { type: number, description: 'score × peso, calculado por el backend' }
        topePonderado: { type: number }
        excluido: { type: boolean }
        motivoExclusion: { type: string }
        declarado:
          type: boolean
          description: >
            false = nadie puntuó este bloque. Un hueco no es un cero: el eco del GET lo
            devuelve así y el POST lo respeta, para que re-depositar la respuesta no
            invente una nota que nunca existió.
        nota: { type: string }
    DisponibilidadParte:
      type: object
      description: >
        El bloque F. Con once resuelto trae ip/reduccion/f4; sin once trae las dos ramas
        pre-calculadas y `resuelto: false`. `conflicto` aparece cuando el once recibido no
        casa con la tabla: el bloque se queda congelado en vez de publicar un IP falso.
      required: [resuelto]
      properties:
        resuelto: { type: boolean }
        sinTabla: { type: boolean }
        fuente: { type: string }
        capturadoEn: { type: string }
        formacion: { type: string }
        nota: { type: string }
        conflicto: { type: string }
        ip: { type: number }
        ipNivel: { type: string, enum: [verde, ambar, rojo] }
        reduccion:
          type: object
          properties:
            GK: { type: number }
            DEF: { type: number }
            MID: { type: number }
            ATK: { type: number }
        reduccionNivel:
          type: object
          additionalProperties: { type: string, enum: [verde, ambar, rojo] }
        multiplicadorGk: { type: boolean }
        zonasCriticas: { type: array, items: { type: string } }
        fuera:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              zona: { type: string }
              rol: { type: string }
              estado: { type: string }
              motivo: { type: string }
              impacto: { type: number }
        f4:
          type: object
          properties:
            rotados: { type: integer }
            nombres: { type: array, items: { type: string } }
            diagnostico: { type: string }
        jugadores: { type: array, items: { $ref: '#/components/schemas/JugadorParte' } }
        dudas: { type: array, items: { type: string }, description: 'nombres que casan con más de un jugador: no se resuelven' }
        noReconocidos: { type: array, items: { type: string } }
        casados: { type: integer }
        once: { type: integer }
        ramas:
          type: object
          description: 'solo sin once: rama a = juegan todos los disponibles conocidos; rama b = además falta el 🔴 más pesado'
          additionalProperties: true
    EquipoParte:
      type: object
      description: El equipo tal como lo sirve el backend, con lo calculable ya calculado.
      required: [nombre, bloques, total, maximoAlcanzable, porcentaje, clasificacion, disponibilidad]
      properties:
        nombre: { type: string }
        bloques:
          type: object
          additionalProperties: { $ref: '#/components/schemas/BloqueParte' }
        total: { type: number }
        maximoAlcanzable: { type: number, description: '27 con bloque C, 23 sin él' }
        porcentaje:
          type: number
          nullable: true
          description: >
            null = el parte no trae NI UN sub-score. No es 0%: es que nadie puntuó, y
            pintarlo como 0 convierte una ausencia en el peor juicio de la rúbrica.
        clasificacion:
          type: string
          enum: [FORMADO, EN_FORMACION, SIN_FORMACION, '']
          description: "'' cuando no hay bloques declarados: no se clasifica lo que no se evaluó"
        sinBloques: { type: boolean, description: 'true = ni un sub-score declarado' }
        bloquesSinDeclarar:
          type: array
          description: 'letras que nadie puntuó: cuentan como 0 y arrastran el porcentaje'
          items: { type: string }
        notaTotales: { type: string }
        dt:
          type: object
          properties:
            nombre: { type: string }
            meses: { type: number }
        perfil:
          type: object
          additionalProperties: { type: string }
        plantel: { type: array, items: { $ref: '#/components/schemas/JugadorParte' } }
        fuera: { type: array, items: { type: object, additionalProperties: true } }
        factorX: { type: array, items: { type: object, additionalProperties: true } }
        sensibilidad: { type: array, items: { type: object, additionalProperties: true } }
        disponibilidad: { $ref: '#/components/schemas/DisponibilidadParte' }
    ParteCowork:
      type: object
      required: [fixtureId, estado, partido, equipos]
      properties:
        fixtureId: { type: integer }
        estado: { type: string, enum: [pendiente_xi, confirmado] }
        version: { type: string }
        partido:
          type: object
          properties:
            equipoA: { type: string }
            equipoB: { type: string }
            fecha: { type: string }
            equipoAId: { type: integer, description: 'para pedir el calendario del bloque G' }
            equipoBId: { type: integer }
        equipos:
          type: object
          properties:
            a: { $ref: '#/components/schemas/EquipoParte' }
            b: { $ref: '#/components/schemas/EquipoParte' }
        alertas: { type: array, items: { $ref: '#/components/schemas/AlertaParte' } }
        matchup:
          type: object
          additionalProperties: true
        lecturaSad: { $ref: '#/components/schemas/LecturaSadParte' }
        tde: { $ref: '#/components/schemas/TdeParte' }
        timeline:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            TimelineData listo para pintar: lo institucional del parte fundido con los
            partidos calculados. Se arma AL LEER, no al depositar, para que una corrección
            de la ingesta se refleje sin re-depositar nada.
        pronostico: { $ref: '#/components/schemas/PronosticoParte' }
        documentos: { type: array, items: { $ref: '#/components/schemas/DocumentoParte' } }
        pendientes: { type: array, items: { type: string } }
        fuentes: { type: array, items: { type: string } }
        notas: { type: string }
        xi:
          type: object
          description: 'el once guardado por lado (sin la banca), con su fuente'
          additionalProperties: true
        entrada:
          type: object
          description: >
            Eco de lo depositado que no se puede reconstruir desde el resto de la respuesta.
            El POST reemplaza el parte ENTERO, así que corregir algo es leer → modificar →
            re-depositar; sin este bloque ese viaje perdía los eventos del timeline, los
            pronósticos de la cadena y los descartados, en silencio.
          properties:
            timelineEventos: { type: array, items: { $ref: '#/components/schemas/EventoTimelineParte' } }
            timelineNarrativa: { type: string }
            cadena: { type: object, additionalProperties: { type: string } }
            descartados: { type: array, items: { type: string } }
        veredicto:
          nullable: true
          description: 'null mientras el caso no se haya cerrado'
          allOf: [{ $ref: '#/components/schemas/Veredicto' }]
        creadoEn: { type: string }
        actualizadoEn: { type: string }
    ReciboParte:
      type: object
      required: [fixtureId, partido, estado]
      properties:
        fixtureId: { type: integer }
        partido: { type: string, description: 'los nombres de NUESTRA base, no los del depósito' }
        fecha: { type: string }
        estado: { type: string, enum: [guardado, actualizado] }
        jugadores:
          type: object
          properties:
            a: { type: integer }
            b: { type: integer }
        documentos: { type: array, items: { type: string } }
        alertas: { type: integer }
        discrepancias:
          type: array
          items: { type: string }
          description: 'nombres que mandó Cowork y no casan con el fixture: se declaran, no se corrigen en silencio'
        xiResuelto: { type: boolean }
        rechazos:
          type: array
          description: >
            Lo que NO entró, con dónde estaba, por qué y qué se esperaba. Antes se
            descartaba en silencio y quien depositaba veía un 0 sin forma de saber por qué.
          items:
            type: object
            properties:
              donde: { type: string }
              jugador: { type: string }
              porque: { type: string }
              esperado: { type: string }
        perdido:
          type: array
          items: { type: string }
          description: 'campos que este depósito dejó con MENOS contenido del que había'
        aviso: { type: string, description: 'explicación del depósito destructivo; "" si no lo hubo' }
        eventosTimeline: { type: integer }
        cadena:
          type: array
          items: { type: string }
          description: 'equipos foco cuya cadena recibió el pronóstico'
        conLecturaSad: { type: boolean }
        conTde: { type: boolean }
        ladosTde:
          type: array
          description: 'de qué equipos quedó índice ("a", "b"); vacío = ninguno'
          items: { type: string }
    PartePendiente:
      type: object
      required: [fixtureId, partido, faltaXi]
      properties:
        fixtureId: { type: integer }
        fecha: { type: string }
        partido: { type: string }
        faltaXi: { type: array, items: { type: string, enum: [a, b] } }
        actualizadoEn: { type: string }
    AgendaItem:
      type: object
      required: [fixtureId, partido, prioridad, motivo]
      properties:
        fixtureId: { type: integer }
        hora: { type: string }
        partido: { type: string }
        equipoA: { type: string }
        equipoB: { type: string }
        liga: { type: string }
        pais: { type: string, nullable: true }
        prioridad: { type: integer, description: '1-5 del protocolo; 0 = descartado' }
        motivo: { type: string }
        etiquetas: { type: array, items: { type: string } }
        parte: { type: string, description: 'estado del parte ya depositado, "" si no hay' }
    AgendaCowork:
      type: object
      required: [fecha, analizar, enEspera, descartados]
      properties:
        fecha: { type: string, format: date }
        ventana: { type: string, description: 'qué rango se miró (día natural o ventana rodante)' }
        filtro:
          type: object
          description: 'los mandos manuales tal como se aplicaron'
          properties:
            ligaId: { type: integer, nullable: true }
            liga: { type: string, nullable: true, description: 'el texto pedido' }
            ligasQueCasan: { type: array, items: { type: integer }, nullable: true, description: 'ids del padrón que casaron con `liga`; [] = ninguna' }
            desdeAhora: { type: boolean }
            horas: { type: integer, nullable: true }
            grupos: { type: boolean }
            segundas: { type: boolean }
            incluirDescartados: { type: boolean }
            manual: { type: boolean, description: 'true si se usó algún mando' }
        notaSeleccion:
          type: string
          description: >
            Si el caso sigue siendo `ciega` al escribir el veredicto. Un filtro puesto ANTES
            del pitazo (una liga, una ventana) es selección ex ante y no contamina; lo que
            contamina es elegir un partido PORQUE pasó algo en él.
        corte:
          type: object
          description: >
            Qué se quedó fuera SOLO por el límite, y de qué prioridad. Con `limite=4` y
            cuatro llaves internacionales el mismo día, una jornada entera de LaLiga no
            entra — y desde afuera parece que la liga no está cubierta.
          additionalProperties: true
        analizar: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } }
        enEspera: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } }
        descartados: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } }
        nota: { type: string }
    LatidoCowork:
      type: object
      required: [estado, porque, depositadosEnLaVentana, coberturaDeAyer]
      properties:
        estado: { type: string, enum: [verde, ambar, rojo] }
        porque:
          type: array
          description: 'los motivos en castellano; con todo al día, una sola línea'
          items: { type: string }
        ahora: { type: string }
        ventanaHoras: { type: integer }
        depositadosEnLaVentana: { type: integer }
        horasDesdeElUltimo: { type: number, nullable: true }
        ultimoParte: { type: object, nullable: true, additionalProperties: true }
        coberturaDeAyer:
          type: object
          description: >
            Lo que la agenda de ayer habría elegido contra lo que tiene parte. Es la señal
            que delata que el batch no corrió y que NO se puede deducir mirando solo los
            partes depositados.
          additionalProperties: true
        sinCerrar: { type: integer }
        veredictosVencidos: { type: array, items: { type: object, additionalProperties: true } }
        sinOnceCerrado: { type: array, items: { type: object, additionalProperties: true } }
        nota: { type: string }
    FichaTde:
      type: object
      description: Insumos del TDE calculados desde nuestra base. NO incluye el IE.
      properties:
        fixtureId: { type: integer }
        partido: { type: object, additionalProperties: true }
        p1a:
          type: object
          description: >
            Rol de protector del resultado, por μ del partido y nada más. `score` da 1 al
            favorito y 0 al otro cuando el margen supera el umbral; 0.5 a los dos si están
            dentro. `puedeBajar` recuerda lo único que el backend no puede saber: que un
            equipo esté obligado a ganar lleva P1a a 0.
          additionalProperties: true
        f1:
          type: object
          description: >
            Rotación en los últimos 3 partidos, por lado. Cuidado con el sentido de la
            rúbrica: 0 rotados puntúa 1 (mismo once = carga acumulada). Sin dos onces
            capturados devuelve `sinDato`, nunca un número inventado.
          additionalProperties: true
        f2:
          type: object
          description: 'Descanso antes y exigencia después, por lado. Devuelve `scorePiso`.'
          additionalProperties: true
        fiabilidadMu: { type: object, additionalProperties: true }
        nivelDeDato:
          type: string
          enum: [B, C]
          description: 'el nivel A del skill (tracking) es imposible con nuestras fuentes'
        noCalculables:
          type: array
          description: 'los indicadores que siguen siendo juicio, con el motivo de cada uno'
          items:
            type: object
            properties:
              indicador: { type: string }
              porque: { type: string }
    SobrePendientes:
      type: object
      required: [ventanaHoras, criterio, sinCerrar, pendientes, noListados]
      properties:
        ventanaHoras: { type: integer }
        ahora: { type: string, description: 'reloj del servidor, para fechar la corrida' }
        criterio: { type: string, description: 'el filtro en castellano, con el sentido de `horas`' }
        sinCerrar: { type: integer, description: 'partes sin veredicto en total, entren o no a la lista' }
        nota: { type: string, description: 'solo cuando `pendientes` viene vacío: por qué' }
        pendientes:
          type: array
          items: { $ref: '#/components/schemas/VeredictoPendiente' }
        noListados:
          type: array
          description: >
            Los partes sin veredicto que NO entraron, con su motivo. Es lo que convierte un
            resultado vacío en una respuesta. Tope de 20.
          items: { $ref: '#/components/schemas/PendienteNoListado' }
    PendienteNoListado:
      type: object
      properties:
        fixtureId: { type: integer }
        partido: { type: string }
        fecha: { type: string }
        estado: { type: string, description: '«2do tiempo, minuto 67, 1-0», «PST», …' }
        porque: { type: string, description: 'el motivo, en castellano' }
    VeredictoPendiente:
      type: object
      required: [fixtureId, partido, marcador]
      properties:
        fixtureId: { type: integer }
        fecha: { type: string }
        partido: { type: string }
        marcador: { type: string, description: 'a 90 minutos, de nuestra ingesta' }
        jugadoEn: { type: string }
    LadoVeredicto:
      type: object
      properties:
        veredicto: { type: string, enum: [acierto, parcial, fallo] }
        queP: { type: string, description: 'qué pasó, en una frase' }
        leccion: { type: string }
        skill: { type: string, description: 'a qué skill le toca la lección' }
        reglaTocada: { type: string }
    VeredictoEntrada:
      type: object
      description: >
        La respuesta del GET se puede re-depositar tal cual: `acredita`, `falsador`,
        `rechazos`, `cerradoEn`, `actualizadoEn`, `objetivo` y `sinPronosticoPrevio` son
        eco de lo calculado y se ignoran en silencio, no se rechazan.


        Una clave AUSENTE conserva lo que ya había: `falsadorCumplido` que no viaja no
        borra el `false` guardado. Para borrarlo hay que mandar `falsadorCumplido: null`
        a propósito.
      required: [seleccion, modoEvaluacion, porLado]
      properties:
        seleccion:
          type: string
          enum: [ciega, por_resultado, post_resultado]
          description: >
            La población del caso, y NO se puede deducir desde el backend. `ciega` = el
            partido se eligió sin saber nada (el parte de Cowork nace así, de la agenda);
            `por_resultado` = se eligió porque pasó algo; `post_resultado` = se puntuó con
            el marcador ya a la vista. Solo ciega + PRE acredita validación predictiva: las
            otras fijan rúbrica pero no acreditan (docs/APRENDIZAJE.md).
        modoEvaluacion:
          type: string
          enum: [PRE, COND]
          description: >
            Contra qué se puntuó, no cuánto vio quien puntúa. PRE = el caso se cerró contra
            el resultado FINAL; COND = contra un marcador parcial, con el partido rodando,
            así que el acierto es condicional. Todo veredicto se escribe después del partido
            y eso no lo vuelve COND. Declarar PRE sobre un fixture que no figura terminado
            devuelve 422: es comprobable contra nuestra base y se comprueba.
        mancha:
          type: string
          description: >
            Salvedad sobre un caso que SÍ acredita: algo que contar aunque no cambie la
            población. Por ejemplo, el parte se retocó con el partido rodando pero el
            pronóstico no se tocó, o la alineación llegó por un pantallazo sin sellar.
            Va en campo propio y no en `notas` porque una salvedad que solo se encuentra
            leyendo prosa no se encuentra: la pantalla la marca junto a la etiqueta de
            población y una auditoría posterior puede filtrarla.
        falsadorCumplido:
          type: boolean
          nullable: true
          description: >
            ¿OCURRIÓ LA CONDICIÓN del falsador? — no "¿acertó el falsador?". El falsador es
            «la condición observable que declara fallado el pronóstico»; `true` = esa
            condición se dio, `false` = no se dio, `null` = no es comprobable contra la
            evidencia que sirve el backend. La combinación interesante es `true` con el
            pronóstico igualmente acertado: el falsador era malo, y eso es una lección
            sobre el falsador mismo. Leído al revés el campo se vuelve redundante con
            `unXDos.acerto` y no aporta nada.


            Lo declara quien lo comprobó: el falsador es prosa y el backend no verifica
            prosa arbitraria: sirve la evidencia (los goles con su minuto y su lado) y deja
            el juicio fuera.
        porLado:
          type: object
          properties:
            a: { $ref: '#/components/schemas/LadoVeredicto' }
            b: { $ref: '#/components/schemas/LadoVeredicto' }
        notas: { type: string }
    VeredictoObjetivo:
      type: object
      description: Lo que la base responde sola. Se RECALCULA en cada lectura, no se sella.
      properties:
        jugado: { type: boolean }
        motivo: { type: string, description: 'por qué no se pudo calcular' }
        marcador:
          type: object
          properties:
            local: { type: integer }
            visitante: { type: integer }
            texto: { type: string }
            ganador: { type: string, enum: [a, b, empate] }
            terminado: { type: boolean, description: 'false = en curso; el marcador no es un resultado' }
        unXDos:
          type: object
          properties:
            declarado: { type: string, description: 'vacío si no hubo 1X2 o si dos selecciones empataron' }
            real: { type: string, enum: [local, empate, visita] }
            acerto: { type: boolean }
            probabilidadDeclarada: { type: number }
            reparto: { type: object, additionalProperties: { type: number } }
            nota: { type: string }
        marcadorExacto:
          type: object
          properties:
            declarado: { type: string }
            real: { type: string }
            acerto: { type: boolean }
        brier:
          type: object
          properties:
            valor: { type: number, nullable: true }
            escala: { type: string, description: '0 perfecto, 2 máximo, TRES resultados: no comparable con un Brier binario' }
        tde:
          type: object
          description: >
            Una comprobación POR BLOQUE declarado: la echada de cada equipo se observa en
            los goles que RECIBE, así que con dos bloques hay dos ventanas y dos veredictos.
          properties:
            bloques:
              type: array
              items:
                type: object
                properties:
                  ventana: { type: string }
                  desde: { type: integer }
                  hasta: { type: integer }
                  equipo: { type: string, enum: [a, b, ''] }
                  comprobable: { type: boolean }
                  golEnVentana: { type: boolean, nullable: true }
                  goles: { type: array, items: { type: object, additionalProperties: true } }
                  nota: { type: string }
        evidencia:
          type: object
          properties:
            goles:
              type: array
              items:
                type: object
                properties:
                  minuto: { type: integer }
                  lado: { type: string, enum: [a, b] }
                  jugador: { type: string }
                  autogol: { type: boolean }
            primerGol: { type: object, nullable: true, additionalProperties: true }
            conFicha: { type: boolean }
            nota: { type: string }
    Veredicto:
      type: object
      properties:
        fixtureId: { type: integer }
        seleccion: { type: string, enum: [ciega, por_resultado, post_resultado] }
        modoEvaluacion: { type: string, enum: [PRE, COND] }
        acredita: { type: boolean, description: 'ciega + PRE, y solo eso' }
        mancha: { type: string, description: 'salvedad declarada sobre un caso que acredita; vacía casi siempre' }
        falsador:
          type: object
          properties:
            texto: { type: string }
            cumplido: { type: boolean, nullable: true }
        porLado:
          type: object
          additionalProperties: { $ref: '#/components/schemas/LadoVeredicto' }
        notas: { type: string }
        cerradoEn:
          type: string
          description: >
            Cuándo se cerró el caso POR PRIMERA VEZ. Es evidencia, no un `updated_at`: con
            esa fecha se comprueba que el juicio se escribió cuando se dice. Un re-depósito
            NO la re-sella.
        actualizadoEn:
          type: string
          description: "'' si el caso solo se cerró una vez; con fecha si se corrigió después"
        objetivo: { $ref: '#/components/schemas/VeredictoObjetivo' }
        sinPronosticoPrevio:
          type: array
          items: { type: string }
          description: 'equipos cuyo eslabón no recibió veredicto por no tener pronóstico declarado'
