    AgendaItem:
      type: object
      required: [fixtureId, partido, prioridad, motivo]
      properties:
        fixtureId: { type: integer }
        hora: { type: string }
        fecha: { type: string, description: 'día del partido (UTC)' }
        rehacer: { type: string, description: 'no vacío si el parte guardado es de OTRA fecha del partido (aplazado o movido más de un día): vuelve a porHacer y se rehace entero (incidencia 371)' }
        partido: { type: string }
        equipoA: { type: string }
        equipoB: { type: string }
        dt:
          type: object
          description: >
            El DT que tiene la base por lado, con su edad y su procedencia. ES UNA ALARMA, NO
            LA VERDAD: si la prensa de la semana dice otro, manda la prensa; el registro se
            refresca solo en la próxima corrida (DT de la agenda: alineación del último partido
            + /coachs). `fiable` = visto en el banco en el último partido, o registro de menos
            de 14 días; si no, `nota` pide confirmarlo en prensa.
          additionalProperties:
            type: object
            nullable: true
            properties:
              nombre: { type: string, nullable: true }
              desde: { type: string, nullable: true }
              actualizadoEn: { type: string, nullable: true }
              fuente: { type: string, enum: [coachs, alineacion] }
              edadDias: { type: integer, nullable: true }
              fiable: { type: boolean }
              desdeConfirmar: { type: boolean, description: "la fecha de llegada de la base no es dato (mes de la carrera de /coachs o llegada no vista): confirmar en prensa antes de puntuar el bloque A" }
              desdeNota: { type: string }
              nota: { type: string }
              expulsado:
                type: object
                description: 'el DT viene de una roja en el último partido de esta competición (backend/sanciones.py, `cuerpoTecnico`): no se sienta hoy; el parte lo declara en `dt.banco`'
                properties: { nombre: { type: string }, fecha: { type: string }, detalle: { type: string } }
        liga: { type: string }
        pais: { type: string, nullable: true }
        prioridad: { type: integer, description: '1-5 del protocolo; 0 = descartado' }
        motivo: { type: string }
        etiquetas: { type: array, items: { type: string } }
        etiquetasDe: { type: string, enum: [b], description: 'las etiquetas se calculan sobre el visitante como rival del local: son de ese lado' }
        etiquetasEquipo: { type: string, description: 'el nombre del equipo al que pertenecen las etiquetas (el visitante)' }
        parte: { type: string, description: 'estado del parte ya depositado, "" si no hay' }
    AgendaCowork:
      type: object
      required: [fecha, analizar, enEspera, descartados]
      properties:
        fecha: { type: string, format: date }
        ventana: { type: string, description: 'qué rango se miró (día natural o ventana rodante)' }
        filtro:
          type: object
          description: 'los mandos manuales tal como se aplicaron'
          properties:
            ligaId: { type: integer, nullable: true }
            liga: { type: string, nullable: true, description: 'el texto pedido' }
            ligasQueCasan: { type: array, items: { type: integer }, nullable: true, description: 'ids del padrón que casaron con `liga`; [] = ninguna' }
            desdeAhora: { type: boolean }
            horas: { type: integer, nullable: true }
            grupos: { type: boolean }
            segundas: { type: boolean }
            incluirDescartados: { type: boolean }
            manual: { type: boolean, description: 'true si se usó algún mando' }
        notaSeleccion:
          type: string
          description: >
            Si el caso sigue siendo `ciega` al escribir el veredicto. Un filtro puesto ANTES
            del pitazo (una liga, una ventana) es selección ex ante y no contamina; lo que
            contamina es elegir un partido PORQUE pasó algo en él.
        corte:
          type: object
          description: >
            Qué se quedó fuera SOLO por el límite, y de qué prioridad. Con `limite=4` y
            cuatro llaves internacionales el mismo día, una jornada entera de LaLiga no
            entra — y desde afuera parece que la liga no está cubierta.
          additionalProperties: true
        analizar: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } }
        enEspera: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } }
        descartados: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } }
        porHacer: { type: array, items: { type: integer }, description: 'los que faltan: sin parte, o con un parte de otra fecha (aRehacer)' }
        yaHechos: { type: array, items: { type: integer } }
        aRehacer: { type: object, additionalProperties: { type: string }, description: 'fixtureId → por qué el parte guardado no vale (el partido se movió más de un día desde que se depositó)' }
        nota: { type: string }
    RevisorDiario:
      type: object
      required: [modo, ventana, totales, partes, paraMirar]
      properties:
        modo: { type: string, enum: ['off', sombra, alertas], description: 'el modo vigente del revisor' }
        via: { type: string, description: 'host al que salen las preguntas hoy' }
        oficial: { type: boolean, description: 'false = intermediario no afiliado (SAD_JEV_ENDPOINT distinto del oficial)' }
        ventana:
          type: object
          properties:
            dia: { type: string, nullable: true }
            horas: { type: integer, nullable: true }
        totales:
          type: object
          properties:
            partesEvaluados: { type: integer, description: 'fixtures con al menos una evaluación real (no simulada, sin error)' }
            conHallazgos: { type: integer }
            limpios: { type: integer }
            corrigio: { type: integer }
            corrigioParte: { type: integer }
            sostuvo: { type: integer }
            sinReaccion: { type: integer }
            noEvaluados: { type: integer }
            evaluaciones: { type: integer, description: 'filas del registro en la ventana (un depósito = una evaluación)' }
            hallazgosPorCodigo: { type: object, additionalProperties: { type: integer } }
            sinConfianza: { type: integer, description: 'preguntas sin confianza suficiente en la última evaluación de cada parte' }
            tokensEntrada: { type: integer }
            costoUsd: { type: number }
            errores: { type: integer }
            porVia: { type: object, additionalProperties: { type: integer }, description: 'evaluaciones reales por host' }
        partes:
          type: array
          items:
            type: object
            properties:
              fixtureId: { type: integer }
              partido: { type: string }
              fecha: { type: string }
              reaccion: { type: string, enum: [limpio, corrigio, corrigioParte, sostuvo, sinReaccion, noEvaluado] }
              hallazgosEncontrados: { type: array, items: { type: string }, description: 'códigos de la primera evaluación con hallazgos' }
              hallazgosAhora: { type: array, items: { type: string }, description: 'códigos de la última evaluación' }
              evaluaciones:
                type: array
                items:
                  type: object
                  properties:
                    evaluadoEn: { type: string }
                    modo: { type: string }
                    preguntas: { type: integer }
                    hallazgos: { type: array, items: { type: string } }
                    sinConfianza: { type: integer }
                    simulado: { type: boolean }
                    error: { type: string, nullable: true }
                    redeposito: { type: boolean }
        paraMirar: { type: array, items: { type: integer }, description: 'fixtures con hallazgos que Cowork no corrigió (sinReaccion o sostuvo)' }
        nota: { type: string }
    LatidoCowork:
      type: object
      required: [estado, porque, depositadosEnLaVentana, coberturaDeAyer]
      properties:
        estado: { type: string, enum: [verde, ambar, rojo] }
        porque:
          type: array
          description: 'los motivos en castellano; con todo al día, una sola línea'
          items: { type: string }
        ahora: { type: string }
        ventanaHoras: { type: integer }
        depositadosEnLaVentana: { type: integer }
        horasDesdeElUltimo: { type: number, nullable: true }
        ultimoParte: { type: object, nullable: true, additionalProperties: true }
        coberturaDeAyer:
          type: object
          description: >
            TODOS los candidatos del padrón de ayer (no solo el cupo de una corrida) contra
            lo que tiene parte: `porcentaje` contra `meta` (0.80); por debajo, ámbar. Es la
            señal que delata que el batch no corrió o no alcanzó, y que NO se puede deducir
            mirando solo los partes depositados. `faltaron` lista hasta 25; `faltaronTotal`
            los cuenta todos.
          additionalProperties: true
        sinCerrar: { type: integer }
        veredictosVencidos: { type: array, items: { type: object, additionalProperties: true } }
        sinOnceCerrado: { type: array, items: { type: object, additionalProperties: true } }
        cuotasPrepartido:
          type: object
          description: >
            ¿Entran las cuotas prepartido? De los NS de las próximas `ventanaHoras`, cuántos
            tienen alguna captura y cuándo fue la última. Con 10 o más próximos y ninguno con
            cuota, `alarma` trae el motivo y el latido pasa a ámbar (deuda 8: tres semanas
            sin cuotas sin que nadie lo viera).
          properties:
            ventanaHoras: { type: integer }
            proximos: { type: integer }
            conCuota: { type: integer }
            ultimaCaptura: { type: string, nullable: true }
            alarma: { type: string }
        incidencias:
          type: object
          nullable: true
          description: 'lo que las corridas vieron roto y sigue sin resolver (GET /analisis/cowork/incidencias); con alguna que bloquea, el latido pasa a ámbar'
          properties:
            abiertas: { type: integer }
            bloquean: { type: integer }
            masVieja: { type: string, nullable: true }
            esperanAlUsuario: { type: integer }
            aprobadas: { type: integer, description: 'decididas por el usuario, esperando al mantenimiento' }
            porDesplegar: { type: integer, description: 'con PR mergeado que producción todavía no corre' }
        presupuestoApi:
          type: object
          description: >
            El plan diario de API-Football, leído del marcador de la ingesta (0 requests):
            `hoy` y `ayer` con lo usado, el consumo por endpoint (de mayor a menor) y por hora
            UTC, y cuándo tocó el tope (`agotadoEn` UTC, `agotadoEnLima`). Si hoy o ayer se
            agotó antes de las 22:00 UTC, `alarma` trae el motivo y el latido pasa a ámbar: el
            11/10/2026 se agotó a las 12:40 de Lima y la tarde sudamericana se quedó sin cuotas
            en juego. Sin marcador, `hoy` y `ayer` son null.
          properties:
            hoy: { $ref: '#/components/schemas/PresupuestoDia' }
            ayer: { $ref: '#/components/schemas/PresupuestoDia' }
            alarma: { type: string }
        nota: { type: string }
    BancoDesmentido:
      type: object
      description: 'por lado (a/b): el banco de la API que se desmintió y la fuente que lo prueba'
      additionalProperties:
        type: object
        properties:
          bancoDeLaApi: { type: string }
          dtDelParte: { type: string }
          fuente: { type: string }
          nota: { type: string }
          puestoEn: { type: string }
    PresupuestoDia:
      type: object
      nullable: true
      properties:
        dia: { type: string, nullable: true }
        usadas: { type: integer }
        limite: { type: integer, nullable: true }
        porEndpoint: { type: object, additionalProperties: { type: integer } }
        porHora: { type: object, additionalProperties: { type: integer } }
        agotadoEn: { type: string, nullable: true }
        agotadoEnLima: { type: string, nullable: true }
    FichaTde:
      type: object
      description: Insumos del TDE calculados desde nuestra base. NO incluye el IE.
      properties:
        fixtureId: { type: integer }
        partido: { type: object, additionalProperties: true }
        p1a:
          type: object
          description: >
            Rol de protector del resultado, por μ del partido y nada más. `score` da 1 al
            favorito y 0 al otro cuando el margen supera el umbral; 0.5 a los dos si están
            dentro. `puedeBajar` recuerda lo único que el backend no puede saber: que un
            equipo esté obligado a ganar lleva P1a a 0.
          additionalProperties: true
        f1:
          type: object
          description: >
            Rotación en los últimos 3 partidos, por lado. Cuidado con el sentido de la
            rúbrica: 0 rotados puntúa 1 (mismo once = carga acumulada). Sin dos onces
            capturados devuelve `sinDato`, nunca un número inventado.
          additionalProperties: true
        f2:
          type: object
          description: 'Descanso antes y exigencia después, por lado. Devuelve `scorePiso`.'
          additionalProperties: true
        fiabilidadMu: { type: object, additionalProperties: true }
        nivelDeDato:
          type: string
          enum: [B, C]
          description: 'el nivel A del skill (tracking) es imposible con nuestras fuentes'
        noCalculables:
          type: array
          description: 'los indicadores que siguen siendo juicio, con el motivo de cada uno'
          items:
            type: object
            properties:
              indicador: { type: string }
              porque: { type: string }
        referencias:
          type: object
          description: 'TDE v0.1.24: referencias calculadas de la base. REFERENCIA, no peso'
          properties:
            ventajaPorMinuto:
              type: object
              description: >
                Disciplina 66: el que marcó primero, cuántas veces no perdió y ganó a los 90' según
                el minuto de ese gol, sobre los partidos con ficha de eventos ANTERIORES al día del
                partido (el añadido cae en su tiempo; la prórroga no cuenta). Sin n no hay tasa.
              properties:
                partidos: { type: integer }
                antesDe: { type: string }
                nota: { type: string }
                tramos:
                  type: array
                  items:
                    type: object
                    properties:
                      tramo: { type: string, enum: ["≤15'", "16-30'", "31-45+'", "46-60'", "61-75'", "76'+"] }
                      n: { type: integer }
                      noPierde: { type: integer }
                      gana: { type: integer }
                      tasaNoPierde: { type: number, nullable: true }
                      intervaloNoPierde: { type: array, nullable: true, items: { type: number } }
                      tasaGana: { type: number, nullable: true }
    SobrePendientes:
      type: object
      required: [ventanaHoras, criterio, sinCerrar, pendientes, noListados]
      properties:
        ventanaHoras: { type: integer }
        ahora: { type: string, description: 'reloj del servidor, para fechar la corrida' }
        criterio: { type: string, description: 'el filtro en castellano, con el sentido de `horas`' }
        sinCerrar: { type: integer, description: 'partes sin veredicto en total, entren o no a la lista' }
        nota: { type: string, description: 'solo cuando `pendientes` viene vacío: por qué' }
        pendientes:
          type: array
          items: { $ref: '#/components/schemas/VeredictoPendiente' }
        noListados:
          type: array
          description: >
            Los partes sin veredicto que NO entraron, con su motivo. Es lo que convierte un
            resultado vacío en una respuesta. Tope de 20.
          items: { $ref: '#/components/schemas/PendienteNoListado' }
    PendienteNoListado:
      type: object
      properties:
        fixtureId: { type: integer }
        partido: { type: string }
        fecha: { type: string }
        estado: { type: string, description: '«2do tiempo, minuto 67, 1-0», «PST», …' }
        porque: { type: string, description: 'el motivo, en castellano' }
    VeredictoPendiente:
      type: object
      required: [fixtureId, partido, marcador]
      properties:
        fixtureId: { type: integer }
        fecha: { type: string }
        partido: { type: string }
        marcador: { type: string, description: 'a 90 minutos, de nuestra ingesta' }
        jugadoEn: { type: string }
    LadoVeredicto:
      type: object
      properties:
        veredicto: { type: string, enum: [acierto, parcial, fallo] }
        queP: { type: string, description: 'qué pasó, en una frase' }
        leccion: { type: string }
        skill: { type: string, description: 'a qué skill le toca la lección' }
        reglaTocada: { type: string }
        escenario:
          type: object
          description: '¿apareció lo que la matriz escribió para el escenario jugado (la palanca, el gatillo)? Observación para la autopsia, sin tasa'
          properties:
            aparecio: { type: string, enum: [si, parcial, 'no', ''] }
            que: { type: string }
        cortes:
          type: array
          description: 'por qué se cortó cada burbuja de objetivo.otrasFamilias marcada porExplicar. `mecanismo` de la lista cerrada del estudio de reventones (fuera de ella se rechaza con motivo y queda «otro»); `familia` fuera de las narradas se rechaza'
          items:
            type: object
            properties:
              familia: { type: string }
              ambito: { type: string, enum: [local, visita, total] }
              mecanismo: { type: string }
              porque: { type: string }
        otrasLecciones:
          type: array
          maxItems: 6
          description: >
            Las lecciones del lado después de la primera: una autopsia toca más de un skill.
            Cada una necesita `skill` y `leccion` (si no, se rechaza con motivo) y es un
            item propio del inventario con clave `fixture:lado:2`, `:3`…; hereda el
            veredicto del lado y no lleva etiqueta de Jev (se sella sobre la primera).
          items:
            type: object
            required: [skill, leccion]
            properties:
              skill: { type: string }
              reglaTocada: { type: string }
              leccion: { type: string }
              queP: { type: string }
    VeredictoEntrada:
      type: object
      description: >
        La respuesta del GET se puede re-depositar tal cual: `acredita`, `falsador`,
        `rechazos`, `cerradoEn`, `actualizadoEn`, `objetivo` y `sinPronosticoPrevio` son
        eco de lo calculado y se ignoran en silencio, no se rechazan.


        Una clave AUSENTE conserva lo que ya había: `falsadorCumplido` que no viaja no
        borra el `false` guardado. Para borrarlo hay que mandar `falsadorCumplido: null`
        a propósito.
      required: [seleccion, modoEvaluacion, porLado]
      properties:
        seleccion:
          type: string
          enum: [ciega, por_resultado, post_resultado]
          description: >
            La población del caso, y NO se puede deducir desde el backend. `ciega` = el
            partido se eligió sin saber nada (el parte de Cowork nace así, de la agenda);
            `por_resultado` = se eligió porque pasó algo; `post_resultado` = se puntuó con
            el marcador ya a la vista. Solo ciega + PRE acredita validación predictiva: las
            otras fijan rúbrica pero no acreditan (docs/APRENDIZAJE.md).
        modoEvaluacion:
          type: string
          enum: [PRE, COND]
          description: >
            Contra qué se puntuó, no cuánto vio quien puntúa. PRE = el caso se cerró contra
            el resultado FINAL; COND = contra un marcador parcial, con el partido rodando,
            así que el acierto es condicional. Todo veredicto se escribe después del partido
            y eso no lo vuelve COND. Declarar PRE sobre un fixture que no figura terminado
            devuelve 422: es comprobable contra nuestra base y se comprueba.
        mancha:
          type: string
          description: >
            Salvedad sobre un caso que SÍ acredita: algo que contar aunque no cambie la
            población. Por ejemplo, el parte se retocó con el partido rodando pero el
            pronóstico no se tocó, o la alineación llegó por un pantallazo sin sellar.
            Va en campo propio y no en `notas` porque una salvedad que solo se encuentra
            leyendo prosa no se encuentra: la pantalla la marca junto a la etiqueta de
            población y una auditoría posterior puede filtrarla.
        falsadorCumplido:
          type: boolean
          nullable: true
          description: >
            ¿OCURRIÓ LA CONDICIÓN del falsador? — no "¿acertó el falsador?". El falsador es
            «la condición observable que declara fallado el pronóstico»; `true` = esa
            condición se dio, `false` = no se dio, `null` = no es comprobable contra la
            evidencia que sirve el backend. La combinación interesante es `true` con el
            pronóstico igualmente acertado: el falsador era malo, y eso es una lección
            sobre el falsador mismo. Leído al revés el campo se vuelve redundante con
            `unXDos.acerto` y no aporta nada.


            Lo declara quien lo comprobó: el falsador es prosa y el backend no verifica
            prosa arbitraria: sirve la evidencia (los goles con su minuto y su lado) y deja
            el juicio fuera.
        porLado:
          type: object
          properties:
            a: { $ref: '#/components/schemas/LadoVeredicto' }
            b: { $ref: '#/components/schemas/LadoVeredicto' }
        notas: { type: string }
    VeredictoObjetivo:
      type: object
      description: Lo que la base responde sola. Se RECALCULA en cada lectura, no se sella.
      properties:
        jugado: { type: boolean }
        motivo: { type: string, description: 'por qué no se pudo calcular' }
        marcador:
          type: object
          properties:
            local: { type: integer }
            visitante: { type: integer }
            texto: { type: string }
            ganador: { type: string, enum: [a, b, empate] }
            terminado: { type: boolean, description: 'false = en curso; el marcador no es un resultado' }
        unXDos:
          type: object
          properties:
            declarado: { type: string, description: 'vacío si no hubo 1X2 o si dos selecciones empataron' }
            real: { type: string, enum: [local, empate, visita] }
            acerto: { type: boolean }
            probabilidadDeclarada: { type: number }
            reparto: { type: object, additionalProperties: { type: number } }
            nota: { type: string }
        marcadorExacto:
          type: object
          properties:
            declarado: { type: string }
            real: { type: string }
            acerto: { type: boolean }
        golesAcotados:
          type: object
          description: 'si los goles reales cayeron en el intervalo de cada lado y en el marcador acotado (REVENTON §17); ausente sin modelo o sin historia'
          properties:
            intervaloLocal: { type: boolean }
            intervaloVisita: { type: boolean }
            marcadorAcotado: { type: boolean }
            probPrometida: { type: number }
            real: { type: string }
        eliminatoria:
          allOf: [{ $ref: '#/components/schemas/Eliminatoria' }]
          description: 'solo en eliminación directa; `avanzaLado` a | b (el 1X2 y `marcador.ganador` siguen a 90'')'
        brier:
          type: object
          properties:
            valor: { type: number, nullable: true }
            escala: { type: string, description: '0 perfecto, 2 máximo, TRES resultados: no comparable con un Brier binario' }
        tde:
          type: object
          description: >
            Una comprobación POR BLOQUE declarado: la echada de cada equipo se observa en
            los goles que RECIBE, así que con dos bloques hay dos ventanas y dos veredictos.
          properties:
            bloques:
              type: array
              items:
                type: object
                properties:
                  ventana: { type: string }
                  desde: { type: integer }
                  hasta: { type: integer }
                  equipo: { type: string, enum: [a, b, ''] }
                  comprobable: { type: boolean }
                  golEnVentana: { type: boolean, nullable: true }
                  goles: { type: array, items: { type: object, additionalProperties: true } }
                  golesEnAnadido: { type: array, items: { type: object, additionalProperties: true } }
                  rojasAntes: { type: array, items: { type: object, additionalProperties: true } }
                  cobrable: { type: boolean, nullable: true, description: 'false = una roja antes del gol o del fin de la ventana, o el partido roto/resuelto antes de ella: no se cobra' }
                  clase: { type: string, nullable: true, enum: [roto, rama_abandonada, null], description: 'roto = el equipo recibió 3 antes de la ventana (disciplina 3); rama_abandonada = marcador 3 arriba antes de la ventana (24)' }
                  ventanaDeRama: { type: boolean, description: 'se midió la ventana declarada en la rama que jugó el partido' }
                  ventanaBase: { type: string, description: 'la ventana del bloque sin rama; `ventana` es la que se cobra (la de la rama si la hubo)' }
                  reloj:
                    type: object
                    nullable: true
                    description: >
                      Cuando se cobra la ventana de la rama, la ventana BASE del reloj medida
                      aparte (con el gol que abrió la rama incluido): la serie del sesgo
                      tardío no se rompe (TDE disciplinas 44c y 45). null si se cobró la base.
                    properties:
                      ventana: { type: string }
                      desde: { type: integer }
                      hasta: { type: integer }
                      golEnVentana: { type: boolean, nullable: true }
                      goles: { type: array, items: { type: object, additionalProperties: true } }
                      cobrable: { type: boolean, nullable: true }
                      clase: { type: string, nullable: true }
                  tramos:
                    type: array
                    description: >
                      TDE v0.1.22 (disciplina 64): el partido en tramos entre goles, con la rama
                      que MANDA por el marcador de ese momento —base (0-0), siMarcaPrimero
                      (ganando), siRecibePrimero (perdiendo), siLeEmpatan (empatado tras ir
                      ganando), siIguala (empatado tras ir perdiendo, candidato)—, su ventana
                      relativa al gol que abre el tramo y si el foco concedió en ella.
                      Observación, no métrica.
                    items:
                      type: object
                      properties:
                        desde: { type: integer }
                        hasta: { type: integer }
                        marcador: { type: string, description: 'goles del foco - goles del rival al empezar el tramo' }
                        estado: { type: string, enum: [inicio, ganando, perdiendo, empatado] }
                        rama: { type: string, enum: [base, siMarcaPrimero, siRecibePrimero, siLeEmpatan, siIguala, siExpulsion], description: 'desde la roja PROPIA manda siExpulsion (44d); un gol del añadido corta en el 45 o el 90' }
                        ramaMarcador: { type: string, description: 'solo tras la roja propia: la rama que daba el marcador' }
                        rojaPropia: { type: integer, description: 'solo tras la roja propia: su minuto' }
                        rojaRival: { type: integer, description: 'solo tras la roja del rival: su minuto' }
                        numerico: { type: string, enum: [inferioridad, superioridad, paridad], description: 'con alguna roja en el partido: el balance de jugadores del foco en el tramo; siExpulsion solo en inferioridad' }
                        declarada: { type: boolean }
                        ventana: { type: string }
                        rango: { type: array, nullable: true, items: { type: integer } }
                        concedio: { type: array, items: { type: integer }, description: 'minutos de los goles que recibió el foco en el tramo' }
                        golEnVentana: { type: boolean, nullable: true, description: 'null = la rama sin ventana legible o su ventana fuera del tramo' }
                        desenlace:
                          type: object
                          description: >
                            TDE v0.1.24 (disciplina 65), solo en tramos de siRecibePrimero, siLeEmpatan
                            y siIguala con desenlace escrito o ISE de rama: lo leído contra el evento que
                            cerró el tramo (gol del rival → se_rompe · propio → rescata · final →
                            sin_mas_goles · roja → null). `abierto` no se cobra.
                          properties:
                            declarado: { type: string, nullable: true }
                            defecto: { type: string, nullable: true, enum: [se_rompe, abierto, null] }
                            lectura: { type: string, enum: [se_rompe, rescata, abierto] }
                            deDefecto: { type: boolean }
                            observado: { type: string, nullable: true, enum: [se_rompe, rescata, sin_mas_goles, null] }
                            cumplido: { type: boolean, nullable: true }
                            iseRama: { type: number, nullable: true }
                            porque: { type: string }
                            noEvaluable: { type: string, description: 'el parte es anterior a la lectura por defecto (TDE v0.1.24, 26/10/2026) y no declaró desenlace: `cumplido` null y no entra a `desenlaceTde`' }
                  reasignacion:
                    type: object
                    description: >
                      Qué rama de la reasignación (disciplina 44) jugó el partido para este
                      equipo —quién marcó primero— y si estaba declarada. Observación, no
                      acierto: la rama no es un pronóstico.
                    properties:
                      rama: { type: string, nullable: true, enum: [siMarcaPrimero, siRecibePrimero, sinGoles, null] }
                      minuto: { type: integer, nullable: true }
                      declarada: { type: boolean }
                      loDeclarado: { $ref: '#/components/schemas/RamaReasignacion' }
                      nota: { type: string }
                      segundoGiro:
                        type: object
                        description: 'TDE v0.1.21 (44a): el que marcó primero recibió el empate; la rama de ventaja caducó en ese minuto. Con la línea siLeEmpatan declarada o no'
                        properties:
                          rama: { type: string, enum: [siLeEmpatan] }
                          minuto: { type: integer }
                          declarada: { type: boolean, nullable: true, description: 'null = no evaluable: el parte se creó durante la caída de Railway del 21-22/10, cuando el servidor rechazaba siLeEmpatan (incidencia 393); no se cobra la 44a' }
                          loDeclarado: { $ref: '#/components/schemas/RamaReasignacion' }
                          nota: { type: string }
                          noEvaluable: { type: string, description: 'el motivo, solo cuando declarada es null' }
                      salida: { type: string, enum: [concedio, marco, sinMasGoles], description: 'TDE v0.1.21 (disciplina 61), solo en siRecibePrimero: lo decide el PRIMER gol posterior al gol en contra (un gol del rival después del empate propio es otro tramo). «marco» no cuenta contra la rama; «sinMasGoles» puede ser la disciplina 14 (lo dice la autopsia)' }
                      notaSalida: { type: string }
                      rojaPrevia: { type: integer, description: 'minuto de la roja propia antes del gol concedido: el mecanismo cambió (disciplina 16) y no cuenta como concesión persiguiendo' }
                  nota: { type: string }
        evidencia:
          type: object
          properties:
            goles:
              type: array
              items:
                type: object
                properties:
                  minuto: { type: integer }
                  lado: { type: string, enum: [a, b] }
                  jugador: { type: string }
                  autogol: { type: boolean }
            primerGol: { type: object, nullable: true, additionalProperties: true }
            var: { type: array, items: { type: object, additionalProperties: true }, description: 'decisiones del VAR de la ficha (gol anulado, penal confirmado o anulado) con minuto, extra, detalle, jugador y lado (1066): evidencia, no cambia el marcador' }
            conFicha: { type: boolean }
            nota: { type: string }
        reventon:
          type: object
          description: >
            El reventón de la burbuja, comprobado por lado (docs/REVENTON.md §11): `declarado` es
            la burbuja total tal como estaba ANTES del partido (vista «al día del partido», la
            misma de /burbujas?antesDe=) y `observado` si la K fusionada de ESE partido la cerró.
            Es observación, no veredicto: el riesgo es una tasa, y la tasa se compara con la del
            backtest en /analisis/cowork/lecciones.
          properties:
            nota: { type: string }
            a: { $ref: '#/components/schemas/ReventonObservado' }
            b: { $ref: '#/components/schemas/ReventonObservado' }
        espina:
          type: object
          description: 'la espina declarada contra lo que hizo la K, por lado. Lo que dice si sirve es la tasa contra la frecuencia en /analisis/cowork/lecciones (acreditables.espina), no un caso'
          properties:
            nota: { type: string }
            a: { $ref: '#/components/schemas/EspinaObservada' }
            b: { $ref: '#/components/schemas/EspinaObservada' }
        tarjetas:
          type: object
          description: >
            Las dos tarjetas del partido leídas como un 1X2 (19/10/2026, Monza 4-0 Cagliari: dos
            tarjetas débiles que coincidían y acertaron). Por lado, el resultado que da su tarjeta
            (a: positiva→local, cero→empate, negativa→visita; b al revés), `estado` concuerdan ·
            discrepan · una sola · sin tarjetas, y si acertaron. Aprendizaje lo acumula en
            `acreditables.espina.tarjeta.partido`.
          properties:
            estado: { type: string, enum: [concuerdan, discrepan, una sola, sin tarjetas] }
            a: { type: string, nullable: true, enum: [local, empate, visita, null] }
            b: { type: string, nullable: true, enum: [local, empate, visita, null] }
            dicen: { type: string, nullable: true, description: 'el resultado de las tarjetas si concuerdan o hay una sola' }
            real: { type: string }
            ambasDebiles: { type: boolean }
            cumplida: { type: boolean, nullable: true }
            aciertaA: { type: boolean, nullable: true }
            aciertaB: { type: boolean, nullable: true }
        dtp:
          type: object
          nullable: true
          description: 'DTP v1.6: por bloque, la rama del estado de marcador en que jugó el foco (la de más minutos, desde los minutos de gol) y el veredicto del M2 escrito para ESA rama. Sin acierto: el cierre juzga lo que generó la rama, con la conversión aparte'
          properties:
            nota: { type: string }
            porBloque:
              type: array
              items:
                type: object
                properties:
                  equipo: { type: string, enum: [a, b] }
                  ramaJugada: { type: string, nullable: true, enum: [igualadoOArriba, persiguiendo, null] }
                  minutos: { type: object, nullable: true, additionalProperties: { type: integer } }
                  veredictoDeLaRama: { type: string }
                  razonDeLaRama: { type: string }
                  veredictoUnico: { type: string }
                  sinRamas: { type: string, description: 'parte anterior a la v1.6, con un solo veredicto' }
                  empateDeMinutos: { type: string, description: 'las dos ramas jugaron los mismos minutos: se juzga igualadoOArriba y el veredicto de persiguiendo también vale (1057)' }
                  sinEventos: { type: string, description: 'hubo goles y la ficha no trae sus minutos' }
        matriz:
          type: object
          description: 'por lado, el escenario que dio el marcador (ganar · empatar · perder) y lo que la matriz había escrito para él. Sin acierto: la matriz es narrativa; si lo escrito apareció lo dice `porLado.*.escenario`'
          properties:
            nota: { type: string }
            a: { $ref: '#/components/schemas/MatrizObservada' }
            b: { $ref: '#/components/schemas/MatrizObservada' }
        otrasFamilias:
          type: object
          description: 'las burbujas de doble oportunidad, márgenes y goles destacadas ANTES del partido que este marcador cortó (REVENTON §15). `porExplicar` = grande (5+) o en su récord: la causa va en porLado.*.cortes. Observación, sin tasa'
          properties:
            nota: { type: string }
            a: { $ref: '#/components/schemas/FamiliasCortadas' }
            b: { $ref: '#/components/schemas/FamiliasCortadas' }
    FamiliasCortadas:
      type: object
      properties:
        cortadas:
          type: array
          items:
            type: object
            properties:
              familia: { type: string }
              ambito: { type: string, enum: [local, visita, total] }
              partidos: { type: integer }
              record: { type: string, nullable: true }
              cuidado: { type: boolean }
              improbable: { type: boolean, description: 'rara para la frecuencia propia del equipo (24/10/2026)' }
              antes: { type: string, description: 'la línea de la narrativa como se leía antes del partido' }
              porExplicar: { type: boolean, description: 'grande (5+) o en su récord, Y rara para su frecuencia: una sequía habitual no pide causa (incidencia 450)' }
        siguieron: { type: integer }
        porExplicar: { type: integer }
        nota: { type: string }
    MatrizObservada:
      type: object
      properties:
        escenario: { type: string, enum: [ganar, empatar, perder] }
        escrito: { type: object, additionalProperties: { type: string } }
        declarado: { type: boolean }
    MatrizLado:
      type: object
      properties:
        ganar:
          type: object
          properties: { tactica: { type: string }, pelotaParada: { type: string }, reloj: { type: string }, base: { type: string }, probabilidad: { type: number, description: 'probabilidad estimada del escenario, 0-100' } }
        empatar:
          type: object
          properties: { tactica: { type: string }, campo: { type: string }, dato: { type: string }, probabilidad: { type: number, description: 'probabilidad estimada del escenario, 0-100' } }
        perder:
          type: object
          properties: { gatillo: { type: string }, errorSistemico: { type: string }, psicologico: { type: string }, goleada: { type: string }, probabilidad: { type: number, description: 'probabilidad estimada del escenario, 0-100' } }
    MatrizParte:
      type: object
      description: >
        Matriz de Escenarios v2.0 (15/10/2026): cómo gana, empata y pierde CADA equipo con
        sus palancas, y la `probabilidad` estimada de cada escenario (32 · «32 %» · 0.32).
        Si se aparta más de 5 puntos del 1X2 de `pronostico.probabilidades`, el recibo lo
        avisa en `matrizVsPronostico` (no se rechaza). Un
        escenario como texto suelto entra en su primera fila; alias del skill aceptados
        (`pelota_parada`, `gestionReloj`, `gana`/`empata`/`pierde`…).
      properties:
        a: { $ref: '#/components/schemas/MatrizLado' }
        b: { $ref: '#/components/schemas/MatrizLado' }
        confirma: { type: string, description: 'un caso real que confirma la lectura' }
        contradice: { type: string, description: 'un caso real que la contradice' }
    EspinaLado:
      type: object
      properties:
        lectura: { type: string, enum: [positiva, cero, negativa, neutra], description: 'neutra solo en partes anteriores a sad-analysis v4.4: un depósito nuevo con neutra se rechaza con motivo (sugiere guia pronostico)' }
        guia:
          type: string
          enum: [total, condicion, pronostico]
          description: 'qué K guió la lectura: la total (por defecto), la de la condición en que juega hoy (local si es local, visita si es visitante) o, sin lectura propia, el 1X2 declarado (`pronostico`, sad-analysis v4.4: el elegido positiva, el otro negativa, el empate cero en los dos; Aprendizaje la mide aparte en porGuia). Una guía desconocida se rechaza con motivo y se toma la total'
        porque: { type: string }
    EspinaObservada:
      type: object
      properties:
        lectura: { type: string, nullable: true, enum: [positiva, cero, negativa, neutra, null] }
        guia: { type: string, enum: [total, condicion, pronostico] }
        porque: { type: string }
        resultado: { type: string, nullable: true, enum: [gana, empata, pierde, null] }
        movimiento: { type: string, nullable: true, enum: [positiva, cero, negativa, null], description: 'adónde fue la K total del equipo' }
        cumplida: { type: boolean, nullable: true, description: 'lectura == movimiento; neutra o sin lectura = null' }
        tarjeta:
          type: object
          nullable: true
          description: 'la espina de la tarjeta de ese lado, con `cumplida` contra el movimiento real: la de la familia total (la del reventón declarado antes del partido) o, si la espina se leyó con `guia: condicion`, la de la K de la condición al día del partido (`guia`). null sin burbuja abierta'
          properties:
            lectura: { type: string, enum: [positiva, cero, negativa] }
            movimiento: { type: string, enum: [sigue, cero, cambio] }
            prob: { type: number }
            fuerza: { type: string, enum: [fuerte, debil] }
            nivel: { type: string, nullable: true }
            signo: { type: string, nullable: true }
            cumplida: { type: boolean, nullable: true }
            guia: { type: string, enum: [condicion], description: 'solo si la tarjeta es la de la condición' }
        vsTarjeta: { type: string, nullable: true, enum: [sigue, contra, null], description: 'si la lectura del analista coincidió con la de la tarjeta o fue contra ella; neutra o sin tarjeta = null' }
    TasaWilson:
      type: object
      properties:
        lados: { type: integer }
        aciertos: { type: integer }
        tasa: { type: number, nullable: true }
        intervalo: { type: array, nullable: true, items: { type: number } }
    EspinaTarjeta:
      type: object
      description: >
        La espina que da la TARJETA sola (19/10/2026): el movimiento más probable de
        `riesgo.movimiento` (guía calibrada del backtest, docs/REVENTON.md §14) traducido a
        lectura —sigue → positiva con racha + / negativa con racha −; cero → cero; cambio → el
        signo opuesto—. `fuerte` con prob ≥ 0.50; débil cuando el reventón es probable pero no
        se sabe cómo (riesgo alto). Es el punto de partida del parte: ir contra ella se dice en
        `espina.*.porque` y se mide en /analisis/cowork/espina/calibracion.
      properties:
        lectura: { type: string, enum: [positiva, cero, negativa] }
        movimiento: { type: string, enum: [sigue, cero, cambio] }
        prob: { type: number }
        fuerza: { type: string, enum: [fuerte, debil] }
        escala: { type: string, description: 'solo con escala distinta (ESCALA-LIGAS, 22/10/2026): la relación entre las bases. La tarjeta NO cambia: se marca' }
        notaEscala: { type: string, description: 'por qué no se la sigue por ser fuerte: la guía se midió con rivales de su propia liga' }
    ReventonObservado:
      type: object
      properties:
        comprobable: { type: boolean, description: 'false sin burbuja previa o si el pipeline aún no calculó la constante del partido' }
        sinBurbuja: { type: boolean, description: 'no había burbuja abierta antes: nada que reventar' }
        condicion:
          type: object
          nullable: true
          description: 'la K de la condición de ese día (local para a, visita para b), del mismo cálculo «al día del partido»: actual, riesgo.nivel y espinaTarjeta. Es la tarjeta que mide la espina leída con guia condicion'
          additionalProperties: true
        declarado:
          type: object
          nullable: true
          properties:
            signo: { type: string, enum: ['+', '-'] }
            k: { type: number }
            partidos: { type: integer }
            riesgo:
              type: object
              properties:
                nivel: { type: string, enum: [bajo, medio, alto, muy alto, sin base] }
                puntos: { type: integer }
            rivalTramo: { type: string, nullable: true }
            extremo: { type: boolean, description: 'la alerta K-EXTREMO estaba activa antes del partido' }
        observado:
          type: object
          nullable: true
          properties:
            revento: { type: boolean }
            kDespues: { type: number }
            signoDespues: { type: string, enum: ['+', '-', '0'] }
            kPico: { type: number, nullable: true, description: 'la K pico de la burbuja que cerró' }
            partidos: { type: integer, nullable: true }
        pronosticoVsRacha:
          type: string
          nullable: true
          enum: [aFavor, enContra, neutro, null]
          description: >
            Si el 1X2 declarado apostó a que la racha de este lado SIGUE (aFavor: gana con
            burbuja «+», pierde con «−»), se corta (enContra) o al empate (neutro). null sin
            burbuja o sin 1X2 declarado.
        respetoRiesgo:
          type: boolean
          nullable: true
          description: >
            SOLO con riesgo alto o muy alto antes del partido: true si el 1X2 no siguió la
            racha (lo que pide el protocolo), false si la siguió. null = no aplica (riesgo
            bajo/medio, sin base, sin burbuja o sin 1X2): un null no es un fallo.
        nota: { type: string }
    Veredicto:
      type: object
      properties:
        fixtureId: { type: integer }
        modoFallo:
          $ref: '#/components/schemas/ModoFallo'
        seleccion: { type: string, enum: [ciega, por_resultado, post_resultado] }
        modoEvaluacion: { type: string, enum: [PRE, COND] }
        acredita: { type: boolean, description: 'ciega + PRE, y solo eso' }
        mancha: { type: string, description: 'salvedad declarada sobre un caso que acredita; vacía casi siempre' }
        falsador:
          type: object
          properties:
            texto: { type: string }
            cumplido: { type: boolean, nullable: true }
        porLado:
          type: object
          additionalProperties: { $ref: '#/components/schemas/LadoVeredicto' }
        notas: { type: string }
        cerradoEn:
          type: string
          description: >
            Cuándo se cerró el caso POR PRIMERA VEZ. Es evidencia, no un `updated_at`: con
            esa fecha se comprueba que el juicio se escribió cuando se dice. Un re-depósito
            NO la re-sella.
        actualizadoEn:
          type: string
          description: "'' si el caso solo se cerró una vez; con fecha si se corrigió después"
        objetivo: { $ref: '#/components/schemas/VeredictoObjetivo' }
        sinPronosticoPrevio:
          type: array
          items: { type: string }
          description: 'equipos cuyo eslabón no recibió veredicto por no tener pronóstico declarado'
