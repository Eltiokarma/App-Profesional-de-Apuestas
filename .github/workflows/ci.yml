name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar Motor SAD contra el doc de extracción
        run: npm run test:motor
      - name: Verificar la capa de visualización de las K
        run: npm run test:kview
      - name: Verificar el reventón de burbuja (espejo TS vs vectores dorados)
        run: npm run test:burbuja
      - name: Otras burbujas (DC, márgenes, goles), espejo TS vs vectores dorados
        run: npm run test:familias
      - name: Typecheck + build de producción
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias del backend
        run: pip install -r backend/requirements.txt
      - name: Tests del contrato SAD API (seed demo + verificaciones)
        run: python -m backend.test_api
      - name: Tests del acumulador k_cuota
        run: python -m backend.test_cuota
      - name: Tests del ciclo en vivo (cuotas en juego por liga)
        run: python -m backend.test_en_vivo
      - name: Tests de la estrategia de cuotas prepartido (lote vs por fixture)
        run: python -m backend.test_cuotas_lote
      - name: Tests del presupuesto de jugadores (TTL separado y padrón)
        run: python -m backend.test_jugadores
      - name: Tests de la despensa en bloque (ahorro del EFE)
        run: python -m backend.test_despensa
      - name: Tests de la ficha de partido (fase A del DTP)
        run: python -m backend.test_ficha
      - name: Tests del DTP (cadena rodante y anti-hindsight)
        run: python -m backend.test_dtp
      - name: Tests del calendario SAD (bloque G calculado, sin IA)
        run: python -m backend.test_calendario
      - name: Tests de la cronología SAD (partidos del timeline calculados)
        run: python -m backend.test_cronologia
      - name: Backtest de goles (las constantes acotan; sintéticos + demo)
        run: python -m backend.test_backtest_goles
      - name: Quién pasó una llave (penales, global, prórroga; incidencia 774)
        run: python -m backend.test_eliminatoria
      - name: Sancionados de la base (rojas y amarillas) y escaneo preventivo
        run: python -m backend.test_sanciones
      - name: La identidad de jugadores y DT, en un solo lugar
        run: python -m backend.test_identidad
      - name: De qué está hecho el nivel del motor (amistosos e internacionales en la ventana)
        run: |
          python -m backend.test_ventana_nivel
          python -m backend.test_backtest_nivel_ventana
      - name: El escaneo preventivo del CÓDIGO (cada clase de falla con su guardia)
        run: python -m backend.test_arquitectura
      - name: Otras burbujas (familias) y sus backtests
        run: |
          python -m backend.test_familias
          python -m backend.test_backtest_familias
          python -m backend.test_backtest_forma
      - name: Jev (adaptador, coherencia del parte y modo de fallo; sin clave corre simulado)
        run: |
          python -m backend.test_jev
          python -m backend.test_coherencia
          python -m backend.test_modo_fallo
      - name: Tests del chequeo previo del EFE (qué cuesta antes de gastar)
        run: python -m backend.test_preflight
      - name: Tests del parte de Cowork (bloque F calculado y cruce del once)
        run: python -m backend.test_cowork
      - name: Simulación de apuesta (plana, Kelly y martingala; versión por hora de subida)
        run: python -m backend.test_simulacion
      - name: Tests del reventón de burbuja (guía calculada, vectores dorados compartidos con el TS)
        run: python -m backend.test_burbuja
      - name: Tests del backtest del reventón (anti-fuga y conteos)
        run: python -m backend.test_backtest_burbuja
      - name: Backtest de la burbuja en el 1X2 (método sobre sintéticos + demo)
        run: python -m backend.test_backtest_1x2
      - name: Pipeline sin dejar a quien lee sin tabla (rehace las derivadas en una transacción)
        run: python -m backend.ingesta.test_pipeline
